/* ---------- ORDEM DE EXECUÇÃO ---------- */
// Ordem real em que os exercícios foram feitos numa sessão: usa o timestamp
// da 1ª série de cada um; sem timestamp (sessões importadas) cai na ordem gravada.
function execOrderOf(sess){
  return (sess.exercises||[])
    .map((e,i)=>{const ts=(e.sets||[]).map(s=>s.t).filter(Boolean);
                 return {n:e.n,t:ts.length?Math.min.apply(null,ts):Infinity,i:i};})
    .sort((a,b)=>(a.t-b.t)||(a.i-b.i))      // Infinity-Infinity=NaN (falsy) -> desempata por i
    .map(x=>x.n);
}
// Última sessão REPRESENTATIVA do dia: a mais recente que cobriu pelo menos 60%
// dos exercícios do template. Evita que um treino abortado (ex.: 1 exercício)
// bagunce a ordem de todos os próximos.
/* v1.16.0 — a régua saiu pra função própria porque a confirmação (P8.1) usa a MESMA, sobre
   outro recorte de sessões: duas cópias do 60 % seriam duas réguas no primeiro ajuste. */
/* v1.17.0 — conta só os exercícios sem `opc`: com 2 fixos e 3 opcionais, exigir 3 para ser
   "representativo" faria a comparação quase nunca aparecer. Nas letras sem opc dá o de antes. */
function refMin(d){const t=templates[d];return t?Math.max(2,Math.ceil(semOpc(t.ex).length*0.6)):null;}
function nExComSerie(s){return (s.exercises||[]).filter(e=>(e.sets||[]).length).length;}
function refSessionFor(d){
  const min=refMin(d); if(min===null) return null;
  const f=sessions.filter(s=>s.day===d&&doCiclo(s));   // v1.20.0: só o ciclo atual — o 1º A do C5 abre na ordem do template
  for(let i=f.length-1;i>=0;i--){
    if(nExComSerie(f[i])>=min) return f[i];
  }
  return null;
}
// Reordena os exercícios do template na ordem da última sessão representativa.
// Exercícios novos (que não estavam nela) mantêm a ordem do template, no fim.
function orderLikeLast(d,exs){
  const last=refSessionFor(d);
  if(!last||!(last.exercises||[]).length) return exs;
  const idx=new Map(execOrderOf(last).map((n,i)=>[n,i]));
  return exs.map((e,i)=>({e:e,i:i}))
    .sort((a,b)=>{const ia=idx.has(a.e.n)?idx.get(a.e.n):Infinity,
                        ib=idx.has(b.e.n)?idx.get(b.e.n):Infinity;
                  return (ia-ib)||(a.i-b.i);})
    .map(x=>x.e);
}

/* v1.15.0 — `origem` = de onde ele começou: "heroi" (o botão do treino recomendado) ou
   "outro" (um tile, com o herói na tela). Vai pra sessão salva como `inicio`, campo aditivo:
   é a única forma de saber se a regra do "mais parado" é a dele (meta: ≥ 60% pelo herói).
   Sem herói na tela (erro, órfã, histórico ilegível) o campo NÃO é gravado — ausência, não
   um "outro" que contaria contra a regra sem ela ter sido mostrada. */
function startSession(d,origem){
  if(active && !confirm("Já existe um treino em andamento. Descartar e começar "+d+"?"))return;
  if(active)descartarAtiva();   // v1.18.0: substituir também é descartar — conta no iolog
  const t=templates[d];
  active={day:d,date:today(),ciclo:cfg.ciclo,plano:cfg.plano,started:Date.now(),
    exercises:orderLikeLast(d,semOpc(t.ex)).map(exDoTemplate)};  // v1.14.1: template sujo não suja a sessão · v1.17.0: opcional não nasce na sessão
  /* v1.17.0 — `avulso` vai pra sessão e é ele que as contas de frequência leem. Avulso não
     grava `inicio`: nunca concorre com o herói. */
  if(t.avulso)active.avulso=true;
  else if(origem==="heroi"||origem==="outro")active.inicio=origem;
  ensureIds(active);
  save(K.active,active);go("log");
}
function persistActive(){save(K.active,active);}
function exDoTemplate(e){return {n:trimNome(e.n),sr:e.sr,rest:e.rest,mvw:e.mvw,notes:e.notes,sets:[]};}
/* v1.17.0 — card "Opcionais": os `opc` do template que ainda NÃO estão na sessão (por
   trimNome), na ordem do template. Derivado a cada render: se o exercício sair da sessão, ele
   volta sozinho; com todos incluídos, ou template sem opcionais, o card não existe. */
function opcionaisPendentes(act){
  const t=act&&templates[act.day];if(!t)return [];
  const na=new Set((act.exercises||[]).map(e=>trimNome(e.n)));
  return (t.ex||[]).filter(e=>e.opc&&!na.has(trimNome(e.n)));
}
function incluirOpcional(e){
  active.exercises.push(exDoTemplate(e));   // alvo, descanso, MVW e notas do template — não o 3×10 · 60s do "+ Adicionar"
  ensureIds(active);
  active.focoId=active.exercises[active.exercises.length-1].id;   // v1.18.0: acabou de escolher, vira o foco
  persistActive();wantScrollFoco=true;render();
}
function ultimaVezTxt(nome){
  if(readFailed(K.sess))return "histórico não lido";   // cicatriz nº 1: ausência não vira "primeira vez"
  return ultimaTxt(nome);                              // v1.18.0: a regra da linha pendente (emenda E › P8.2)
}
/* v1.18.0 — "Última" na linha pendente, spec P8 (c). Com carga: a série de maior carga (entre
   elas, mais reps). Sem carga: reps (iguais → "10 reps"; diferentes → "10·9·9 reps"). A data só
   aparece quando a última vez NÃO foi a sessão anterior da mesma letra. null = histórico não
   lido (quem chama decide: a linha pendente omite, o card de opcionais diz que não leu). */
function melhorSerie(sets){
  const v=(sets||[]).filter(temReps);if(!v.length)return null;
  if(v.every(semCarga)){const rs=v.map(st=>String(st.r).trim());
    return {carga:false,txt:(rs.every(r=>r===rs[0])?rs[0]:rs.join("·"))+" reps",maxR:Math.max.apply(null,rs.map(r=>parseFloat(r)||0))};}
  let b=null;v.forEach(st=>{if(semCarga(st))return;const w=parseFloat(st.w),r=parseFloat(st.r)||0;
    if(!b||w>b.w||(w===b.w&&r>b.r))b={w:w,r:r,st:st};});
  return {carga:true,txt:String(b.st.w).trim()+"kg×"+String(b.st.r).trim()};
}
function ultimaTxt(nome){
  if(readFailed(K.sess))return null;
  const H=exerciseHistory(trimNome(nome));
  if(!H.length)return "primeira vez";
  const m=melhorSerie(H[0].sets);if(!m)return "primeira vez";
  const ref=active?lastSessionFor(active.day):null;
  const daAnterior=!!(ref&&ref.date===H[0].date&&ref.day===H[0].day);
  return "última "+m.txt+(daAnterior?"":" ("+ddmm(H[0].date)+")");
}
function opcionaisCard(){
  const pend=opcionaisPendentes(active);
  if(!pend.length)return null;
  const c=el("div","card opc-card");
  c.appendChild(el("h3",null,"Opcionais")).style.margin="0 0 2px";
  c.appendChild(el("div","muted","toque para incluir · não conta no progresso até entrar"));
  pend.forEach(e=>{
    const r=el("div","sess opc-row");
    r.setAttribute("role","button");r.tabIndex=0;
    r.setAttribute("aria-label","Incluir "+trimNome(e.n)+" no treino");
    r.innerHTML="<div style='min-width:0'><div style='font-weight:650'>"+esc(trimNome(e.n))+"</div>"+
      "<div class='muted'>"+esc(ultimaVezTxt(e.n))+"</div></div><span class='chev' aria-hidden='true'>›</span>";
    r.onclick=()=>incluirOpcional(e);
    r.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();incluirOpcional(e);}};
    c.appendChild(r);
  });
  return c;
}

/* ---------- v1.18.0 — Treino em andamento (P8.2) ----------
   Cabeçalho fixo (letra · nome · tempo total · 🎵 ? ⋯ · progresso), UM exercício aberto (o foco,
   regra em focoIdx), os outros em linha, na ordem estável de active.exercises — os feitos NÃO
   vão mais pro fim (a lista não se mexe debaixo do polegar; fecha o P4.5). Descartar mora no ⋯. */
const TR_AJUDA="Preencha kg e reps → <b>Série feita · descansar</b> → <b>Próxima série</b> grava a pausa. 🔍 mostra o exercício.";
function plural(n,um,varios){return n+" "+(n===1?um:varios);}
function progTxt(pr){return pr.x+" de "+pr.m+(pr.m===1?" exercício":" exercícios")+" · "+plural(pr.s,"série","séries");}
function cabecalhoTreino(t,pr,fi){
  const h=el("div","tr-head");
  const row=el("div","row");row.style.gap="8px";
  row.appendChild(el("div","tt","<h1>Treino "+esc(active.day)+"</h1><div class='muted nm'>"+esc(t?t.name:"")+"</div>"));
  const ck=el("div","tr-clock");
  /* Sessão órfã: um relógio de 30 h não é tempo de treino. */
  if(isOrfa())ck.innerHTML="<div style='color:var(--warn-tx);font-weight:650;font-size:13px'>iniciado em "+esc(ddmm(active.date))+"</div>";
  else if(active.started)ck.innerHTML="<div class='sb-t' id='trClock'>"+fmtDur(Date.now()-active.started)+"</div><div class='muted' style='font-size:11px'>tempo total</div>";
  row.appendChild(ck);
  const mus=el("button","btn-ghost tr-ic","🎵");mus.setAttribute("aria-label","Abrir a playlist");mus.onclick=openMusic;
  const aj=el("button","btn-ghost tr-ic","?");aj.setAttribute("aria-label","Como usar esta tela");
  aj.setAttribute("aria-expanded",trPainel==="ajuda"?"true":"false");aj.setAttribute("aria-controls","trPainel");
  aj.onclick=()=>{trPainel=trPainel==="ajuda"?null:"ajuda";render();};
  const mais=el("button","btn-ghost tr-ic","⋯");mais.setAttribute("aria-label","Mais opções do treino");
  mais.setAttribute("aria-expanded",trPainel==="mais"?"true":"false");mais.setAttribute("aria-controls","trPainel");
  mais.onclick=()=>{trPainel=trPainel==="mais"?null:"mais";render();};
  row.appendChild(mus);row.appendChild(aj);row.appendChild(mais);
  h.appendChild(row);
  if(pr.m){
    const sg=el("div","tr-seg");sg.setAttribute("aria-hidden","true");
    active.exercises.forEach((e,i)=>{const s=el("i");
      if(e.done&&completedSets({sets:e.sets||[]})>=1)s.className="ok";
      else if(i===fi)s.className="foco";
      sg.appendChild(s);});
    h.appendChild(sg);
  }
  /* Treino avulso (E): diz que está fora da meta aqui também, não só na Home. */
  if(active.avulso===true)h.appendChild(el("div","muted","avulso · não conta na meta da semana")).style.marginTop=pr.m?"0":"6px";
  const p=el("div","muted",esc(progTxt(pr)));p.id="trProg";if(!pr.m)p.style.marginTop="6px";
  h.appendChild(p);
  return h;
}
function refreshTrProg(){const p=$("#trProg");if(p&&active)p.textContent=progTxt(progresso(active));}
/* Descartar: três toques (⋯ → Descartar treino → confirm) é o preço certo. Grava `discard` no
   iolog ANTES de apagar — é a única forma de contar "treino concluído" contra abandonado. */
function descartarAtiva(){
  if(!active)return;
  logIO("discard",K.active,active.day+" · "+plural(progresso(active).s,"série","séries"));
  clearInterval(swId);swId=null;
  active=null;
  try{localStorage.removeItem(K.active);}
  catch(e){logIO("save-fail",K.active,"descartar: "+e.message);toast("não consegui apagar do armazenamento — ver Diagnóstico");}
}
function painelTreino(){
  const c=el("div","card");c.id="trPainel";
  if(trPainel==="ajuda"){c.appendChild(el("div","muted",TR_AJUDA)).style.fontSize="14px";return c;}
  const r=el("div","grid2");
  const d=el("button","btn-danger","Descartar treino");
  d.onclick=()=>{if(confirm("Descartar este treino? Os dados não serão salvos.")){descartarAtiva();go("home");}};
  const x=el("button","btn-ghost","Cancelar");x.onclick=()=>{trPainel=null;render();};
  r.appendChild(d);r.appendChild(x);c.appendChild(r);
  return c;
}
function renderLog(a){
  const t=templates[active.day];
  const fi=focoIdx(active);
  /* Foco recém-aberto sem série: o app cria UMA linha vazia (persistida; o finishSession já
     descarta linha sem reps). Valor nunca — a última vez vai como placeholder. */
  if(fi>=0){const fe=active.exercises[fi];if(!fe.done&&!(fe.sets||[]).length){fe.sets.push({w:"",r:""});persistActive();}}
  a.appendChild(cabecalhoTreino(t,progresso(active),fi));
  if(trPainel)a.appendChild(painelTreino());
  /* Instrução aberta só na instalação nova. Com a leitura do histórico falhando, `sessions` vem
     vazio — isso NÃO é instalação nova, e a instrução fica só atrás do ?. */
  else if(!sessions.length&&!readFailed(K.sess)){const i=el("div","muted",TR_AJUDA);i.style.marginBottom="12px";a.appendChild(i);}

  const order=active.exercises.map((e,i)=>i);   // ordem estável: a de orderLikeLast, sem mandar os feitos pro fim
  const nodes={};
  order.forEach(i=>{const e=active.exercises[i];const n=i===fi?exCard(e,i,true):exLinha(e,i);nodes[i]=n;a.appendChild(n);});
  if(wantScrollFoco){
    wantScrollFoco=false;const card=nodes[fi];
    if(card)setTimeout(()=>{const r=card.getBoundingClientRect(),hd=$(".tr-head");
      const topo=hd?hd.getBoundingClientRect().bottom:0;
      if(r.top<topo||r.top>window.innerHeight*0.55)card.scrollIntoView({block:"start"});},40);
  }

  /* P4.7 — a lista NÃO reordena durante o treino: mexer debaixo do polegar troca meio
     scroll por um toque no exercício errado. Medido no navegador: o render() a cada série
     preserva a rolagem (nada força layout entre o innerHTML="" e os appendChild), então
     não há posição a consertar ali. O que perde o lugar é a retomada — go("log") faz
     scrollTo(0,0) e o reload nasce no topo. Só nesses dois casos a tela vai até o
     exercício do momento. Isto é rolagem, não uma quarta regra de ordenação. */
  if(wantScrollActive){
    wantScrollActive=false;
    let alvo=fi;   // v1.18.0: o foco — a mesma regra do AGORA da Home quando ele não tocou em nada
    const card=nodes[alvo];
    /* Sem `behavior:"smooth"` de propósito: medido no navegador, o scroll suave é
       descartado quando o documento está `hidden` — que é exatamente o caso de uma aba
       restaurada. Instantâneo sempre acontece, e numa retomada não há nada pra animar. */
    if(card&&order.indexOf(alvo)>0)setTimeout(()=>card.scrollIntoView({block:"center"}),60);
  }

  const opc=opcionaisCard();if(opc)a.appendChild(opc);   // v1.17.0: depois da lista, antes do + Adicionar

  const addBtn=el("button","btn-ghost","+ Adicionar exercício");addBtn.style.width="100%";addBtn.style.marginBottom="12px";
  addBtn.onclick=()=>{addExOpen=true;render();};
  a.appendChild(addExOpen?addExPanel():addBtn);

  const fin=el("button","btn-primary","✓ Finalizar treino");fin.style.width="100%";fin.style.minHeight="52px";fin.onclick=finishSession;
  a.appendChild(fin);
  a.appendChild(el("div",null,"<div style='height:110px'></div>"));   // Descartar saiu daqui: mora no ⋯ (v1.18.0)
}

/* ============ ADICIONAR EXERCÍCIO (P4.8) ============ */
/* Não é caminho de exceção: 43 das 81 sessões (53%) têm ao menos um exercício fora do
   template. Adicionar no meio do treino é o comportamento normal, não o acidente — e até
   aqui a única porta era um prompt() de texto livre, o pior controle possível pra uma mão
   suada em pé. Ele já partiu 3 séries históricas em duas chaves cada.
   (o `let addExOpen` mora lá em cima, junto do wantScrollActive: o go() o zera.) */

/* Compara nomes ignorando caixa, acento e pontuação. NUNCA é o que se grava: serve só pra
   reconhecer que "OVERHEAD BANCO", "Overhead banco" e "Abdomen - máquina" apontam pro
   mesmo exercício que já está no histórico. */
function normNome(s){return String(s||"").trim().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g," ").trim();}

/* Fonte da lista: nomes distintos das sessões ∪ nomes dos templates — as duas já no
   localStorage, zero dependência nova. As notas do vault ficam de fora: o app não as
   enxerga, e criar esse import é inventar uma dependência que ninguém vai manter.
   `cont` é nº de SESSÕES em que o nome aparece, não nº de séries. */
function exNameOptions(){
  const falhou=readFailed(K.sess);
  const cont={};
  if(!falhou)sessions.forEach(s=>{
    const vistos={};
    (s.exercises||[]).forEach(e=>{const n=(e.n||"").trim();
      if(!n||vistos[n])return;vistos[n]=1;cont[n]=(cont[n]||0)+1;});
  });
  Object.keys(templates).forEach(d=>(templates[d].ex||[]).forEach(e=>{
    const n=(e.n||"").trim();if(n&&cont[n]==null)cont[n]=0;}));
  const lista=Object.keys(cont).sort((a,b)=>(cont[b]-cont[a])||(a<b?-1:1));
  return {lista:lista,cont:cont,falhou:falhou};
}

/* Camada 2 — se o que ele digitou normaliza igual a um nome que já existe, grava o nome que
   já existe. Silencioso é aceitável AQUI e só aqui, porque o resultado é o dado ficar mais
   junto, nunca mais separado. Ainda assim a tela diz qual nome foi usado: escolher por ele
   é uma coisa, não contar é outra. */
function addExercicio(nome){
  const n=String(nome||"").trim();
  if(!n)return;
  const canonico=exNameOptions().lista.find(x=>normNome(x)===normNome(n))||n;
  active.exercises.push({n:canonico,sr:"3×10",rest:60,mvw:false,notes:"",sets:[]});
  ensureIds(active);addExOpen=false;
  active.focoId=active.exercises[active.exercises.length-1].id;   // v1.18.0: exercício adicionado vira o foco
  persistActive();wantScrollFoco=true;render();
  if(canonico!==n)toast('Usei "'+canonico+'" — já está no histórico');
}

/* A lista não é campo de busca: os 9 nomes mais frequentes cobrem 59 dos 74 usos fora do
   template, então ordenada por uso a resposta está nas primeiras linhas e ele não digita
   nada. O filtro existe, mas NÃO recebe foco — abrir teclado por padrão anula o ganho. */
function addExPanel(){
  const o=exNameOptions();
  const c=el("div","card");
  const head=el("div","row");
  head.innerHTML="<div style='flex:1'><h3 style='margin:0'>Adicionar exercício</h3></div>";
  const fechar=el("button","btn-ghost btn-sm","Cancelar");
  fechar.onclick=()=>{addExOpen=false;render();};
  head.appendChild(fechar);c.appendChild(head);

  c.appendChild(el("div","muted",o.falhou
    ? "histórico não pôde ser lido — mostrando só o template"
    : (o.lista.length ? "Ordenados por nº de sessões. Toque num nome, ou crie outro no fim."
                      : "Sem histórico e sem template — só dá pra criar um nome novo.")));

  const filtro=el("input");filtro.type="text";filtro.placeholder="filtrar (opcional)";
  filtro.style.cssText="margin:9px 0;text-align:left";
  c.appendChild(filtro);

  const box=el("div");c.appendChild(box);
  const linhas=o.lista.map(n=>{
    const r=el("div","sess");r.style.cursor="pointer";
    r.innerHTML="<div style='flex:1'><div style='font-weight:600'>"+esc(n)+"</div>"+
      "<div class='muted'>"+(o.cont[n]?o.cont[n]+(o.cont[n]===1?" sessão":" sessões"):"só no template")+"</div></div>";
    r.onclick=()=>addExercicio(n);
    box.appendChild(r);
    return {n:normNome(n),el:r};
  });
  const semMatch=el("div","muted","nenhum nome bate com o filtro — dá pra criar abaixo");
  semMatch.style.display="none";semMatch.style.padding="13px 0";box.appendChild(semMatch);

  /* Criar novo continua possível e não fica escondido: última linha, sempre visível. */
  const novo=el("button","btn-ghost","+ criar novo…");
  novo.style.width="100%";novo.style.marginTop="9px";
  novo.onclick=()=>{const t=filtro.value.trim();
    if(t)return addExercicio(t);
    addExercicio(prompt("Nome do exercício:"));};
  c.appendChild(novo);

  filtro.oninput=()=>{
    const q=normNome(filtro.value);let vis=0;
    linhas.forEach(l=>{const ok=!q||l.n.indexOf(q)>=0;l.el.style.display=ok?"":"none";if(ok)vis++;});
    semMatch.style.display=(vis||!q)?"none":"";
    const t=filtro.value.trim();
    novo.textContent=t?'+ criar "'+t+'"':"+ criar novo…";
  };
  return c;
}

function exerciseHistory(name){
  const out=[];
  for(let i=sessions.length-1;i>=0;i--){const s=sessions[i];const ex=s.exercises.find(x=>x.n===name);
    if(ex&&ex.sets.length)out.push({date:s.date,day:s.day,sets:ex.sets,top:topWeight(ex.sets),vol:setVol(ex.sets)});}
  return out;
}
function fmtSets(sets){return sets.map(st=>(st.w||"?")+"kg×"+(st.r||"?")).join(" · ");}
// condensa séries idênticas: [100×10 ×4] -> "4× 100kg×10"
function summarizeSets(sets){if(!sets.length)return"";const p=[];let i=0;
  while(i<sets.length){const w=sets[i].w||"?",r=sets[i].r||"?";let c=1;
    while(i+c<sets.length&&(sets[i+c].w||"?")===w&&(sets[i+c].r||"?")===r)c++;
    p.push((c>1?c+"× ":"")+w+"kg×"+r);i+=c;}
  return p.join(" · ");}
// selo de evolução comparando carga máx da última vs a anterior
function trendChip(H){if(H.length<2)return"";const d=Math.round((H[0].top-H[1].top)*10)/10;
  if(d>0)return"<span class='trend up'>↑ +"+d+"kg</span>";
  if(d<0)return"<span class='trend dn'>↓ "+d+"kg</span>";
  return"<span class='trend eq'>= manteve</span>";}

/* v1.18.0 — resumo de séries que respeita exercício sem carga: "3× 10 reps", nunca "?kg×10" nem
   "0kg×10". Só a tela de treino usa; o summarizeSets do Histórico não foi tocado. */
function resumoTr(sets){if(!sets.length)return"";const p=[];let i=0;
  const lb=st=>semCarga(st)?(String(st.r||"?").trim()+" reps"):(String(st.w).trim()+"kg×"+String(st.r||"?").trim());
  while(i<sets.length){const k=lb(sets[i]);let c=1;while(i+c<sets.length&&lb(sets[i+c])===k)c++;
    p.push((c>1?c+"× ":"")+k);i+=c;}
  return p.join(" · ");}
/* Tendência só entre sessões COM carga: sem carga não há chip (o "= manteve" de 0 contra 0 saiu). */
function trendTr(H){if(!H.length||!(H[0].top>0))return"";return trendChip(H.filter(h=>h.top>0));}

/* Linha de exercício fora do foco. Feito: `✓ nome · N séries · 50kg×12` (maior carga e as reps
   dela); pulado: `↷ nome · pulado`. Pendente: nome, alvo e "última …" (ou "2 de 4 séries"), ›.
   Toque em qualquer uma grava focoId e ela vira o foco. */
function exLinha(e,ei){
  const feitasR=(e.sets||[]).filter(temReps);
  const d=el("div","exdone"+(e.done?"":" ex-pend"));
  d.setAttribute("role","button");d.tabIndex=0;
  if(e.done){
    const pulado=!feitasR.length;
    if(pulado)d.style.borderLeftColor="var(--muted)";
    const m=melhorSerie(feitasR);
    const sm=pulado?"pulado":plural(feitasR.length,"série","séries")+(m?" · "+(m.carga?m.txt:m.maxR+" reps"):"");
    /* v1.19.0 — a face da nota no fim do resumo; sem nota, nada (quem diz "sem nota" é a confirmação). */
    const g=!pulado&&gostoValido(e.gosto)?GOSTO[e.gosto]:null;
    d.innerHTML="<span class='ck'"+(pulado?" style='color:var(--muted)'":"")+">"+(pulado?"↷":"✓")+"</span>"+
      "<span class='nm'>"+esc(e.n)+"</span><span class='sm'>"+esc(sm)+"</span>"+
      (g?"<span class='gf' aria-hidden='true'>"+g.f+"</span>":"");
    d.setAttribute("aria-label",e.n+", "+(pulado?"pulado":"feito, "+sm)+(g?", nota: "+g.c:"")+". Abrir");
  }else{
    const alvo=targetSets(e),fe=seriesFeitas(e);
    const partes=[];if(e.sr)partes.push(e.sr);
    if(fe)partes.push(alvo?fe+" de "+alvo+" séries":plural(fe,"série","séries"));
    else{const u=ultimaTxt(e.n);if(u)partes.push(u);}   // histórico não lido: sem "última", nunca "primeira vez"
    d.innerHTML="<div class='u'><span class='nm'>"+esc(e.n)+"</span><div class='muted'>"+esc(partes.join(" · "))+"</div></div>"+
      "<span class='chev' aria-hidden='true'>›</span>";
    d.setAttribute("aria-label",e.n+", "+partes.join(", ")+". Abrir");
  }
  const abrir=()=>{active.focoId=e.id;persistActive();wantScrollFoco=true;render();};
  d.onclick=abrir;
  d.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();abrir();}};
  return d;
}

/* Botão principal do foco — spec P8 (b). O que ele faz quando dá "Série N feita": tudo SÍNCRONO
   no handler, nesta ordem: armAudio() → carimba `t` (só se não houver) e fecha a linha →
   ultimoExercicioId → startRest(ei). O armAudio no mesmo toque é o que deixa o iOS tocar o
   alarme (P5.1); depois de um await ou de um render() ele não destrava. */
function fecharSerie(e,ei){
  armAudio();
  const ia=linhaAberta(e);if(ia<0)return;
  const la=e.sets[ia];
  if(!la.t)la.t=Date.now();
  la.f=1;
  active.ultimoExercicioId=e.id;active.ultimoSetAt=Date.now();
  startRest(ei);   // grava restTimer e persiste
  render();
}
function addSerie(e){const last=e.sets[e.sets.length-1]||{};e.sets.push({w:last.w||"",r:last.r||""});e.done=false;persistActive();render();}
function marcarFeito(e){concluir(e);persistActive();render();}
function acoesFoco(e,ei){
  const alvo=targetSets(e),feitas=seriesFeitas(e),ia=linhaAberta(e);
  const algumaReps=(e.sets||[]).some(temReps);
  const extra=alvo&&feitas>=alvo;
  const bSerie=[extra?"+ Série extra":"+ Série",()=>addSerie(e),"az"];
  const bDesc=["▶ Descanso",()=>{armAudio();startRest(ei);render();},"az"];   // o caminho de antes continua (o hábito dos 92 %)
  const bMarca=algumaReps?["Marcar como feito",()=>marcarFeito(e)]:["Pular exercício",()=>marcarFeito(e)];
  if(swId&&swExIdx===ei)return {txt:"Descansando…",dis:true,sec:[]};
  if(e.done&&ia<0)return {txt:"✓ Feito · recolher",run:()=>{if(active.focoId===e.id)delete active.focoId;persistActive();render();},sec:[["+ Série extra",()=>addSerie(e),"az"]]};
  if(ia>=0){
    const N=ia+1;
    if(!temReps(e.sets[ia]))return {txt:"Preencha as reps da série "+N,dis:true,sec:[bSerie,bDesc,bMarca]};
    const seg=(alvo&&feitas+1>=alvo)?INTER_REST:(e.rest||0);
    return {txt:"Série "+N+" feita · descansar"+(seg?" "+fmtAlvo(seg):""),run:()=>fecharSerie(e,ei),sec:[bSerie,bDesc,bMarca]};
  }
  if(!alvo||feitas<alvo)return {txt:"+ Série "+(e.sets.length+1),run:()=>addSerie(e),sec:[bDesc,bMarca]};
  return {txt:"Marcar exercício como feito",run:()=>marcarFeito(e),sec:[["+ Série extra",()=>addSerie(e),"az"]]};
}
function montaAcoes(box,e,ei){
  box.innerHTML="";
  const A=acoesFoco(e,ei);
  const b=el("button","btn-primary tr-main",esc(A.txt));b.disabled=!!A.dis;if(A.run)b.onclick=A.run;
  box.appendChild(b);
  if(A.sec.length){const r=el("div","row tr-sec");
    A.sec.forEach(([t,fn,cl])=>{const x=el("button","btn-sm"+(cl?" "+cl:""),esc(t));x.onclick=fn;r.appendChild(x);});
    box.appendChild(r);}
  if(mostraGosto(e,ei))box.appendChild(notaGosto(e));
}
/* ---------- v1.19.0 — Nota de gosto (P10.1) ----------
   `gosto: 1|2|3` no exercício da sessão em andamento; ausente = sem nota. NUNCA 0: um "Ok"=0 seria
   lido como ausência por qualquer `if(e.gosto)` (cicatriz nº 1 de trás pra frente). */
const GOSTO={1:{f:"😕",t:"Não gosto",c:"não gosto"},2:{f:"😐",t:"Ok",c:"ok"},3:{f:"🙂",t:"Gosto",c:"gosto"}};
function gostoValido(v){return v===1||v===2||v===3;}
/* Onde a linha aparece — spec P10 (b): (1) descanso ENTRE EXERCÍCIOS deste exercício, (2) exercício
   feito reaberto (`✓ Feito · recolher`), nunca pulado. Só LÊ o estado do descanso: o restTimer
   persistido cobre o reload no meio da pausa, antes de o resumeRest religar o swId. Nada aqui
   escreve em swId, swStart, restTimer nem chama markLap/startRest/stopRest. */
function mostraGosto(e,ei){
  const descansando=(swId&&swExIdx===ei)||!!(active&&active.restTimer&&active.restTimer.i===ei);
  if(descansando)return descansoEntre(e);
  /* Feito com série de verdade. `seriesFeitas>0` cobre o opcional sem alvo marcado como feito
     depois de um `Próxima série`, que deixa uma linha pré-preenchida aberta (sem ela, o caminho 2
     nunca apareceria justo nos opcionais do E). Pulado (nenhuma série) nunca. */
  if(!e.done)return false;
  return seriesFeitas(e)>0||(linhaAberta(e)<0&&(e.sets||[]).some(temReps));
}
function notaGosto(e){
  const g=el("div","gosto");g.setAttribute("role","group");g.setAttribute("aria-label","Quanto você gosta deste exercício?");
  g.appendChild(el("div","gq","Quanto você gosta deste exercício?")).setAttribute("aria-hidden","true");
  const gb=el("div","gb");
  [1,2,3].forEach(v=>{
    const G=GOSTO[v],sel=e.gosto===v;
    const b=el("button","btn-ghost","<span class='gf' aria-hidden='true'>"+G.f+"</span><span>"+G.t+"</span>");
    b.setAttribute("aria-pressed",sel?"true":"false");b.setAttribute("aria-label",G.t+" de "+e.n);
    b.onclick=()=>{
      const antes=e.gosto;
      if(e.gosto===v)delete e.gosto;else e.gosto=v;   // tocar no selecionado apaga o campo — não vira 0 nem null
      /* save() direto, não persistActive(): a nota que não gravou é desfeita na tela e dita, em vez
         de aparecer selecionada sem existir no armazenamento. */
      if(!save(K.active,active)){
        if(antes===undefined)delete e.gosto;else e.gosto=antes;
        toast("não consegui gravar a nota — ver Diagnóstico");
      }
      const novo=notaGosto(e);g.replaceWith(novo);   // repinta só a linha: cronômetro e barra seguem como estavam
      const f=novo.querySelectorAll(".gb button")[v-1];if(f)f.focus({preventScroll:true});
    };
    gb.appendChild(b);
  });
  g.appendChild(gb);
  g.appendChild(el("div","muted gh","opcional · tocar de novo apaga · não mexe no descanso"));
  return g;
}

  c.addEventListener("pointerdown",ev=>{

  /* Última vez + histórico recolhível. Leitura do histórico falhou: o lastbox não aparece. */

    const last=H[0];

    box.appendChild(lh);

      const t=el("button","btn-sm az","histórico ▾");t.style.cssText="background:none;padding:8px 4px;flex:0 0 auto";
      t.setAttribute("aria-expanded","false");
      t.onclick=()=>{const open=more.style.display==="none";more.style.display=open?"block":"none";
        t.textContent=open?"histórico ▴":"histórico ▾";t.setAttribute("aria-expanded",open?"true":"false");};
      lh.appendChild(t);box.appendChild(more);
    }
    c.appendChild(box);
  }

  const acoes=el("div");
  if(e.sets.length){
    const cab=el("div","setrow cab");
    cab.innerHTML="<div></div><label class='fld'>kg</label><label class='fld'>reps</label><div></div>";
    c.appendChild(cab);
  }
  const ref=H.length?H[0].sets:[];
  e.sets.forEach((s,si)=>{
    const r=el("div","setrow");
    const feita=!!(s.t&&temReps(s)&&fechada(s));
    const ix=el("div","idx",(si+1)+(feita?"<b aria-hidden='true'>✓</b>":""));
    ix.setAttribute("aria-label","série "+(si+1)+(feita?", feita":""));
    r.appendChild(ix);
    /* Placeholder da última vez (mesma posição, senão a última série dela) — nunca valor:
       sugestão não executada entraria no histórico se ele não editasse. */
    const u=ref[si]||ref[ref.length-1]||null;
    const phW=u&&!semCarga(u)?String(u.w):"kg", phR=u&&temReps(u)?String(u.r):"reps";
    const w=inp(s.w,phW,v=>{s.w=v;persistActive();});
    const rp=inp(s.r,phR,v=>{s.r=v;touchSet(e,s);persistActive();refreshTrProg();montaAcoes(acoes,e,ei);});
    w.setAttribute("aria-label","kg da série "+(si+1));rp.setAttribute("aria-label","reps da série "+(si+1));
    r.appendChild(w);r.appendChild(rp);

    d.onclick=()=>{e.sets.splice(si,1);persistActive();render();};
    r.appendChild(d);
    c.appendChild(r);
  });
  montaAcoes(acoes,e,ei);
  c.appendChild(acoes);
  return c;
}
/* v1.14.2 — era type="number". O padrão HTML só aceita PONTO como separador decimal:
   no teclado pt-BR o "7,5" chegava com a vírgula descartada e virava 75 — dez vezes a carga,
   sem aviso nenhum. type="text" não sanitiza, então a normalização passa a ser explícita aqui,
   e inputMode="decimal" mantém o teclado numérico do iPhone. Guardamos sempre com ponto:
   todo consumidor faz parseFloat, e parseFloat("7,5") é 7 — errar aqui seria trocar um bug por outro. */
function inp(val,ph,on){const i=el("input");i.type="text";i.inputMode="decimal";i.autocomplete="off";
  i.placeholder=ph;i.value=val==null?"":val;
  i.oninput=()=>{const p=i.selectionStart;
    const limpo=i.value.replace(/,/g,".").replace(/[^0-9.]/g,"").replace(/^(\d*\.\d*).*$/,"$1");
    if(limpo!==i.value){const d=i.value.length-limpo.length;i.value=limpo;
      const c=Math.max(0,(p==null?limpo.length:p)-d);i.setSelectionRange(c,c);}
    on(i.value);};
  i.onfocus=()=>keepFieldVisible(i);return i;}

function lastLogFor(name,day){
  for(let i=sessions.length-1;i>=0;i--){const s=sessions[i];if(day&&s.day!==day)continue;
    const ex=s.exercises.find(x=>x.n===name);if(ex&&ex.sets.length){
      return ex.sets.map(st=>(st.w||"?")+"×"+(st.r||"?")).join(" · ");}}
  return null;
}

let pendingSave=null;   // {sess, v, res} — alimenta a tela de confirmação
function finishSession(){
  // descarta séries em branco e exercícios que ficaram sem nenhuma série válida
  const exs=active.exercises
    .map(({done,open,id,...e})=>({...e,sets:(e.sets||[]).filter(st=>String(st.r==null?"":st.r).trim()!=="")
      .map(({f,...st})=>st)}))   // v1.18.0: `f` (série fechada pelo botão) vive só em active
    .filter(e=>e.sets.length);
  const {ultimoExercicioId,ultimoSetAt,nextEid,restTimer,focoId,...limpo}=active;   // v1.18.0: focoId também não vai pro histórico
  const sess={...limpo,exercises:exs,finished:Date.now()};
  sess.exercises.forEach(e=>e.sets.forEach(st=>{if(!st.t)st.t=sess.finished;}));

  const v=validateSession(sess);
  if(v.erros.length){                              // não salva calado
    logIO("validate-fail",K.sess,v.erros.join(" | "));
    pendingSave={sess:sess,v:v,res:null};go("save");return;
  }
  const antes=(load(K.sess,[])||[]).length;
  sessions.push(sess);
  if(!save(K.sess,sessions)){
    sessions.pop();
    pendingSave={sess:sess,v:v,res:{ok:false,kind:"save",msg:"o navegador recusou a gravação — veja Ajustes → Diagnóstico de dados"}};
    go("save");return;
  }
  const relido=load(K.sess,null);                  // prova de que foi gravado mesmo
  if(!Array.isArray(relido)||relido.length!==antes+1){
    logIO("readback-fail",K.sess,"esperado "+(antes+1)+" treinos, releitura trouxe "+(Array.isArray(relido)?relido.length:"nada"));
    sessions.pop();
    pendingSave={sess:sess,v:v,res:{ok:false,kind:"readback",msg:"o armazenamento não confirmou a gravação"}};
    go("save");return;
  }
  logIO("ok",K.sess,"treino "+sess.day+" "+sess.date+" · "+v.stats.sets+" séries · "+v.stats.vol+" kg·rep",
        JSON.stringify(sessions).length);
  active=null;try{localStorage.removeItem(K.active);}catch(e){}
  pendingSave={sess:sess,v:v,res:{ok:true,total:relido.length},rel:relido[relido.length-1]};   // v1.19.0: a nota da confirmação vem daqui
  go("save");
}

/* ---------- CONFIRMAÇÃO DE SALVAMENTO ---------- */
/* v1.16.0 — P8.1. Ordem: título · status · avisos · números comparados · BACKUP · conteúdo
   salvo (aberto, série a série — cicatriz nº 2) · ações. O backup subiu porque é a única
   apólice contra o iOS apagar o Safari, e até aqui a tela nunca dizia que ele estava atrasado. */
function renderSave(a){
  const P=pendingSave;
  if(!P){go("home");return;}
  const sess=P.sess,v=P.v,res=P.res,ok=!!(res&&res.ok);
  const tpl=templates[sess.day];

  a.appendChild(el("div","row","<div style='flex:1'><h1>"+(ok?"Treino salvo":"Não foi salvo")+
    "</h1><div class='muted'>Treino "+esc(sess.day)+(tpl?" · "+esc(tpl.name):"")+" · "+esc(ddmm(sess.date))+"</div></div>"));

  const st=el("div","card");
  st.style.borderColor=ok?"var(--accent)":"var(--danger-tx)";
  if(ok){                     // o número é o da RELEITURA, não sessions.length
    st.innerHTML="<div style='font-weight:700;color:var(--accent-tx)'>✓ conferido por releitura · "+
      res.total+(res.total===1?" treino":" treinos")+" no histórico</div>";
  }else{
    /* "Nada foi gravado" só onde é verdade: validação recusou (nem tentou) ou save()===false.
       No readback o save() devolveu true e a releitura não bateu — ninguém sabe o que ficou. */
    const leitura=!!(res&&res.kind==="readback");
    st.innerHTML="<div style='font-weight:700;color:var(--danger-tx)'>✕ "+
      esc(res?res.msg:"Sessão incompleta")+"</div>"+
      (v.erros.length?"<ul style='margin:8px 0 0 18px;padding:0'>"+
        v.erros.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":"")+
      "<div style='margin-top:8px;font-weight:650'>"+(leitura
        ?"A sessão continua aberta."   // o título acima já diz que o armazenamento não confirmou
        :"Nada foi gravado neste aparelho.")+"</div>";
  }
  a.appendChild(st);

  if(v.avisos.length){
    const w=el("div","card");w.style.borderColor="var(--warn-tx)";
    w.innerHTML="<div style='font-weight:650;color:var(--warn-tx)'>Avisos</div>"+
      "<ul style='margin:8px 0 0 18px;padding:0'>"+v.avisos.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
    a.appendChild(w);
  }

  if(ok){
    a.appendChild(numerosSalvo(sess,v));
    const bkc=el("div","card");bkc.id="bkCard";
    const bkTopo=el("div");bkc.appendChild(bkTopo);
    const bkh=el("div");
    bkh.onBk=()=>backupTopo(bkc,bkTopo);   // o card se repinta junto do bloco: backup feito vira "hoje" sem recarregar
    renderBackupBlock(bkh);bkc.appendChild(bkh);
    a.appendChild(bkc);
  }

  // conteúdo REAL, não um toast genérico — aberto, sempre
  const c=el("div","card");
  c.appendChild(el("h3",null,ok?"Conteúdo salvo":"Conteúdo que seria salvo"));
  if(!ok){                    // na falha os números ficam aqui, sem comparação (nada foi salvo)
    const g=el("div","row");g.style.cssText="gap:18px;flex-wrap:wrap;margin-bottom:6px";
    const dm=durMin(sess);
    [["EXERCÍCIOS",v.stats.exercicios],["SÉRIES",v.stats.sets],
     ["VOLUME",v.stats.vol?fmtMil(v.stats.vol)+" kg·rep":"sem carga"],["DURAÇÃO",dm?dm+" min":"não registrada"]]
     .forEach(function(p){const b=el("div");
       b.innerHTML="<div class='sb-lbl'>"+p[0]+"</div><div style='font-weight:700;font-variant-numeric:tabular-nums'>"+p[1]+"</div>";
       g.appendChild(b);});
    c.appendChild(g);
  }
  /* v1.19.0 — a nota de gosto de cada exercício. Salvo: vem da RELEITURA (P.rel), como as séries
     provam a gravação; não salvo: do que seria salvo. Ausência é escrita ("sem nota"), nunca "ok".
     Sem controle de edição: o pipeline compara só peso × reps e perderia uma nota mudada depois. */
  const fonte=ok?P.rel:sess;
  let comNota=0;
  sess.exercises.forEach((e,i)=>{
    const re=fonte&&Array.isArray(fonte.exercises)?fonte.exercises[i]:null;
    let nt;
    if(!re||re.n!==e.n)nt="<span class='nt' style='color:var(--warn-tx)'>nota não relida</span>";
    else if(re.gosto===undefined)nt="<span class='nt muted' style='font-weight:400'>sem nota</span>";
    else if(gostoValido(re.gosto)){comNota++;nt="<span class='nt'>"+GOSTO[re.gosto].f+" "+GOSTO[re.gosto].c+"</span>";}
    else nt="<span class='nt' style='color:var(--warn-tx)'>nota inválida: "+esc(String(re.gosto))+"</span>";
    const r=el("div","salvo-ex");r.style.cssText="padding:8px 0;border-top:1px solid var(--border)";
    r.innerHTML="<div class='cab'><span class='nm'>"+esc(e.n)+"</span>"+nt+"</div>"+
      "<div class='muted' style='font-size:13px;font-variant-numeric:tabular-nums'>"+esc(fmtSetsSalvo(e.sets))+"</div>";
    c.appendChild(r);});
  if(sess.exercises.length){
    const rod=el("div","muted","nota de gosto em "+comNota+" de "+plural(sess.exercises.length,"exercício","exercícios"));
    rod.style.cssText="padding-top:8px;border-top:1px solid var(--border);font-weight:600;font-size:12.5px";
    c.appendChild(rod);
  }
  a.appendChild(c);

  const bar=el("div","row wrap");
  if(ok){
    const hm=el("button","btn-ghost","Início");hm.onclick=()=>{pendingSave=null;go("home");};
    const md=el("button","btn-blue","📋 Markdown");md.onclick=()=>showMarkdown(sess);
    bar.appendChild(hm);bar.appendChild(md);
  }else{
    const vo=el("button","btn-primary","← Voltar e corrigir");
    vo.onclick=()=>{pendingSave=null;go(active?"log":"home");};
    const dg=el("button","btn-ghost","Diagnóstico");dg.onclick=()=>{pendingSave=null;go("cfg");};
    bar.appendChild(vo);bar.appendChild(dg);
  }
  a.appendChild(bar);
  a.appendChild(el("div",null,"<div style='height:110px'></div>"));
}
function fmtMil(n){return Math.round(n).toLocaleString("pt-BR");}
/* Série sem carga (Dips, peso do corpo) nunca vira "0kg" nem "?kg": é reps. Só nesta tela —
   o fmtSets do Markdown e do Histórico não foi tocado. */
function semCarga(st){return !(parseFloat(String(st.w==null?"":st.w).replace(",","."))>0);}
function fmtSetsSalvo(sets){
  if(sets.length&&sets.every(semCarga))return sets.map(st=>st.r||"?").join(" · ")+" reps";
  return sets.map(st=>semCarga(st)?(st.r||"?")+" reps":st.w+"kg×"+(st.r||"?")).join(" · ");
}
/* Comparação com a última sessão REPRESENTATIVA da mesma letra ANTERIOR à salva — a mesma
   régua de refSessionFor (refMin). Atenção: aqui a sessão já está em `sessions`; ela própria
   e o que vier depois dela ficam de fora. Devolve {ref} ou {motivo}. */
function refAnterior(sess){
  const d=sess.day,min=refMin(d),M=templates[d]?semOpc(templates[d].ex).length:0;
  if(min===null)return {motivo:"sem o modelo do treino "+d+" para medir — sem comparação"};
  const n=nExComSerie(sess);
  if(n<min)return {motivo:"treino parcial ("+n+" de "+M+" exercícios) — sem comparação"};
  const i=sessions.indexOf(sess);
  /* v1.20.0 — só sessões do MESMO ciclo da salva (a dela, que é o cfg.ciclo de quando
     começou): comparar o 1º A do C5 com um A do C4 é comparar planos diferentes. */
  const ci=cicloKey(sess.ciclo!==undefined?sess.ciclo:cfg.ciclo);
  const ant=(i<0?sessions:sessions.slice(0,i)).filter(s=>s.day===d&&doCiclo(s,ci));
  if(!ant.length)return {motivo:ci?"primeiro "+d+" do "+ci+" — sem comparação":"primeiro treino "+d+" registrado neste app: nada para comparar"};
  for(let k=ant.length-1;k>=0;k--)if(nExComSerie(ant[k])>=min)return {ref:ant[k]};
  return {motivo:"sem treino "+d+" completo anterior"+(ci?" no "+ci:"")+" para comparar"};
}
/* Texto da comparação: seta não, cor de juízo também não — mais volume ou menos tempo não é
   "bom" por definição (spec P8.1, decisão 11). */
function cmpTxt(a,b,un,dt){
  const d=Math.round(a)-Math.round(b);
  if(d===0)return "= igual a "+dt;
  return (d>0?"+":"−")+fmtMil(Math.abs(d))+un+" vs "+dt;
}
function numerosSalvo(sess,v){
  const wrap=el("div");wrap.style.marginBottom="14px";
  const R=refAnterior(sess),ref=R.ref,dt=ref?ddmm(ref.date):"";
  const dur=durMin(sess),vol=sessVol(sess),nEx=nExComSerie(sess);
  const nSets=sess.exercises.reduce((x,e)=>x+e.sets.length,0);
  const linhas={dur:"",vol:"",sets:"",ex:""};
  if(ref){
    const dr=durMin(ref);
    linhas.dur=(dur==null)?"sem duração no treino de "+ddmm(sess.date)
              :(dr==null)?"sem duração no treino de "+dt:cmpTxt(dur,dr," min",dt);
    const vr=sessVol(ref);
    linhas.vol=(!vol)?"":(!vr)?"sem carga no treino de "+dt:cmpTxt(vol,vr,"",dt);
    linhas.sets=cmpTxt(nSets,ref.exercises.reduce((x,e)=>x+(e.sets||[]).length,0),"",dt);
    const A=new Set(sess.exercises.filter(e=>e.sets.length).map(e=>e.n));
    const B=new Set((ref.exercises||[]).filter(e=>(e.sets||[]).length).map(e=>e.n));
    const comum=[...A].filter(x=>B.has(x)).length,iguais=comum===A.size&&comum===B.size;
    linhas.ex=iguais?"= igual a "+dt
            :(A.size===B.size)?comum+" de "+A.size+" em comum com "+dt
            :cmpTxt(A.size,B.size,"",dt)+" · "+comum+" de "+A.size+" em comum";
  }
  const g=el("div","grid2");
  [["DURAÇÃO",dur!=null?dur+" min":"não registrada",linhas.dur],
   ["VOLUME",vol?fmtMil(vol):"sem carga",linhas.vol,vol?"kg·rep":""],
   ["SÉRIES",String(nSets),linhas.sets],
   ["EXERCÍCIOS",String(nEx),linhas.ex]].forEach(p=>{
    const t=el("div","card");t.style.cssText="margin:0;padding:12px 14px";
    t.innerHTML="<div class='sb-lbl'>"+p[0]+"</div>"+
      "<div style='font-weight:750;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.25'>"+esc(p[1])+
        (p[3]?" <span class='muted' style='font-weight:500'>"+p[3]+"</span>":"")+"</div>"+
      (p[2]?"<div class='muted' style='font-variant-numeric:tabular-nums;margin-top:2px'>"+esc(p[2])+"</div>":"");
    g.appendChild(t);});
  wrap.appendChild(g);
  wrap.appendChild(el("div","muted",ref?"Comparado com o treino "+esc(sess.day)+" de "+esc(dt)+".":esc(R.motivo)));
  wrap.lastChild.style.marginTop="8px";
  return wrap;
}
/* Idade do backup: cfg.lastBackup × today(). ≥ 10 dias → âmbar (decisão 7 do Will). Sem
   registro e com treinos → âmbar. O rótulo é "entregue": o app só sabe que entregou o arquivo
   ao iOS, não que ele chegou ao iCloud (cicatriz nº 3). */
const BK_ALERTA=10;
function backupIdade(){
  const lb=cfg.lastBackup;
  if(!lb)return sessions.length?{alerta:true,txt:"nenhum backup registrado neste aparelho"}:{alerta:false,txt:"nenhum backup registrado neste aparelho"};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(lb)))return {alerta:true,txt:"data do último backup ilegível ("+String(lb).slice(0,20)+")"};
  const n=daysSince(lb);
  if(n<0)return {alerta:false,n:n,txt:"último backup entregue em "+ddmm(lb)+" (data à frente do relógio)"};
  return {alerta:n>=BK_ALERTA,n:n,txt:n===0?"hoje":n===1?"ontem":"há "+n+" dias"};
}
function backupTopo(card,host){
  const I=backupIdade();
  card.style.borderColor=I.alerta?"var(--warn-tx)":"";
  const quando=I.n!=null&&I.n>=0;     // idade em dias: cabe no título; o resto é frase
  const titulo=I.alerta?"Falta guardar o backup"+(quando?" · "+I.txt:""):"Backup pro vault";
  const sub=quando?(I.alerta?"último backup entregue em "+ddmm(cfg.lastBackup)
                            :"último backup entregue "+I.txt+(I.n>1?" ("+ddmm(cfg.lastBackup)+")":""))
              :I.txt;
  host.innerHTML="<h3 style='margin:0 0 4px"+(I.alerta?";color:var(--warn-tx)":"")+"'>"+esc(titulo)+"</h3>"+
    "<div class='muted' style='font-variant-numeric:tabular-nums'>"+esc(sub)+"</div>"+
    "<div style='margin:8px 0 12px'>Sem ele, este treino só existe neste iPhone.</div>";
}
/* Conteúdo real do backup, sem abrir o arquivo: o que a tela promete tem que ser
   o que o export leva. */
function backupStats(){
  const sets=sessions.reduce((a,x)=>a+(x.exercises||[]).reduce((b,e)=>b+(e.sets||[]).length,0),0);
  const ds=sessions.map(x=>x.date).filter(Boolean).sort();
  return {treinos:sessions.length,sets:sets,de:ds[0]||null,ate:ds[ds.length-1]||null};
}
/* ---------- BACKUP PRO VAULT — um toque, um arquivo ---------- */
/* Até a v1.3.2 um toque de export disparava três shares (backup, treinos.json e .md),
   cada um abrindo share sheet e deixando lixo, e dois deles sem consumidor nenhum: o
   recolher_treino.py classifica `gymlog/*` como ignorar e regenera o treinos.json a
   partir do backup, e nunca leu o .md do celular.
   O toast antigo disparava ANTES do share e nunca reportava resultado — dizia "backup:
   N treinos" mesmo quando o usuário cancelava. Agora o card se reescreve no lugar,
   depois do share resolver, com o que saiu de fato. Cancelar e falhar são estados
   distintos e nomeados; em nenhum dos dois o botão some. */
let bkState={phase:"idle"};   // idle | busy | done | abort | fail

function renderBackupBlock(host){
  host.innerHTML="";
  if(host.onBk)host.onBk();             // v1.16.0: cabeçalho de idade da confirmação acompanha cada estado
  const st=backupStats(), S=bkState;
  /* P1.10 — cicatriz nº 2 aplicada ao lugar certo: a confirmação mostra o conteúdo real
     E o que não é conteúdo. O bloco anunciava "81 treinos · 1465 séries" com a mesma
     confiança havendo ou não uma sessão pendurada fora do payload. */
  if(isOrfa()){
    const w=el("div","muted");
    w.style.cssText="color:var(--warn-tx);margin-bottom:10px";
    w.innerHTML="⚠ <b>1 sessão não finalizada ("+esc(active.day)+" · "+esc(ddmm(active.date))+
      ") não entra neste backup.</b> Finalize ou descarte na Home antes de exportar.";
    const g=el("button","btn-ghost btn-sm","Ir pra Home");g.style.marginBottom="10px";
    g.onclick=()=>go("home");
    host.appendChild(w);host.appendChild(g);
  }
  const b=el("button","btn-primary","⬇ Backup pro vault");
  b.style.width="100%";

  if(!st.treinos){                                   // VAZIO — desabilitado, não some
    b.disabled=true;b.title="Nada pra exportar";
    host.appendChild(b);
    host.appendChild(el("div","muted","Nada pra exportar: <b>0 treinos</b> no histórico. "+
      "O botão volta assim que o primeiro treino for salvo."));
    return;
  }
  if(S.phase==="busy"){                              // CARREGANDO — recusa segundo toque
    b.disabled=true;b.textContent="⬇ Compartilhamento aberto…";
  }else{
    b.onclick=()=>runBackup(host);
  }
  host.appendChild(b);

  if(S.phase==="busy"){
    host.appendChild(el("div","muted","Escolha <b>Salvar em Arquivos → iCloud Drive</b>. "+
      "Não toque de novo enquanto isso: o segundo toque exporta um arquivo duplicado."));
  }else if(S.phase==="done"){                        // CHEIO — o que saiu de fato
    const d=el("div");d.style.cssText="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)";
    d.innerHTML="<div style='font-weight:700;color:var(--accent-tx)'>✓ "+
        (S.via==="share"?"Entregue ao compartilhamento":"Baixado")+" às "+esc(S.hora)+"</div>"+
      "<div style='margin-top:4px;font-variant-numeric:tabular-nums'><b>"+S.treinos+"</b> "+
        (S.treinos===1?"treino":"treinos")+" · <b>"+S.sets+"</b> "+(S.sets===1?"série":"séries")+
        (S.de?" · "+esc(S.de)+" → "+esc(S.ate):"")+" · <b>"+S.kb+" KB</b></div>"+
      "<div class='muted' style='margin-top:2px'><code>"+esc(S.fn)+"</code></div>"+
      "<div class='muted' style='margin-top:6px'>Salve em <b>iCloud Drive</b> — a raiz serve. "+
        "O app entrega o arquivo ao iOS e não enxerga onde ele parou: confira em <b>Arquivos</b>.</div>"+
      (S.cfgOk?"":"<div style='margin-top:6px;color:var(--warn-tx);font-weight:650'>⚠ O arquivo saiu, "+
        "mas a data do último backup não pôde ser gravada — veja Ajustes → Diagnóstico de dados.</div>");
    host.appendChild(d);
  }else if(S.phase==="abort"){                       // CANCELADO — não é erro
    const d=el("div");d.style.cssText="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)";
    d.innerHTML="<div style='font-weight:650'>Export cancelado às "+esc(S.hora)+"</div>"+
      "<div class='muted' style='margin-top:2px'>Você fechou o compartilhamento antes de escolher onde salvar. "+
      "Nada saiu e nada foi perdido — o histórico continua aqui. Toque de novo quando quiser.</div>";
    host.appendChild(d);
  }else if(S.phase==="fail"){                        // ERRO — motivo visível
    const d=el("div");d.style.cssText="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)";
    d.innerHTML="<div style='font-weight:700;color:var(--danger-tx)'>✕ O backup não saiu ("+esc(S.hora)+")</div>"+
      "<div class='muted' style='margin-top:2px'>Motivo: "+esc(S.msg)+"</div>"+
      "<div class='muted' style='margin-top:4px'>O histórico não foi tocado. Registrado em "+
      "Ajustes → Diagnóstico de dados → Log de gravações.</div>";
    host.appendChild(d);
  }
}

async function runBackup(host){
  if(bkState.phase==="busy")return;                  // segundo toque não passa
  const st=backupStats();
  const fn="treino-backup-"+today()+".json";
  const hora=fmtClock(Date.now());
  if(!st.treinos){bkState={phase:"fail",fn:fn,hora:hora,msg:"nenhum treino no histórico"};
    renderBackupBlock(host);return;}
  let payload;
  try{ payload=JSON.stringify({templates,sessions,cfg},null,2); }
  catch(e){ const m=(e&&e.message)||String(e);
    logIO("backup-fail",K.sess,"não deu pra montar o JSON: "+m);
    bkState={phase:"fail",fn:fn,hora:hora,msg:"não deu pra montar o JSON — "+m};
    renderBackupBlock(host);return; }
  const blob=new Blob([payload],{type:"application/json"});
  bkState={phase:"busy",fn:fn};renderBackupBlock(host);

  let via=null;
  try{
    let file=null;
    try{ if(navigator.canShare&&window.File){
            const f=new File([blob],fn,{type:"application/json"});
            if(navigator.canShare({files:[f]}))file=f; } }catch(e){ file=null; }
    if(file){ await navigator.share({files:[file]}); via="share"; }  // só `files`: `title` virava um segundo item
    else{                                                            // fallback desktop
      const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=fn;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
      via="download";
    }
  }catch(e){
    const fim=fmtClock(Date.now());
    if(e&&e.name==="AbortError"){                    // cancelar não é falhar
      logIO("backup-cancel",K.sess,"export cancelado antes de escolher destino — nada saiu");
      bkState={phase:"abort",fn:fn,hora:fim};
    }else{
      const m=(e&&e.message)||String(e);
      logIO("backup-fail",K.sess,"share recusou: "+m);
      bkState={phase:"fail",fn:fn,hora:fim,msg:m};
    }
    renderBackupBlock(host);return;
  }
  cfg.lastBackup=today();
  const cfgOk=save(K.cfg,cfg);
  logIO("backup",K.sess,st.treinos+" treinos · "+st.sets+" séries · "+fn+" · via "+via,blob.size);
  bkState={phase:"done",fn:fn,hora:fmtClock(Date.now()),kb:Math.round(blob.size/1024),via:via,
           treinos:st.treinos,sets:st.sets,de:st.de,ate:st.ate,cfgOk:cfgOk};
  const lb=$("#cfgLastBk");if(lb)lb.textContent=cfg.lastBackup;   // a linha de aviso do card não fica atrasada
  renderBackupBlock(host);
}
function requestPersist(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}}

/* ---------- MARKDOWN EXPORT ---------- */
function sessionMarkdown(s){
  const t=templates[s.day];const name=t?t.name:s.day;
  const dmy=durMin(s);
  let md="---\ntags: [treino]\nPlano: "+(s.plano||cfg.plano)+"\nCiclo: "+(s.ciclo||cfg.ciclo)+"\nInício: "+s.date+
    (s.started?"\nHora: "+fmtClock(s.started):"")+(dmy?"\nDuração: "+dmy:"")+"\n---\n\n";
  md+="# Treino "+s.day+" — "+name+" ("+s.date+")\n\n";
  md+="| Ordem | Exercício | Séries×Reps | Descanso | Notas |\n";
  md+="|-------|-----------|-------------|----------|-------|\n";
  let restTotal=0;
  s.exercises.forEach((e,i)=>{
    const sets=e.sets.map(st=>(st.w?st.w+"kg×":"")+ (st.r||"?")).join(" · ");
    const rirs=e.sets.map(st=>st.rir).filter(x=>x!=null&&x!=="");
    const rr=e.sets.map(st=>st.rest).filter(x=>x!=null);
    rr.forEach(x=>restTotal+=x);
    const restCol=rr.length?rr.map(x=>x+"s").join("·")+" (méd "+Math.round(rr.reduce((a,b)=>a+b,0)/rr.length)+"s)":(e.rest?"alvo "+e.rest+"s":"—");
    const note=[e.notes,rirs.length?"RIR "+rirs.join("/"):""].filter(Boolean).join(" · ");
    md+="| "+(i+1)+" | [["+e.n+"]]"+(e.mvw?" 🔑":"")+" | "+sets+" | "+restCol+" | "+note+" |\n";
  });
  md+="\n**Volume total:** "+Math.round(sessVol(s))+" kg·rep\n";
  const dm=durMin(s);
  if(dm)md+="**Duração:** "+dm+" min ("+fmtClock(s.started)+"–"+fmtClock(s.finished)+")\n";
  if(restTotal)md+="**Descanso total:** "+Math.round(restTotal/60)+" min ("+restTotal+"s registrados)\n";
  return md;
}

/* v1.4.0: o download() genérico saiu junto com os exports que ele servia. Ele engolia
   o AbortError num `return false` que ninguém lia — a cicatriz nº2 na tela de export.
   Quem exporta agora é o runBackup(), que nomeia cancelamento e falha na tela. */

/* ---------- HISTÓRICO / CHARTS ---------- */
/* P5.6 — `histEx = names[0]` abria sempre em "Abdomen - máquina", o primeiro alfabético
   entre 45 nomes: pra ver o que interessa, uma roda de 45 itens com uma mão. O padrão
   passa a ser o exercício-chave da sessão mais recente — o mais provável de
   ele querer ver logo depois de treinar — e a escolha vai pro cfg, sobrevivendo ao
   reload. Só entra em `names`: exercício que saiu do histórico não seleciona nada. */
function histExPadrao(names){
  for(let i=sessions.length-1;i>=0;i--){
    const exs=(sessions[i].exercises||[]).filter(e=>(e.sets||[]).length&&names.indexOf(e.n)>=0);
    if(!exs.length)continue;
    /* Dentro da sessão, o exercício-chave (MVW) ganha do último da lista. Medido na sessão
       de 29/08: "último com série" abria em `Abdômen voador `, o acessório do fim; o primeiro
       MVW abre em `Stiff - com barra solta`, que é o motivo do treino C existir. */
    const chave=exs.filter(e=>e.mvw);
    return (chave.length?chave[0]:exs[0]).n;
  }
  return names[0];
}
const HIST_METRICAS=[["peso","Carga máx"],["vol","Volume"],["e1rm","1RM est."]];
let histEx=(typeof cfg.histEx==="string"&&cfg.histEx)?trimNome(cfg.histEx):null;   // v1.14.1: escolha gravada com espaço ainda casa
/* v1.14.0 — a métrica escolhida resetava a cada reload enquanto o exercício sobrevivia
   (cfg.histEx, desde a v1.10.0). Leitura defensiva no mesmo padrão: o restore faz cfg=d.cfg
   e backup antigo não tem a chave, então valor ausente ou desconhecido cai em "peso". */
let histMetric=HIST_METRICAS.some(m=>m[0]===cfg.histMetric)?cfg.histMetric:"peso";
function histMetricaLbl(){const m=HIST_METRICAS.find(x=>x[0]===histMetric);return m?m[1]:HIST_METRICAS[0][1];}
function renderHist(a){
  a.appendChild(el("h1",null,"Histórico"));
  /* Cicatriz nº 1, de carona: histórico que não pôde ser LIDO exibia "Sem treinos ainda.
     Registre uma sessão" — vazio e ilegível são estados diferentes, e o segundo desaconselha
     justamente o que a tela mandava fazer. */
  if(!sessions.length){
    const f=readFailed(K.sess);
    a.appendChild(el("div","empty",f
      ?"<div class='ic'>⚠️</div><div>O histórico não pôde ser lido — <b>"+esc(f)+"</b>.<br>Nada foi apagado. Ver <b>Ajustes → Diagnóstico de dados</b> antes de importar por cima.</div>"
      :"<div class='ic'>📈</div><div>Sem treinos ainda.<br>Registre uma sessão para ver a progressão.</div>"));
    return;}

  const names=[...new Set(sessions.flatMap(s=>s.exercises.map(e=>e.n)))].sort();
  if(!histEx||!names.includes(histEx))histEx=histExPadrao(names);

  /* v1.14.0 — o mesmo gate do render(): aqui vazio e ilegível já saíram acima, então
     `wide` ⇔ desktop. Uma leitura só, pra o layout e a altura do gráfico não divergirem. */
  const wide=document.body.classList.contains("wide");
  const CH=wide?320:200;                          // altura do gráfico, em px CSS

  const sel=el("select");names.forEach(n=>{const o=el("option",null,esc(n));o.value=n;if(n===histEx)o.selected=true;sel.appendChild(o);});
  sel.onchange=()=>{histEx=sel.value;cfg.histEx=histEx;
    if(!save(K.cfg,cfg))toast("A escolha não foi gravada — ver Diagnóstico");
    render();};
  const seg=el("div","seg");
  HIST_METRICAS.forEach(([k,l])=>{const b=el("button",histMetric===k?"active":"",l);
    b.onclick=()=>{histMetric=k;cfg.histMetric=k;
      if(!save(K.cfg,cfg))toast("A escolha não foi gravada — ver Diagnóstico");
      render();};
    seg.appendChild(b);});
  /* Barra de controle. O lado a lado é SÓ no desktop: em 375px o select mais três botões de
     métrica na mesma linha deixariam cada botão com ~45px. No celular continuam empilhados,
     exatamente como estavam. */
  const selCard=el("div","card full");
  if(wide){
    const r=el("div","row");r.style.alignItems="flex-end";
    const c1=el("div");c1.style.flex="3";c1.appendChild(el("label","fld","Exercício"));c1.appendChild(sel);
    const c2=el("div");c2.style.flex="2";seg.style.marginBottom="0";c2.appendChild(seg);
    r.appendChild(c1);r.appendChild(c2);selCard.appendChild(r);
  }else{
    selCard.appendChild(el("label","fld","Exercício"));selCard.appendChild(sel);
    selCard.appendChild(el("div",null,"<div style='height:10px'></div>"));selCard.appendChild(seg);
  }

  // data points
  const pts=[];
  sessions.forEach(s=>{const ex=s.exercises.find(e=>e.n===histEx);if(!ex||!ex.sets.length)return;
    let y;if(histMetric==="peso")y=topWeight(ex.sets);
    else if(histMetric==="vol")y=setVol(ex.sets);
    else{y=Math.max(...ex.sets.map(st=>{const w=parseFloat(st.w)||0,r=parseFloat(st.r)||0;return w*(1+r/30);}));}

/* v1.14.0 — H e xdiv viraram parâmetro (eram 200 e 5 fixos): no desktop o gráfico ocupa
   320px e cabem ~8 datas no eixo X em vez de ~5. Sem chamador, os defaults são os de antes. */
function drawChart(cv,pts,unit,H,xdiv){
  H=H||200;xdiv=xdiv||5;
  const dpr=window.devicePixelRatio||1;const W=cv.clientWidth;
  cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const pad={l:38,r:12,t:14,b:26};
  const xs=pts.map((_,i)=>i),ys=pts.map(p=>p.y);
  let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn=mn*0.9;mx=mx*1.1||1;}
  const rng=mx-mn||1;mn-=rng*0.1;mx+=rng*0.1;
  const px=i=>pad.l+(pts.length<=1?(W-pad.l-pad.r)/2:(i/(pts.length-1))*(W-pad.l-pad.r));
  const py=v=>pad.t+(1-(v-mn)/(mx-mn))*(H-pad.t-pad.b);
  // grid + y labels
  ctx.strokeStyle="#26313d";ctx.fillStyle="#8b97a6";ctx.font="10px -apple-system,sans-serif";ctx.lineWidth=1;
  for(let g=0;g<=3;g++){const v=mn+(mx-mn)*g/3,y=py(v);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.textAlign="right";ctx.fillText(Math.round(v),pad.l-5,y+3);}
  // area
  ctx.beginPath();pts.forEach((p,i)=>{const X=px(i),Y=py(p.y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
  ctx.lineTo(px(pts.length-1),H-pad.b);ctx.lineTo(px(0),H-pad.b);ctx.closePath();
  ctx.fillStyle="rgba(34,197,94,.12)";ctx.fill();
  // line
  ctx.beginPath();pts.forEach((p,i)=>{const X=px(i),Y=py(p.y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
  ctx.strokeStyle="#22c55e";ctx.lineWidth=2.5;ctx.lineJoin="round";ctx.stroke();
  // points + x labels
  ctx.fillStyle="#22c55e";
  pts.forEach((p,i)=>{const X=px(i),Y=py(p.y);ctx.beginPath();ctx.arc(X,Y,3.5,0,7);ctx.fill();});
  ctx.fillStyle="#8b97a6";ctx.textAlign="center";
  const step=Math.ceil(pts.length/xdiv);
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1){ctx.fillText(p.x.slice(5),px(i),H-8);}});
}
