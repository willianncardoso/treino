<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href='data:application/manifest+json,{"name":"Treino","short_name":"Treino","start_url":".","display":"standalone","background_color":"%230b0f14","theme_color":"%230b0f14","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2322c55e%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22sans-serif%22%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
<title>Treino</title>
<style>
:root{
  --bg:#0b0f14; --surface:#141b24; --surface2:#1c2530; --border:#26313d;
  --text:#e6edf3; --muted:#8b97a6; --accent:#22c55e; --accent2:#3b82f6;
  --danger:#ef4444; --warn:#f59e0b; --radius:14px; --sp:8px;
  /* P5.3 — as mesmas cores servem a dois papéis com regras diferentes: como FUNDO
     (.btn-primary, a barra de descanso) não têm requisito de contraste contra a superfície;
     como TEXTO precisam de 4,5:1 sobre ela. No escuro os dois valores coincidem, e é por
     isso que o bug ficou dez meses invisível. No claro, não coincidem. */
  --accent-tx:#22c55e; --warn-tx:#f59e0b; --danger-tx:#ef4444; --dn-tx:#fca5a5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;padding-bottom:76px;
  padding-top:env(safe-area-inset-top);
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{margin:0 0 10px;font-weight:650}
h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 0}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;border-radius:10px;padding:12px 16px;color:#fff;background:var(--surface2);transition:opacity .15s}
button:active{opacity:.6}
button:disabled{opacity:.42;cursor:default}
button:disabled:active{opacity:.42}
.btn-primary{background:var(--accent);color:#0b0f14;font-weight:600}   /* P5.5: #fff dava 2,28:1; escuro dá 8,43:1 */
.btn-blue{background:var(--accent2);color:#0b0f14;font-weight:600}     /* P5.5: #fff dava 3,68:1; escuro dá 5,23:1 */
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--danger-tx);color:var(--danger-tx)}
/* P5.9 — 8px+13px dava ~34px de altura, contra os 44 do mínimo da Apple. Atinge ✓/▴, 🔍,
   + Série, ▶ Descanso, o MD da Home e os dois botões da barra de descanso. A fonte fica
   em 13px: quem cresce é o alvo, não o texto. */
.btn-sm{padding:8px 12px;font-size:13px;min-height:44px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:10px;font-size:16px;text-align:center}
input:focus,select:focus{outline:2px solid var(--accent2);border-color:transparent}
button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}   /* P5.8 */
label.fld{display:block;font-size:11px;color:var(--muted);text-align:center;margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(11,15,20,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50}
.tabbar button{flex:1;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.tabbar button.active{color:var(--accent-tx)}
.tabbar .ic{font-size:20px}
.daygrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.daycard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:left;color:var(--text)}
.daycard .big{font-size:32px;font-weight:750;color:var(--accent-tx)}
.ex{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ex-title{font-weight:650;font-size:15px}
.exdone{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:13px 15px;margin-bottom:12px;cursor:pointer;transition:opacity .2s}
.exdone:active{opacity:.6}
.exdone .ck{color:var(--accent-tx);font-weight:800;font-size:16px}
/* P5.10 — 'Agachamento Búlgaro - Smith' + '3× 30kg×10' não cabem em 375px. Quem trunca é
   o NOME, que é rótulo; o resumo das séries é o dado e nunca é cortado. */
.exdone .nm{font-weight:650;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exdone .sm{color:var(--muted);font-size:13px;margin-left:auto;text-align:right;flex:0 0 auto;white-space:nowrap}
.lastbox{background:var(--surface2);border-left:3px solid var(--accent);border-radius:8px;padding:9px 11px;margin-bottom:9px}
.lastbox .hl{color:var(--text);font-weight:600;font-size:16px;margin-top:2px;line-height:1.35}
.lastbox .lbl{font-size:10px;letter-spacing:.5px;color:var(--muted)}
.trend{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
.trend.up{background:rgba(34,197,94,.16);color:var(--accent-tx)}
.trend.dn{background:rgba(239,68,68,.16);color:var(--dn-tx)}
.trend.eq{background:var(--surface);color:var(--muted)}
.histrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
.histrow .hd{color:var(--muted);white-space:nowrap}
.histrow .hs{text-align:right}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle}
.tag.mvw{background:rgba(245,158,11,.15);color:var(--warn-tx)}
/* P5.13 — eram TRÊS campos iguais e um terço da área nunca foi usado: 1 série de 1.465
   (0,07%) tem RIR, contra 100% de repetições. Com a coluna fora, kg e reps ganham ~50% de
   largura cada na linha que ele preenche ~18 vezes por treino, em pé, com uma mão.
   A chave `rir` continua no formato salvo — ver o README da v1.9.0.
   P5.2/P5.9 de carona: o `×` era um alvo de ~30×34 px na mesma linha. Vai a 44×44, que é o
   mínimo da Apple, sem custar largura de campo — a coluna cresce 10 px e os campos ganham
   os 34 px do RIR de volta. */
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.setrow .idx{color:var(--muted);text-align:center;font-size:13px}
.setrow .del{background:none;color:var(--muted);padding:4px;font-size:16px;min-height:44px;width:100%}
.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--surface2);font-size:12px;color:var(--muted);margin:2px 4px 2px 0}
.sessionbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:45;display:none;padding:0 12px;pointer-events:none}
.sessionbar.on{display:block}
/* P5.4 — o teclado numérico do iOS não tem tecla de retorno, e .sessionbar/.tabbar são
   fixed no LAYOUT viewport: o teclado passa por cima das duas e leva junto o cronômetro,
   o 🏁 Próxima e o Parar — no momento mais frequente do app. --kb é a altura coberta,
   medida pelo visualViewport. Com o teclado aberto a barra se ancora nele e não na
   tabbar, que está debaixo do teclado: empilhar em cima do que sumiu não adianta. */
body.kb .sessionbar{bottom:calc(var(--kb,0px) + 8px)}
.sb-inner{max-width:640px;margin:0 auto;position:relative;min-height:60px;border-radius:14px;overflow:hidden;pointer-events:auto;background:var(--surface2);border:1px solid var(--border);box-shadow:0 6px 22px rgba(0,0,0,.45);transition:background-color .3s ease,border-color .3s ease}
/* .sb-idle e .sb-rest são absolute: não empurram a altura do pai. Com os botões em 44px
   (P5.9) o conteúdo do descanso passa de 60px e o overflow:hidden cortaria o 🏁 Próxima.
   Só o estado de descanso cresce — em repouso a barra continua com 60px. */
.sessionbar.resting .sb-inner{background:var(--accent2);border-color:transparent;min-height:82px}
.sb-idle,.sb-rest{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;transition:opacity .25s ease}
.sb-rest{opacity:0;pointer-events:none}
.sessionbar.resting .sb-idle{opacity:0;pointer-events:none}
.sessionbar.resting .sb-rest{opacity:1;pointer-events:auto}
.sb-t{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.05}
.sb-lbl{font-size:10px;letter-spacing:.5px;color:var(--muted)}
.sb-rest .sb-lbl{color:rgba(255,255,255,.8)}
.sessionbar.resting.over .sb-inner{background:var(--danger);animation:pulseOver 1s ease-in-out infinite}
@keyframes pulseOver{0%,100%{box-shadow:0 6px 22px rgba(239,68,68,.5)}50%{box-shadow:0 6px 30px rgba(239,68,68,.85)}}
/* P5.12 — o pulso é a única animação contínua do app. Com movimento reduzido ele PARA,
   mas não some: o fundo vermelho e a sombra forte ficam. Enquanto o alarme depender de
   som (que o botão de silencioso cala), este é o aviso visual de que a pausa estourou. */
@media (prefers-reduced-motion: reduce){
  .sessionbar.resting.over .sb-inner{animation:none;box-shadow:0 6px 30px rgba(239,68,68,.85)}
}
.ex.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 4px 16px rgba(34,197,94,.12)}
.ex.active .ex-title::before{content:"▶ ";color:var(--accent-tx);font-size:12px}
.sess{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.sess:last-child{border-bottom:none}
.dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface2)}
canvas{width:100%;height:auto;display:block}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .ic{font-size:40px;opacity:.5}
textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:10px;font-size:13px;font-family:ui-monospace,monospace;min-height:200px;text-align:left}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;background:none;color:var(--muted);padding:8px;font-size:13px}
.seg button.active{background:var(--accent);color:#0b0f14;font-weight:600}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
a{color:var(--accent2)}
/* tema claro */
body.light{--bg:#f4f6f9;--surface:#ffffff;--surface2:#eef2f7;--border:#d5dde6;--text:#17202a;--muted:#5c6b7a;
  /* medidos sobre #ffffff / #eef2f7 e sobre os fundos tingidos de .trend e .tag.mvw:
     accent 7,13 / 6,34 / 6,23 · warn 7,09 / 6,31 / 6,31 · danger 6,47 / 5,76 / 5,24 */
  --accent-tx:#166534;--warn-tx:#92400e;--danger-tx:#b91c1c;--dn-tx:#b91c1c}
body.light .tabbar{background:rgba(255,255,255,.92)}
/* modo largo (aba análise no desktop) */
body.wide .wrap{max-width:1180px}
.dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.dashgrid .full{grid-column:1 / -1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="sessionbar" id="sessionbar">
  <div class="sb-inner">
    <div class="sb-idle">
      <div><div class="sb-lbl">TEMPO TOTAL</div><div class="sb-t" id="sbElapsed">0:00</div></div>
      <div style="text-align:right"><div class="sb-lbl" id="sbProg">0/0 ex</div><div class="muted" id="sbVol" style="font-size:12px">0 kg·rep</div></div>
    </div>
    <div class="sb-rest">
      <div><div class="sb-lbl"><span id="sbRestLbl">DESCANSO</span> <span id="sbRestTgt"></span></div><div class="sb-t" id="sbRestT" style="color:#fff">0:00</div></div>
      <div style="text-align:right">
        <div class="sb-lbl">TOTAL <span id="sbElapsedR" style="color:#fff;font-weight:700">0:00</span></div>
        <div class="row" style="margin-top:5px;justify-content:flex-end">
          <button class="btn-sm" style="background:#fff;color:#0b0f14;font-weight:700" onclick="markLap()">🏁 Próxima</button>
          <button class="btn-sm" style="background:rgba(255,255,255,.2)" onclick="stopRest()">Parar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="tabbar" id="tabbar"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ STORE ============ */
const K = {tpl:"gymlog_templates_v3", sess:"gymlog_sessions_v1", active:"gymlog_active_v1",
           cfg:"gymlog_cfg_v1", iolog:"gymlog_iolog_v1"};
const IOLOG_MAX=60;

/* Registro de gravações/leituras. Grava direto no localStorage — nunca chama
   save(), para não recursar quando o próprio save() falhar. */
function logIO(kind,key,msg,bytes){
  const rec={t:Date.now(),kind:kind,key:key,msg:String(msg==null?"":msg).slice(0,220)};
  if(bytes!=null)rec.bytes=bytes;
  try{
    const raw=localStorage.getItem(K.iolog);
    const arr=raw?JSON.parse(raw):[];
    arr.push(rec);
    localStorage.setItem(K.iolog,JSON.stringify(arr.slice(-IOLOG_MAX)));
  }catch(e){}
  return rec;
}
/* Nem tudo que não é "ok" é falha: export bem-sucedido é "backup" e cancelamento é
   "backup-cancel" — cancelar não é erro e não pode ser contado nem pintado como um. */
const IO_NAO_FALHA={ok:1,backup:1,"backup-cancel":1};
function ioFail(r){return !IO_NAO_FALHA[r&&r.kind];}
function ioLogRead(){try{const r=localStorage.getItem(K.iolog);return r?JSON.parse(r):[];}catch(e){return [];}}

/* Chave -> motivo, quando a leitura falhou e a tela recebeu o default no lugar do dado.
   O iolog já registrava; isto é o que permite a TELA dizer que não veio, em vez de
   desenhar um zero em cima de uma leitura que falhou. Vazio de verdade não entra aqui. */
const loadFail={};
function readFailed(k){return loadFail[k]||null;}

/* Antes: qualquer erro devolvia o default silenciosamente — um JSON corrompido
   virava [] e o save seguinte apagava o histórico. Agora preserva o bruto e registra. */
const load=(k,d)=>{
  let raw;
  try{ raw=localStorage.getItem(k); }
  catch(e){ logIO("read-fail",k,e.message); loadFail[k]="o navegador recusou a leitura"; return d; }
  if(raw==null||raw===""){ delete loadFail[k]; return d; }
  try{ const v=JSON.parse(raw); delete loadFail[k]; return v; }
  catch(e){
    try{ localStorage.setItem(k+"__corrompido_"+Date.now(),raw); }catch(_){}
    logIO("parse-fail",k,e.message+" — cópia bruta preservada",raw.length);
    loadFail[k]="o JSON gravado está corrompido (cópia bruta preservada)";
    return d;
  }
};
/* Devolve true/false em vez de estourar em silêncio. Confere relendo o que gravou. */
const save=(k,v)=>{
  let str;
  try{ str=JSON.stringify(v); }
  catch(e){ logIO("stringify-fail",k,e.message); return false; }
  try{ localStorage.setItem(k,str); }
  catch(e){ logIO("write-fail",k,e.message,str.length); return false; }
  try{ if(localStorage.getItem(k)!==str){ logIO("verify-fail",k,"releitura difere do gravado",str.length); return false; } }
  catch(e){ logIO("verify-fail",k,e.message); return false; }
  delete loadFail[k];   // gravou e releu igual: a chave voltou a ser confiável (import, restore)
  return true;
};

/* ---------- VALIDAÇÃO DE SESSÃO ---------- */
/* erros = bloqueiam o salvamento · avisos = informam, não bloqueiam */
function validateSession(s){
  const erros=[],avisos=[];
  if(!s||typeof s!=="object")return{erros:["sessão inexistente"],avisos:avisos,stats:{}};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date||""))erros.push("data ausente ou fora do formato AAAA-MM-DD");
  if(!s.day)erros.push("dia do treino (A/B/C/D) ausente");
  if(!Array.isArray(s.exercises)||!s.exercises.length)erros.push("nenhum exercício com série preenchida");
  let sets=0,comReps=0,comCarga=0,vol=0;
  (s.exercises||[]).forEach((e,i)=>{
    const nome=((e&&e.n)||"").trim();
    if(!nome)erros.push("exercício "+(i+1)+" está sem nome");
    if(!Array.isArray(e.sets)){erros.push((nome||"exercício "+(i+1))+": lista de séries inválida");return;}
    if(!e.sets.length)avisos.push((nome||"exercício "+(i+1))+" ficou sem série");
    e.sets.forEach(st=>{
      sets++;
      const r=parseFloat(st.r),w=parseFloat(st.w);
      if(!isNaN(r)&&r>0){comReps++;if(!isNaN(w)&&w>0){comCarga++;vol+=w*r;}}
    });
  });
  if(!sets)erros.push("nenhuma série registrada");
  else if(!comReps)erros.push("as "+sets+" séries estão todas sem repetições");
  if(s.started&&s.finished&&s.finished<s.started)erros.push("término anterior ao início");
  /* P1.10 — "Finalizar com o que tem" carimba `finished` no dia em que ele lembrou, não no
     fim do treino: a duração resultante é verdadeira (é a diferença dos carimbos) e não é
     tempo de treino. Aviso, não erro — grava, mas não deixa passar calado um
     "DURAÇÃO 6612 min" na tela que existe pra mostrar o conteúdo real. 12 h nunca dispara
     num treino: a sessão mais longa do histórico tem 1h20. */
  if(s.started&&s.finished&&(s.finished-s.started)>12*36e5)
    avisos.push("finalizada "+Math.round((s.finished-s.started)/36e5)+" h depois de iniciada — a duração registrada é o intervalo entre os carimbos, não o tempo de treino");
  return{erros:erros,avisos:avisos,stats:{exercicios:(s.exercises||[]).length,sets:sets,
    comReps:comReps,comCarga:comCarga,vol:Math.round(vol),
    dur:(s.started&&s.finished)?Math.round((s.finished-s.started)/60000):null}};
}
function storageInfo(){
  let total=0;const det={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const v=localStorage.getItem(k)||"";
    det[k]=v.length;total+=v.length+k.length;}}catch(e){}
  return{total:total,det:det};
}

/* Templates do vault Obsidian — Ciclo 3 (01 Junho 2026, treino-atual) */
const DEFAULT_TEMPLATES = {
  A:{name:"Pernas & Glúteos I", ex:[
    {n:"Hips Thrust - Máquina", sr:"4×10", rest:120, mvw:true, notes:"Principal — meta 90kg×10 limpas; squeeze topo 2s"},
    {n:"Leg Press", sr:"4×10", rest:120, mvw:true, notes:"Meta 170kg. Pés altos e afastados"},
    {n:"Agachamento Goblet - Haltere", sr:"3×12", rest:90, mvw:false, notes:"Amplitude completa (24kg→volta ao frontal)"},
    {n:"Extensão Coxa - Máquina", sr:"3×10", rest:60, mvw:true, notes:"Pausa 1s no topo. Meta 95kg×10"},
    {n:"Abdução - máquina (sem descanso)", sr:"3×15", rest:0, mvw:false, notes:"Drop 130/105/80kg"},
    {n:"Panturrilha", sr:"3×15", rest:45, mvw:false, notes:"45kg. Pausa 2s no topo"},
  ]},
  B:{name:"Peito & Tríceps", ex:[
    {n:"Supino reto - banco", sr:"4×8-10", rest:150, mvw:true, notes:"Principal — subir carga (52-55kg)"},

/* P1.11 — `finished` não está errado: registra que o botão foi apertado em 26/08 às 09h41.
   Errado era `durMin` chamar `finished - started` de DURAÇÃO DO TREINO. Dois conceitos com
   um nome só, que coincidem só quando o fecho é imediato — e em duas sessões não foi:
   14/08 marcava 1654 min e 21/08, 6614 min.
   A saída óbvia ("usar o último `t` de série") NÃO funciona: o finishSession faz
   `if(!st.t)st.t=sess.finished`, então 72 das 353 séries carimbadas (20,4%) carregam o
   instante do fecho. Nas duas quebradas o maior `t` É o `finished`, ao segundo. Por isso
   "carimbo real" exclui `t===finished`.
   Limiar de 30 min sai do dado, que é bimodal: gap mediano de 1,1 min, 17 de 19 abaixo de
   15 min, e depois NADA até 1601 e 6564 min. 20× acima do maior gap normal, 50× abaixo do
   menor quebrado. Resultado: 14/08 → 53 min, 21/08 → 50 min (mediana das normais: 51), e as
   outras 17 não mudam nem um minuto. Nada gravado muda — `started`, `finished` e todos os
   `t` ficam como estão, e o backup continua byte a byte igual. */
const DUR_GAP_TARDIO=30*60000;
/* Sem carimbo nenhum não dá pra reconstruir; sobra `finished - started`, que só é descartado
   quando é implausível como treino. 12 h é o mesmo teto que o validateSession já usa pra
   avisar — a sessão mais longa do histórico tem 1h21. Ver a nota no relatório da v1.10.1:
   a única sessão sem carimbo (2026-07-09) tem 47 min no mesmo dia, e devolver `null` ali
   trocaria um número bom por "não registrada". */
const DUR_MAX_PLAUSIVEL=12*36e5;
function ultimoSetReal(s){
  let mx=null;
  (s&&s.exercises||[]).forEach(e=>(e.sets||[]).forEach(st=>{
    if(!st.t||st.t===s.finished)return;          // carimbo posto no fecho não é evento do treino
    if(mx==null||st.t>mx)mx=st.t;}));
  return mx;
}
function durAtraso(s){                            // ms entre a última série e o clique, quando houve
  if(!s||!s.started||!s.finished)return null;
  const t=ultimoSetReal(s);
  return (t!=null&&(s.finished-t)>DUR_GAP_TARDIO)?(s.finished-t):null;
}
function durMin(s){
  if(!s||!s.started||!s.finished)return null;     // importada, sem carimbo: nada a dizer
  const t=ultimoSetReal(s);
  if(t!=null&&(s.finished-t)>DUR_GAP_TARDIO)return Math.max(1,Math.round((t-s.started)/60000));
  if(t==null&&(s.finished-s.started)>DUR_MAX_PLAUSIVEL)return null;   // cicatriz nº 1: não inventa
  return Math.max(1,Math.round((s.finished-s.started)/60000));
}
function fmtAtraso(ms){
  const min=Math.round(ms/60000);if(min<90)return min+" min depois";
  const h=Math.round(ms/36e5);if(h<36)return h+" h depois";
  const d=Math.round(ms/864e5);return d+(d===1?" dia depois":" dias depois");
}
/* A demora não é omitida: onde a duração aparece, a sessão reconstruída diz que foi fechada
   depois. Em `muted`, sem cor de alarme — é fato, e ele já mudou o comportamento. Sessão com
   carimbos de fecho e nenhum evento real diz "duração não registrada", nunca zero. */
function durTxt(s){
  const m=durMin(s);
  if(m==null)return (s&&s.started&&s.finished)?"duração não registrada":null;
  const atr=durAtraso(s);
  return m+" min"+(atr?" · finalizada "+fmtAtraso(atr):"");
}
function fmtDur(ms){const t=Math.max(0,Math.floor(ms/1000));const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),sec=t%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(sec).padStart(2,"0");}
let elapsedId=null;

/* ============ CRONÔMETRO DE DESCANSO (conta pra cima, grava a pausa real) ============ */
let swId=null, swStart=0, swTarget=0, swExIdx=-1, swBeeped=false;
const REST_MAX_RESUME_MS=2*60*60*1000;   // carimbo mais velho que isto não é pausa, é aba esquecida
/* `resumeTs` = retomada (reload ou volta de outra aba). O swStart já era timestamp
   absoluto, então app em background nunca distorceu a contagem — o buraco era que ele
   vivia só em memória: persistActive() salvava `active` sem ele e o reload zerava a
   pausa. Agora o carimbo mora em active.restTimer. */
function startRest(exIdx,resumeTs){const e=active.exercises[exIdx]||{};swExIdx=exIdx;
  swStart=resumeTs||Date.now();swBeeped=false;
  if(!resumeTs){
    if(e.id&&active){active.ultimoExercicioId=e.id;active.ultimoSetAt=Date.now();}
    if(active){active.restTimer={s:swStart,i:exIdx};persistActive();}
  }
  const inter=targetSets(e)&&completedSets(e)>=targetSets(e);
  swTarget=inter?INTER_REST:(e.rest||0);
  if(resumeTs&&swTarget&&(Date.now()-swStart)/1000>=swTarget)swBeeped=true;  // a meta passou antes do reload: não bipa retroativo
  const lb=$("#sbRestLbl");if(lb)lb.textContent=inter?"ENTRE EXERCÍCIOS":"DESCANSO";
  const tg=$("#sbRestTgt");if(tg)tg.textContent=swTarget?"(meta "+(inter?"2min":swTarget+"s")+")":"";
  const sb=$("#sessionbar");if(sb){sb.classList.add("on","resting");sb.classList.remove("over");}swTick();clearInterval(swId);swId=setInterval(swTick,250);}
function swTick(){const sec=Math.floor((Date.now()-swStart)/1000);
  const over=swTarget&&sec>=swTarget;
  const e2=$("#sbRestT");if(e2){const mm=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
    e2.textContent=over?"+"+mm:mm;}
  const sb=$("#sessionbar");if(sb)sb.classList.toggle("over",!!over);
  if(over&&!swBeeped){swBeeped=true;beep();}}
function markLap(){const sec=Math.round((Date.now()-swStart)/1000);
  const e=active.exercises[swExIdx];
  if(e){active.ultimoExercicioId=e.id;active.ultimoSetAt=Date.now();
    if(e.sets.length){const ls=e.sets[e.sets.length-1];ls.rest=sec;ls.t=Date.now();}
    if(targetSets(e)&&completedSets(e)>=targetSets(e)){e.done=true;e.open=false;} // alvo atingido → conclui exercício
    else{const last=e.sets[e.sets.length-1]||{};e.sets.push({w:last.w||"",r:last.r||""});}
    persistActive();}
  stopRest();render();
  toast(sec+"s registrado");}
function stopRest(){clearInterval(swId);swId=null;
  if(active&&active.restTimer){delete active.restTimer;persistActive();}
  const sb=$("#sessionbar");if(sb)sb.classList.remove("resting","over");}
/* Chamado a cada render da aba de treino: reload ou volta de outra aba recuperam a
   pausa em curso pelo carimbo salvo, em vez de perdê-la. */
function resumeRest(){
  if(swId)return;                                        // já contando
  const r=active&&active.restTimer;
  if(!r||!active.exercises[r.i])return;
  /* Retomar um cronômetro de 6 horas seria afirmar uma pausa que não existiu: a aba ficou
     aberta, ele não descansou. Descarta o carimbo e volta pra sessionbar em repouso. */
  if(Date.now()-r.s>REST_MAX_RESUME_MS){delete active.restTimer;persistActive();return;}
  startRest(r.i,r.s);
}
/* ============ ALARME DE FIM DE DESCANSO (P5.1) ============ */
/* Isto nunca tocou no iPhone. O beep antigo criava o AudioContext DENTRO da função, que é
   chamada do tick do cronômetro — no iOS um contexto criado fora de gesto do usuário nasce
   `suspended` e não emite som. E o `catch(e){}` vazio engolia a evidência: 81 sessões de
   descanso terminando em silêncio sem nenhum rastro. O `navigator.vibrate` que vinha junto
   não é implementado pelo Safari do iOS — era código que parecia fazer algo e saiu.
   Agora o contexto é criado e retomado no gesto que já existe e está no lugar certo: o
   toque em ▶ Descanso, que é o que inicia a contagem. E o estado é dito na tela, porque
   alarme que falha calado é exatamente o que não pode voltar. */
let audioCtx=null, audioMsg="ainda não testado";
function audioEstado(){return audioMsg;}
/* SÓ chamar de dentro de um gesto do usuário — fora dele o iOS ignora e o estado fica
   `suspended`, que é o bug que este item conserta. */
function armAudio(cb){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){audioMsg="este navegador não tem Web Audio";logIO("audio-fail","beep",audioMsg);if(cb)cb(false);return;}
  try{ if(!audioCtx)audioCtx=new AC(); }
  catch(e){audioMsg="o navegador recusou criar o áudio: "+e.message;logIO("audio-fail","beep",e.message);if(cb)cb(false);return;}
  try{ // buffer mudo tocado dentro do gesto: é o que destrava o áudio no iOS
    const s=audioCtx.createBufferSource();s.buffer=audioCtx.createBuffer(1,1,22050);
    s.connect(audioCtx.destination);s.start(0);
  }catch(e){}
  const fim=()=>{const ok=audioCtx.state==="running";
    audioMsg=ok?"liberado":"o navegador manteve o áudio suspenso ("+audioCtx.state+")";
    if(!ok)logIO("audio-fail","beep",audioMsg);
    if(cb)cb(ok);};
  if(audioCtx.state==="suspended"){try{audioCtx.resume().then(fim,fim);}catch(e){fim();}}
  else fim();
}
function beep(){
  if(!audioCtx||audioCtx.state!=="running"){
    audioMsg="não tocou — o áudio não estava liberado ("+(audioCtx?audioCtx.state:"nenhum contexto criado")+")";
    logIO("beep-fail","descanso",audioMsg);   // vira linha vermelha em Ajustes → Diagnóstico
    return false;
  }
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=880;g.gain.value=.12;
    o.start();setTimeout(()=>{try{o.stop();o.disconnect();g.disconnect();}catch(e){}},450);
    audioMsg="tocou às "+new Date().toTimeString().slice(0,8);
    return true;
  }catch(e){audioMsg="falhou ao tocar: "+e.message;logIO("beep-fail","descanso",e.message);return false;}
}

/* ============ TECLADO (P5.4) ============ */
/* O visualViewport é a única fonte da altura do teclado no iOS. Sem ele (navegador
   antigo) nada muda: a barra fica onde sempre esteve e o app não fica pior. */
let kbPx=0;
function trackKeyboard(){
  const vv=window.visualViewport;if(!vv)return;
  let ult=-1;
  const upd=()=>{
    const bruto=Math.round(window.innerHeight-(vv.height+vv.offsetTop));
    const h=bruto>90?bruto:0;      // <90px é a barra do Safari encolhendo, não teclado
    if(h===ult)return;ult=h;kbPx=h;
    document.documentElement.style.setProperty("--kb",h+"px");
    document.body.classList.toggle("kb",h>0);
  };
  vv.addEventListener("resize",upd);vv.addEventListener("scroll",upd);upd();
}
/* O iOS rola sozinho até o campo focado, mas não sabe que existe uma barra fixa por
   cima dele. Reserva a altura da barra quando ela está na tela e só rola se o campo
   ficou mesmo coberto — rolar sempre trocaria um problema por um solavanco. */
function keepFieldVisible(i){
  setTimeout(()=>{
    if(document.activeElement!==i||!i.isConnected)return;
    const vv=window.visualViewport;
    const sb=$("#sessionbar");
    const reserva=(sb&&sb.classList.contains("on"))?98:12;
    const topo=(vv?vv.offsetTop:0)+8;
    const base=(vv?vv.offsetTop+vv.height:window.innerHeight)-reserva;
    const r=i.getBoundingClientRect();
    if(r.bottom>base||r.top<topo)i.scrollIntoView({block:"center"});
  },320);   // o teclado do iOS leva ~250ms pra terminar de subir
}

/* Uma sessão iniciada e não finalizada vive só em K.active. O backup é

   continua não entrando (carregá-la faria o restore ressuscitar um fantasma e envenenaria

   levar: é ela ficar órfã sem ninguém avisar. Então o conserto é de apresentação, nas
   duas telas onde ele já olha — a Home e o bloco de backup.
   Critério é a data, não aritmética de horas: ele não treina atravessando a meia-noite. */
function isOrfa(){return !!(active&&active.date&&active.date!==today());}
function ddmm(d){const p=String(d||"").split("-");return p.length===3?p[2]+"/"+p[1]:String(d||"");}

function renderHome(a){

    const b=el("button","btn-ghost","Ver Ajustes → Diagnóstico de dados");b.style.width="100%";b.style.marginTop="10px";
    b.onclick=()=>go("cfg");
    c.appendChild(b);a.appendChild(c);
  }
  if(active){
    const orfa=isOrfa();
    const c=el("div","card");
    c.style.borderColor=orfa?"var(--warn-tx)":"var(--accent)";
    const nome=templates[active.day]?templates[active.day].name:active.day;
    c.innerHTML="<div class='muted'>"+(orfa
        ? "<b style='color:var(--warn-tx)'>Sessão não finalizada · iniciada em "+esc(ddmm(active.date))+"</b>"
        : "Sessão em andamento")+
      "</div><h2 style='margin:4px 0'>Treino "+esc(active.day)+" — "+esc(nome)+"</h2>";
    if(orfa){
      /* `Continuar treino →` some: continuar é o que ele não vai fazer num treino de dias
         atrás. finishSession() já descarta série em branco e exercício sem série, e
         validateSession() já barra com erro nomeado quando não sobrou nada — se não houver
         nada válido, isto cai na tela `save` em estado de erro, que já existe. */
      c.appendChild(el("div","muted","Ela não entra no backup e não chega ao vault enquanto não for finalizada."));
      const f=el("button","btn-primary","Finalizar com o que tem");f.style.width="100%";f.style.marginTop="10px";
      f.onclick=finishSession;
      const d=el("button","btn-danger","Descartar");d.style.width="100%";d.style.marginTop="8px";
      d.onclick=()=>{if(confirm("Descartar este treino? Os dados não serão salvos."))
        {active=null;localStorage.removeItem(K.active);go("home");}};
      c.appendChild(f);c.appendChild(d);
    }else{
      const b=el("button","btn-primary","Continuar treino →");b.style.width="100%";
      b.onclick=()=>{wantScrollActive=true;go("log");};
      c.appendChild(b);
    }
    a.appendChild(c);
  }
  a.appendChild(weekBox());

  a.appendChild(el("h3",null,"Escolher treino"));
  const falhou=readFailed(K.sess);
  if(falhou)a.appendChild(el("div","muted","histórico não pôde ser lido — a ordem abaixo é a do template · ver Ajustes → Diagnóstico de dados"));
  const g=el("div","daygrid");
  /* P4.10 — a ordem A,B,C,D era o calendário do plano, que não existe mais: não há
     getDay() em lugar nenhum do arquivo. Ordenada por dias sem treinar, a posição passa a
     significar "o que você deve", que é um invariante melhor que "a letra A vem primeiro".
     Reordenar aqui é seguro e no P4.7 não é: aqui a ordem só muda ENTRE visitas, depois de
     um treino terminar — nunca embaixo do polegar no meio de uma série. */
  const diasDe=d=>{const l=lastSessionFor(d);return l?daysSince(l.date):null;};
  const letras=Object.keys(templates);
  const ordem=falhou?letras:letras.slice().sort((x,y)=>{
    const a1=diasDe(x),b1=diasDe(y);
    if(a1===null&&b1===null)return x<y?-1:1;
    if(a1===null)return -1;               // nunca treinado vai pro topo…
    if(b1===null)return 1;
    if(a1!==b1)return b1-a1;              // …e o resto, mais dias sem treinar primeiro
    return x<y?-1:1;                      // empate de data: desempata pela letra
  });
  ordem.forEach(d=>{
    const t=templates[d];const card=el("button","daycard");
    /* O card imprimia `último: 2026-08-07`. Pra saber que são 24 dias ele tinha que fazer
       conta de data de cabeça, em pé, na porta da academia. Ninguém faz. E o "nunca
       treinado" é textual e SEM cor de aviso: vai pro topo por palpite, mas ausência não
       se disfarça de "há muitos dias", que é um fato que o dado não sustenta. */
    let sel;
    if(falhou)sel="<div class='muted' style='margin-top:4px'>histórico não lido</div>";
    else{
      const n=diasDe(d);
      const txt=n===null?"nunca treinado":n===0?"hoje":n===1?"ontem":"há "+n+" dias";
      const alerta=n!==null&&n>DIAS_ALERTA;   // 4 letras ÷ 3 sessões/semana = ciclo de 9,3 dias
      sel="<div class='muted' style='margin-top:4px'>"+
          (alerta?"<b style='color:var(--warn-tx)'>"+txt+"</b>":txt)+"</div>";
    }
    card.innerHTML="<div class='big'>"+d+"</div><div style='font-weight:600;margin:2px 0'>"+esc(t.name)+"</div>"+
      "<div class='muted'>"+t.ex.length+" exercícios</div>"+sel;
    card.onclick=()=>startSession(d);
    g.appendChild(card);
  });
  a.appendChild(g);

  if(sessions.length){
    a.appendChild(el("h3",null,"Recentes"));
    const c=el("div","card");
    sessions.slice(-5).reverse().forEach(s=>{
      const r=el("div","sess");
      r.innerHTML="<div class='row'><span class='dot'>"+s.day+"</span><div><div style='font-weight:600'>"+esc(templates[s.day]?templates[s.day].name:s.day)+"</div><div class='muted'>"+s.date+" · "+Math.round(sessVol(s))+" kg·rep"+(durTxt(s)?" · "+esc(durTxt(s)):"")+"</div></div></div>";
      const v=el("button","btn-ghost btn-sm","MD");v.onclick=()=>showMarkdown(s);
      r.appendChild(v);c.appendChild(r);
    });
    a.appendChild(c);
  }
}
function lastSessionFor(d){const f=sessions.filter(s=>s.day===d);return f.length?f[f.length-1]:null;}

/* ---------- HOME: as duas perguntas (P4.1 e P4.10) ---------- */
/* 10 dias não é número inventado: 4 letras ÷ 3 sessões/semana (a meta que a R6 baixou) dá
   um ciclo de 9,3 dias. Passar disso significa ter pulado um ciclo inteiro daquela letra.
   Colore o número, não um selo de "atrasado" — é fato, não punição. */
const DIAS_ALERTA=10;
const WEEK_GOAL_DEFAULT=3;
/* Sai do cfg, não do código: o 216 min/mês do cardio virou meta fóssil porque estava
   hardcoded, e a R6 já baixou esta de 4 pra 3. Campo em Ajustes resolve sem release. */
function weekGoal(){const n=parseInt(cfg.weekGoal,10);return (n>0&&n<=14)?n:WEEK_GOAL_DEFAULT;}
// dias inteiros entre uma data AAAA-MM-DD e hoje, hora local (sem UTC no meio)
function daysSince(s){const p=String(s).split("-");
  const a=new Date(+p[0],+p[1]-1,+p[2]),h=new Date();
  return Math.floor((new Date(h.getFullYear(),h.getMonth(),h.getDate())-a)/864e5);}
// segunda a domingo da semana corrente, hora local
function weekRange(){const h=new Date();const x=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  const seg=new Date(x);seg.setDate(x.getDate()-((x.getDay()+6)%7));
  const dom=new Date(seg);dom.setDate(seg.getDate()+6);
  const f=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return [f(seg),f(dom)];}
/* A palavra é "registrados", não "treinos": em agosto foram 11 treinos e 9 registros no app.
   Num app cuja tese é aderência, um contador que erra pra baixo puniria justamente os dias
   em que ele treinou e não anotou — a direção mais cara. O número descreve o registro.
   Dos cinco estados, aqui só existem três: a leitura é síncrona do localStorage (não há
   "carregando") e um contador de uma linha não tem "parcial". Zero é zero e aparece. */
function weekBox(){
  const b=el("div","lastbox");
  const falhou=readFailed(K.sess);
  let hl,sub;
  if(falhou){ hl="histórico não pôde ser lido"; sub="ver Ajustes → Diagnóstico de dados · "+falhou; }
  else{
    const [ini,fim]=weekRange();
    const n=sessions.filter(s=>s.date>=ini&&s.date<=fim).length;
    hl=n+(n===1?" registrado":" registrados")+" · meta "+weekGoal();
    sub="conta treinos registrados neste app";
  }
  b.innerHTML="<div class='lbl'>ESTA SEMANA (SEG–DOM)</div><div class='hl'>"+hl+"</div>"+
              "<div class='muted' style='font-size:12px;margin-top:2px'>"+esc(sub)+"</div>";
  return b;
}
function sessVol(s){return s.exercises.reduce((a,e)=>a+setVol(e.sets),0);}

/* ---------- START / LOG ---------- */
/* ---------- ORDEM DE EXECUÇÃO ---------- */
// Ordem real em que os exercícios foram feitos numa sessão: usa o timestamp
// da 1ª série de cada um; sem timestamp (sessões importadas) cai na ordem gravada.
function execOrderOf(sess){
  return (sess.exercises||[])
    .map((e,i)=>{const ts=(e.sets||[]).map(s=>s.t).filter(Boolean);
                 return {n:e.n,t:ts.length?Math.min.apply(null,ts):Infinity,i:i};})
    .sort((a,b)=>(a.t-b.t)||(a.i-b.i))      // Infinity-Infinity=NaN (falsy) -> desempata por i
    .map(x=>x.n);
}
// Última sessão REPRESENTATIVA do dia: a mais recente que cobriu pelo menos 60%
// dos exercícios do template. Evita que um treino abortado (ex.: 1 exercício)
// bagunce a ordem de todos os próximos.
function refSessionFor(d){
  const t=templates[d]; if(!t) return null;
  const min=Math.max(2,Math.ceil((t.ex||[]).length*0.6));
  const f=sessions.filter(s=>s.day===d);
  for(let i=f.length-1;i>=0;i--){
    const n=(f[i].exercises||[]).filter(e=>(e.sets||[]).length).length;
    if(n>=min) return f[i];
  }
  return null;
}
// Reordena os exercícios do template na ordem da última sessão representativa.
// Exercícios novos (que não estavam nela) mantêm a ordem do template, no fim.
function orderLikeLast(d,exs){
  const last=refSessionFor(d);
  if(!last||!(last.exercises||[]).length) return exs;
  const idx=new Map(execOrderOf(last).map((n,i)=>[n,i]));
  return exs.map((e,i)=>({e:e,i:i}))
    .sort((a,b)=>{const ia=idx.has(a.e.n)?idx.get(a.e.n):Infinity,
                        ib=idx.has(b.e.n)?idx.get(b.e.n):Infinity;
                  return (ia-ib)||(a.i-b.i);})
    .map(x=>x.e);
}

function startSession(d){
  if(active && !confirm("Já existe um treino em andamento. Descartar e começar "+d+"?"))return;
  const t=templates[d];
  active={day:d,date:today(),ciclo:cfg.ciclo,plano:cfg.plano,started:Date.now(),
    exercises:orderLikeLast(d,t.ex).map(e=>({n:e.n,sr:e.sr,rest:e.rest,mvw:e.mvw,notes:e.notes,sets:[]}))};
  ensureIds(active);
  save(K.active,active);go("log");
}
function persistActive(){save(K.active,active);}

function renderLog(a){
  const t=templates[active.day];
  const head=el("div","row");
  head.innerHTML="<div style='flex:1'><h1>Treino "+active.day+"</h1><div class='muted'>"+esc(t.name)+" · "+active.date+"</div></div>";
  const music=el("button","btn-ghost btn-sm","🎵");music.title="Música";music.onclick=openMusic;
  head.appendChild(music);
  a.appendChild(head);

  a.appendChild(el("div","muted","Preencha a série → <b>▶ Descanso</b> conta a pausa → <b>🏁 Próxima</b> grava a pausa e cria a próxima. 🔍 mostra o exercício. O tempo total fica sempre na barra de baixo."));

  // feitos vão pro fim da lista (ordem estável)
  const order=active.exercises.map((e,i)=>i).sort((x,y)=>(active.exercises[x].done?1:0)-(active.exercises[y].done?1:0));
  // ativo = exercício do último set logado; antes de logar qualquer coisa, o 1º não concluído
  let activeIdx=active.ultimoExercicioId
    ? active.exercises.findIndex(e=>e.id===active.ultimoExercicioId) : -1;
  if(activeIdx<0)activeIdx=active.exercises.findIndex(e=>!e.done);
  const nodes={};
  order.forEach(i=>{const n=exCard(active.exercises[i],i,i===activeIdx);nodes[i]=n;a.appendChild(n);});

  /* P4.7 — a lista NÃO reordena durante o treino: mexer debaixo do polegar troca meio
     scroll por um toque no exercício errado. Medido no navegador: o render() a cada série
     preserva a rolagem (nada força layout entre o innerHTML="" e os appendChild), então
     não há posição a consertar ali. O que perde o lugar é a retomada — go("log") faz
     scrollTo(0,0) e o reload nasce no topo. Só nesses dois casos a tela vai até o
     exercício do momento. Isto é rolagem, não uma quarta regra de ordenação. */
  if(wantScrollActive){
    wantScrollActive=false;
    let alvo=(activeIdx>=0&&!active.exercises[activeIdx].done)?activeIdx
            :active.exercises.findIndex(e=>!e.done);
    const card=nodes[alvo];
    /* Sem `behavior:"smooth"` de propósito: medido no navegador, o scroll suave é
       descartado quando o documento está `hidden` — que é exatamente o caso de uma aba
       restaurada. Instantâneo sempre acontece, e numa retomada não há nada pra animar. */
    if(card&&order.indexOf(alvo)>0)setTimeout(()=>card.scrollIntoView({block:"center"}),60);
  }

  const addBtn=el("button","btn-ghost","+ Adicionar exercício");addBtn.style.width="100%";addBtn.style.marginBottom="12px";
  addBtn.onclick=()=>{addExOpen=true;render();};
  a.appendChild(addExOpen?addExPanel():addBtn);

  const fin=el("button","btn-primary","✓ Finalizar treino");fin.style.width="100%";fin.onclick=finishSession;
  a.appendChild(fin);
  const disc=el("button","btn-danger","Descartar");disc.style.width="100%";disc.style.marginTop="8px";
  disc.onclick=()=>{if(confirm("Descartar este treino? Os dados não serão salvos."))
    {active=null;localStorage.removeItem(K.active);go("home");}};
  a.appendChild(disc);
  a.appendChild(el("div",null,"<div style='height:110px'></div>"));
}

/* ============ ADICIONAR EXERCÍCIO (P4.8) ============ */
/* Não é caminho de exceção: 43 das 81 sessões (53%) têm ao menos um exercício fora do
   template. Adicionar no meio do treino é o comportamento normal, não o acidente — e até
   aqui a única porta era um prompt() de texto livre, o pior controle possível pra uma mão
   suada em pé. Ele já partiu 3 séries históricas em duas chaves cada.
   (o `let addExOpen` mora lá em cima, junto do wantScrollActive: o go() o zera.) */

/* Compara nomes ignorando caixa, acento e pontuação. NUNCA é o que se grava: serve só pra
   reconhecer que "OVERHEAD BANCO", "Overhead banco" e "Abdomen - máquina" apontam pro
   mesmo exercício que já está no histórico. */
function normNome(s){return String(s||"").trim().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g," ").trim();}

/* Fonte da lista: nomes distintos das sessões ∪ nomes dos templates — as duas já no
   localStorage, zero dependência nova. As notas do vault ficam de fora: o app não as
   enxerga, e criar esse import é inventar uma dependência que ninguém vai manter.
   `cont` é nº de SESSÕES em que o nome aparece, não nº de séries. */
function exNameOptions(){
  const falhou=readFailed(K.sess);
  const cont={};
  if(!falhou)sessions.forEach(s=>{
    const vistos={};
    (s.exercises||[]).forEach(e=>{const n=(e.n||"").trim();
      if(!n||vistos[n])return;vistos[n]=1;cont[n]=(cont[n]||0)+1;});
  });
  Object.keys(templates).forEach(d=>(templates[d].ex||[]).forEach(e=>{
    const n=(e.n||"").trim();if(n&&cont[n]==null)cont[n]=0;}));
  const lista=Object.keys(cont).sort((a,b)=>(cont[b]-cont[a])||(a<b?-1:1));
  return {lista:lista,cont:cont,falhou:falhou};
}

/* Camada 2 — se o que ele digitou normaliza igual a um nome que já existe, grava o nome que
   já existe. Silencioso é aceitável AQUI e só aqui, porque o resultado é o dado ficar mais
   junto, nunca mais separado. Ainda assim a tela diz qual nome foi usado: escolher por ele
   é uma coisa, não contar é outra. */
function addExercicio(nome){
  const n=String(nome||"").trim();
  if(!n)return;
  const canonico=exNameOptions().lista.find(x=>normNome(x)===normNome(n))||n;
  active.exercises.push({n:canonico,sr:"3×10",rest:60,mvw:false,notes:"",sets:[]});
  ensureIds(active);addExOpen=false;persistActive();render();
  if(canonico!==n)toast('Usei "'+canonico+'" — já está no histórico');
}

/* A lista não é campo de busca: os 9 nomes mais frequentes cobrem 59 dos 74 usos fora do
   template, então ordenada por uso a resposta está nas primeiras linhas e ele não digita
   nada. O filtro existe, mas NÃO recebe foco — abrir teclado por padrão anula o ganho. */
function addExPanel(){
  const o=exNameOptions();
  const c=el("div","card");
  const head=el("div","row");
  head.innerHTML="<div style='flex:1'><h3 style='margin:0'>Adicionar exercício</h3></div>";
  const fechar=el("button","btn-ghost btn-sm","Cancelar");
  fechar.onclick=()=>{addExOpen=false;render();};
  head.appendChild(fechar);c.appendChild(head);

  c.appendChild(el("div","muted",o.falhou
    ? "histórico não pôde ser lido — mostrando só o template"
    : (o.lista.length ? "Ordenados por nº de sessões. Toque num nome, ou crie outro no fim."
                      : "Sem histórico e sem template — só dá pra criar um nome novo.")));

  const filtro=el("input");filtro.type="text";filtro.placeholder="filtrar (opcional)";
  filtro.style.cssText="margin:9px 0;text-align:left";
  c.appendChild(filtro);

  const box=el("div");c.appendChild(box);
  const linhas=o.lista.map(n=>{
    const r=el("div","sess");r.style.cursor="pointer";
    r.innerHTML="<div style='flex:1'><div style='font-weight:600'>"+esc(n)+"</div>"+
      "<div class='muted'>"+(o.cont[n]?o.cont[n]+(o.cont[n]===1?" sessão":" sessões"):"só no template")+"</div></div>";
    r.onclick=()=>addExercicio(n);
    box.appendChild(r);
    return {n:normNome(n),el:r};
  });
  const semMatch=el("div","muted","nenhum nome bate com o filtro — dá pra criar abaixo");
  semMatch.style.display="none";semMatch.style.padding="13px 0";box.appendChild(semMatch);

  /* Criar novo continua possível e não fica escondido: última linha, sempre visível. */
  const novo=el("button","btn-ghost","+ criar novo…");
  novo.style.width="100%";novo.style.marginTop="9px";
  novo.onclick=()=>{const t=filtro.value.trim();
    if(t)return addExercicio(t);
    addExercicio(prompt("Nome do exercício:"));};
  c.appendChild(novo);

  filtro.oninput=()=>{
    const q=normNome(filtro.value);let vis=0;
    linhas.forEach(l=>{const ok=!q||l.n.indexOf(q)>=0;l.el.style.display=ok?"":"none";if(ok)vis++;});
    semMatch.style.display=(vis||!q)?"none":"";
    const t=filtro.value.trim();
    novo.textContent=t?'+ criar "'+t+'"':"+ criar novo…";
  };
  return c;
}

function exerciseHistory(name){
  const out=[];
  for(let i=sessions.length-1;i>=0;i--){const s=sessions[i];const ex=s.exercises.find(x=>x.n===name);
    if(ex&&ex.sets.length)out.push({date:s.date,day:s.day,sets:ex.sets,top:topWeight(ex.sets),vol:setVol(ex.sets)});}
  return out;
}
function fmtSets(sets){return sets.map(st=>(st.w||"?")+"kg×"+(st.r||"?")).join(" · ");}
// condensa séries idênticas: [100×10 ×4] -> "4× 100kg×10"
function summarizeSets(sets){if(!sets.length)return"";const p=[];let i=0;
  while(i<sets.length){const w=sets[i].w||"?",r=sets[i].r||"?";let c=1;
    while(i+c<sets.length&&(sets[i+c].w||"?")===w&&(sets[i+c].r||"?")===r)c++;
    p.push((c>1?c+"× ":"")+w+"kg×"+r);i+=c;}
  return p.join(" · ");}
// selo de evolução comparando carga máx da última vs a anterior
function trendChip(H){if(H.length<2)return"";const d=Math.round((H[0].top-H[1].top)*10)/10;
  if(d>0)return"<span class='trend up'>↑ +"+d+"kg</span>";
  if(d<0)return"<span class='trend dn'>↓ "+d+"kg</span>";
  return"<span class='trend eq'>= manteve</span>";}

function exCard(e,ei,isActive){
  /* P1.7 — "feito" só é verdade se sobrou série. O mesmo filtro do finishSession
     (série sem reps é descartada, exercício sem série não entra no histórico), então
     um exercício marcado sem nenhuma série vira `↷ pulado` nas duas telas. Pulado não
     é feito, e a interface era o único lugar que dizia o contrário. */
  const doneSets=e.sets.filter(s=>s.r!==""&&s.r!=null);
  const pulado=!doneSets.length;
  // estado concluído e recolhido
  if(e.done&&!e.open){
    const d=el("div","exdone");
    if(pulado)d.style.borderLeftColor="var(--muted)";
    d.innerHTML="<span class='ck'"+(pulado?" style='color:var(--muted)'":"")+">"+(pulado?"↷":"✓")+"</span>"+
      "<span class='nm'>"+esc(e.n)+"</span>"+
      "<span class='sm'>"+(pulado?"pulado":summarizeSets(doneSets))+"</span>";
    d.onclick=()=>{e.open=true;persistActive();render();};
    return d;
  }
  const c=el("div","ex"+(isActive?" active":""));
  /* P5.4 — sem tecla de retorno no teclado numérico, não existe "Pronto". Tocar em
     qualquer ponto do próprio cartão que não seja campo nem botão fecha o teclado, em
     vez de obrigar a caçar um vão da tela. */
  c.addEventListener("pointerdown",ev=>{
    if(ev.target.closest("input,select,textarea,button"))return;
    const foco=document.activeElement;
    if(foco&&foco!==document.body&&foco.blur)foco.blur();
  });
  const head=el("div","ex-head");
  head.innerHTML="<div><span class='ex-title'>"+esc(e.n)+"</span>"+(e.mvw?"<span class='tag mvw'>🔑 MVW</span>":"")+
    (e.done?(pulado?"<span class='tag' style='background:rgba(148,163,184,.15);color:var(--muted)'>↷ pulado</span>"
                   :"<span class='tag' style='background:rgba(34,197,94,.15);color:var(--accent-tx)'>✓ feito</span>"):"")+
    "<div class='muted'>alvo "+esc(e.sr)+" · desc "+e.rest+"s</div></div>";
  const doneBtn=el("button","btn-ghost btn-sm",e.done?"▴":"✓");doneBtn.title=e.done?"Recolher":"Marcar como feito";doneBtn.style.flex="0 0 auto";
  doneBtn.onclick=()=>{e.done=true;e.open=false;persistActive();render();};
  const demo=el("button","btn-ghost btn-sm","🔍");demo.title="Ver exercício";demo.style.flex="0 0 auto";
  demo.onclick=()=>openExDemo(e.n);
  head.appendChild(doneBtn);head.appendChild(demo);
  c.appendChild(head);

  // miniatura opcional (imagem própria colada nos Ajustes)
  if(e.img){const im=el("img");im.src=e.img;im.alt=e.n;im.loading="lazy";
    im.style.cssText="width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-bottom:9px";
    im.onerror=()=>im.remove();im.onclick=()=>window.open(e.img,"_blank");c.appendChild(im);}

  // Última vez destacada + histórico recolhível
  const H=exerciseHistory(e.n);
  if(H.length){
    const last=H[0];
    const box=el("div","lastbox");
    box.innerHTML="<div class='lbl'>ÚLTIMA VEZ · "+last.date+"</div>"+
      "<div class='hl'>"+summarizeSets(last.sets)+"</div>"+

let pendingSave=null;   // {sess, v, res} — alimenta a tela de confirmação
function finishSession(){
  // descarta séries em branco e exercícios que ficaram sem nenhuma série válida
  const exs=active.exercises
    .map(({done,open,id,...e})=>({...e,sets:(e.sets||[]).filter(st=>String(st.r==null?"":st.r).trim()!=="")}))
    .filter(e=>e.sets.length);
  const {ultimoExercicioId,ultimoSetAt,nextEid,restTimer,...limpo}=active;
  const sess={...limpo,exercises:exs,finished:Date.now()};
  sess.exercises.forEach(e=>e.sets.forEach(st=>{if(!st.t)st.t=sess.finished;}));

  const v=validateSession(sess);
  if(v.erros.length){                              // não salva calado
    logIO("validate-fail",K.sess,v.erros.join(" | "));
    pendingSave={sess:sess,v:v,res:null};go("save");return;
  }
  const antes=(load(K.sess,[])||[]).length;
  sessions.push(sess);
  if(!save(K.sess,sessions)){
    sessions.pop();
    pendingSave={sess:sess,v:v,res:{ok:false,msg:"o navegador recusou a gravação — veja Ajustes → Diagnóstico de dados"}};
    go("save");return;
  }
  const relido=load(K.sess,null);                  // prova de que foi gravado mesmo
  if(!Array.isArray(relido)||relido.length!==antes+1){
    logIO("readback-fail",K.sess,"esperado "+(antes+1)+" treinos, releitura trouxe "+(Array.isArray(relido)?relido.length:"nada"));
    sessions.pop();
    pendingSave={sess:sess,v:v,res:{ok:false,msg:"o armazenamento não confirmou a gravação"}};
    go("save");return;
  }
  logIO("ok",K.sess,"treino "+sess.day+" "+sess.date+" · "+v.stats.sets+" séries · "+v.stats.vol+" kg·rep",
        JSON.stringify(sessions).length);
  active=null;try{localStorage.removeItem(K.active);}catch(e){}
  pendingSave={sess:sess,v:v,res:{ok:true,total:relido.length}};
  go("save");
}

/* Conteúdo real do backup, sem abrir o arquivo: o que a tela promete tem que ser
   o que o export leva. */
function backupStats(){
  const sets=sessions.reduce((a,x)=>a+(x.exercises||[]).reduce((b,e)=>b+(e.sets||[]).length,0),0);

/* ---------- BACKUP PRO VAULT — um toque, um arquivo ---------- */
/* Até a v1.3.2 um toque de export disparava três shares (backup, treinos.json e .md),
   cada um abrindo share sheet e deixando lixo, e dois deles sem consumidor nenhum: o
   recolher_treino.py classifica `gymlog/*` como ignorar e regenera o treinos.json a
   partir do backup, e nunca leu o .md do celular.
   O toast antigo disparava ANTES do share e nunca reportava resultado — dizia "backup:
   N treinos" mesmo quando o usuário cancelava. Agora o card se reescreve no lugar,
   depois do share resolver, com o que saiu de fato. Cancelar e falhar são estados
   distintos e nomeados; em nenhum dos dois o botão some. */
let bkState={phase:"idle"};   // idle | busy | done | abort | fail

function renderBackupBlock(host){
  host.innerHTML="";
  const st=backupStats(), S=bkState;
  /* P1.10 — cicatriz nº 2 aplicada ao lugar certo: a confirmação mostra o conteúdo real
     E o que não é conteúdo. O bloco anunciava "81 treinos · 1465 séries" com a mesma
     confiança havendo ou não uma sessão pendurada fora do payload. */
  if(isOrfa()){
    const w=el("div","muted");
    w.style.cssText="color:var(--warn-tx);margin-bottom:10px";
    w.innerHTML="⚠ <b>1 sessão não finalizada ("+esc(active.day)+" · "+esc(ddmm(active.date))+

    g.onclick=()=>go("home");
    host.appendChild(w);host.appendChild(g);
  }
  const b=el("button","btn-primary","⬇ Backup pro vault");
  b.style.width="100%";

  if(!st.treinos){                                   // VAZIO — desabilitado, não some
    b.disabled=true;b.title="Nada pra exportar";
    host.appendChild(b);
    host.appendChild(el("div","muted","Nada pra exportar: <b>0 treinos</b> no histórico. "+
      "O botão volta assim que o primeiro treino for salvo."));
    return;
  }
  if(S.phase==="busy"){                              // CARREGANDO — recusa segundo toque
    b.disabled=true;b.textContent="⬇ Compartilhamento aberto…";
  }else{
    b.onclick=()=>runBackup(host);
  }
  host.appendChild(b);

  if(S.phase==="busy"){
    host.appendChild(el("div","muted","Escolha <b>Salvar em Arquivos → iCloud Drive</b>. "+
      "Não toque de novo enquanto isso: o segundo toque exporta um arquivo duplicado."));
  }else if(S.phase==="done"){                        // CHEIO — o que saiu de fato
    const d=el("div");d.style.cssText="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)";
    d.innerHTML="<div style='font-weight:700;color:var(--accent-tx)'>✓ "+
        (S.via==="share"?"Entregue ao compartilhamento":"Baixado")+" às "+esc(S.hora)+"</div>"+
      "<div style='margin-top:4px;font-variant-numeric:tabular-nums'><b>"+S.treinos+"</b> "+
        (S.treinos===1?"treino":"treinos")+" · <b>"+S.sets+"</b> "+(S.sets===1?"série":"séries")+
        (S.de?" · "+esc(S.de)+" → "+esc(S.ate):"")+" · <b>"+S.kb+" KB</b></div>"+
      "<div class='muted' style='margin-top:2px'><code>"+esc(S.fn)+"</code></div>"+
      "<div class='muted' style='margin-top:6px'>Salve em <b>iCloud Drive</b> — a raiz serve. "+
        "O app entrega o arquivo ao iOS e não enxerga onde ele parou: confira em <b>Arquivos</b>.</div>"+
      (S.cfgOk?"":"<div style='margin-top:6px;color:var(--warn-tx);font-weight:650'>⚠ O arquivo saiu, "+
        "mas a data do último backup não pôde ser gravada — veja Ajustes → Diagnóstico de dados.</div>");
    host.appendChild(d);
  }else if(S.phase==="abort"){                       // CANCELADO — não é erro
    const d=el("div");d.style.cssText="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)";
    d.innerHTML="<div style='font-weight:650'>Export cancelado às "+esc(S.hora)+"</div>"+
      "<div class='muted' style='margin-top:2px'>Você fechou o compartilhamento antes de escolher onde salvar. "+
      "Nada saiu e nada foi perdido — o histórico continua aqui. Toque de novo quando quiser.</div>";
    host.appendChild(d);
  }else if(S.phase==="fail"){                        // ERRO — motivo visível
    const d=el("div");d.style.cssText="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)";
    d.innerHTML="<div style='font-weight:700;color:var(--danger-tx)'>✕ O backup não saiu ("+esc(S.hora)+")</div>"+
      "<div class='muted' style='margin-top:2px'>Motivo: "+esc(S.msg)+"</div>"+
      "<div class='muted' style='margin-top:4px'>O histórico não foi tocado. Registrado em "+
      "Ajustes → Diagnóstico de dados → Log de gravações.</div>";
    host.appendChild(d);
  }
}

async function runBackup(host){
  if(bkState.phase==="busy")return;                  // segundo toque não passa
  const st=backupStats();
  const fn="treino-backup-"+today()+".json";
  const hora=fmtClock(Date.now());
  if(!st.treinos){bkState={phase:"fail",fn:fn,hora:hora,msg:"nenhum treino no histórico"};
    renderBackupBlock(host);return;}
  let payload;
  try{ payload=JSON.stringify({templates,sessions,cfg},null,2); }
  catch(e){ const m=(e&&e.message)||String(e);
    logIO("backup-fail",K.sess,"não deu pra montar o JSON: "+m);
    bkState={phase:"fail",fn:fn,hora:hora,msg:"não deu pra montar o JSON — "+m};
    renderBackupBlock(host);return; }
  const blob=new Blob([payload],{type:"application/json"});
  bkState={phase:"busy",fn:fn};renderBackupBlock(host);

  let via=null;
  try{
    let file=null;
    try{ if(navigator.canShare&&window.File){
            const f=new File([blob],fn,{type:"application/json"});
            if(navigator.canShare({files:[f]}))file=f; } }catch(e){ file=null; }
    if(file){ await navigator.share({files:[file]}); via="share"; }  // só `files`: `title` virava um segundo item
    else{                                                            // fallback desktop
      const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=fn;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
      via="download";
    }
  }catch(e){
    const fim=fmtClock(Date.now());
    if(e&&e.name==="AbortError"){                    // cancelar não é falhar
      logIO("backup-cancel",K.sess,"export cancelado antes de escolher destino — nada saiu");
      bkState={phase:"abort",fn:fn,hora:fim};
    }else{
      const m=(e&&e.message)||String(e);
      logIO("backup-fail",K.sess,"share recusou: "+m);
      bkState={phase:"fail",fn:fn,hora:fim,msg:m};
    }
    renderBackupBlock(host);return;
  }
  cfg.lastBackup=today();
  const cfgOk=save(K.cfg,cfg);
  logIO("backup",K.sess,st.treinos+" treinos · "+st.sets+" séries · "+fn+" · via "+via,blob.size);
  bkState={phase:"done",fn:fn,hora:fmtClock(Date.now()),kb:Math.round(blob.size/1024),via:via,
           treinos:st.treinos,sets:st.sets,de:st.de,ate:st.ate,cfgOk:cfgOk};
  const lb=$("#cfgLastBk");if(lb)lb.textContent=cfg.lastBackup;   // a linha de aviso do card não fica atrasada
  renderBackupBlock(host);
}

function sessionMarkdown(s){

    (s.started?"\nHora: "+fmtClock(s.started):"")+(dmy?"\nDuração: "+dmy:"")+"\n---\n\n";
  md+="# Treino "+s.day+" — "+name+" ("+s.date+")\n\n";
  md+="| Ordem | Exercício | Séries×Reps | Descanso | Notas |\n";
  md+="|-------|-----------|-------------|----------|-------|\n";

  s.exercises.forEach((e,i)=>{
    const sets=e.sets.map(st=>(st.w?st.w+"kg×":"")+ (st.r||"?")).join(" · ");
    const rirs=e.sets.map(st=>st.rir).filter(x=>x!=null&&x!=="");
    const rr=e.sets.map(st=>st.rest).filter(x=>x!=null);
    rr.forEach(x=>restTotal+=x);
    const restCol=rr.length?rr.map(x=>x+"s").join("·")+" (méd "+Math.round(rr.reduce((a,b)=>a+b,0)/rr.length)+"s)":(e.rest?"alvo "+e.rest+"s":"—");
    const note=[e.notes,rirs.length?"RIR "+rirs.join("/"):""].filter(Boolean).join(" · ");
    md+="| "+(i+1)+" | [["+e.n+"]]"+(e.mvw?" 🔑":"")+" | "+sets+" | "+restCol+" | "+note+" |\n";
  });
  md+="\n**Volume total:** "+Math.round(sessVol(s))+" kg·rep\n";
  const dm=durMin(s);
  if(dm)md+="**Duração:** "+dm+" min ("+fmtClock(s.started)+"–"+fmtClock(s.finished)+")\n";
  if(restTotal)md+="**Descanso total:** "+Math.round(restTotal/60)+" min ("+restTotal+"s registrados)\n";
  return md;
}

/* v1.4.0: o download() genérico saiu junto com os exports que ele servia. Ele engolia
   o AbortError num `return false` que ninguém lia — a cicatriz nº2 na tela de export.
   Quem exporta agora é o runBackup(), que nomeia cancelamento e falha na tela. */

/* ---------- HISTÓRICO / CHARTS ---------- */
/* P5.6 — `histEx = names[0]` abria sempre em "Abdomen - máquina", o primeiro alfabético
   entre 45 nomes: pra ver o que interessa, uma roda de 45 itens com uma mão. O padrão
   passa a ser o exercício-chave da sessão mais recente — o mais provável de
   ele querer ver logo depois de treinar — e a escolha vai pro cfg, sobrevivendo ao
   reload. Só entra em `names`: exercício que saiu do histórico não seleciona nada. */
function histExPadrao(names){
  for(let i=sessions.length-1;i>=0;i--){
    const exs=(sessions[i].exercises||[]).filter(e=>(e.sets||[]).length&&names.indexOf(e.n)>=0);
    if(!exs.length)continue;
    /* Dentro da sessão, o exercício-chave (MVW) ganha do último da lista. Medido na sessão
       de 29/08: "último com série" abria em `Abdômen voador `, o acessório do fim; o primeiro
       MVW abre em `Stiff - com barra solta`, que é o motivo do treino C existir. */
    const chave=exs.filter(e=>e.mvw);
    return (chave.length?chave[0]:exs[0]).n;
  }
  return names[0];
}

  if(!sessions.length){

function drawChart(cv,pts,unit){
  const dpr=window.devicePixelRatio||1;const W=cv.clientWidth,H=200;
  cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const pad={l:38,r:12,t:14,b:26};
  const xs=pts.map((_,i)=>i),ys=pts.map(p=>p.y);
  let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn=mn*0.9;mx=mx*1.1||1;}
  const rng=mx-mn||1;mn-=rng*0.1;mx+=rng*0.1;
  const px=i=>pad.l+(pts.length<=1?(W-pad.l-pad.r)/2:(i/(pts.length-1))*(W-pad.l-pad.r));
  const py=v=>pad.t+(1-(v-mn)/(mx-mn))*(H-pad.t-pad.b);
  // grid + y labels
  ctx.strokeStyle="#26313d";ctx.fillStyle="#8b97a6";ctx.font="10px -apple-system,sans-serif";ctx.lineWidth=1;
  for(let g=0;g<=3;g++){const v=mn+(mx-mn)*g/3,y=py(v);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.textAlign="right";ctx.fillText(Math.round(v),pad.l-5,y+3);}
  // area
  ctx.beginPath();pts.forEach((p,i)=>{const X=px(i),Y=py(p.y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
  ctx.lineTo(px(pts.length-1),H-pad.b);ctx.lineTo(px(0),H-pad.b);ctx.closePath();
  ctx.fillStyle="rgba(34,197,94,.12)";ctx.fill();
  // line
  ctx.beginPath();pts.forEach((p,i)=>{const X=px(i),Y=py(p.y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
  ctx.strokeStyle="#22c55e";ctx.lineWidth=2.5;ctx.lineJoin="round";ctx.stroke();
  // points + x labels
  ctx.fillStyle="#22c55e";
  pts.forEach((p,i)=>{const X=px(i),Y=py(p.y);ctx.beginPath();ctx.arc(X,Y,3.5,0,7);ctx.fill();});
  ctx.fillStyle="#8b97a6";ctx.textAlign="center";
  const step=Math.ceil(pts.length/5);
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1){ctx.fillText(p.x.slice(5),px(i),H-8);}});
}

  g1.appendChild(chartCard("Sessões por dia da semana","cDow","todo o histórico · descritivo, sem meta"));

  /* ===== 2 · EXECUÇÃO ===== */

  pc.innerHTML="<h3 style='margin:0 0 6px'>Progressão por exercício</h3>";pc.appendChild(sel);
  const pw=el("div");pw.style.cssText="position:relative;height:240px";const pcv=el("canvas");pcv.id="cProg";pw.appendChild(pcv);pc.appendChild(pw);
  g3.appendChild(pc);
  g3.appendChild(cardTetoCarga(sess));
  g3.appendChild(cardVolLetra(sess));

  /* ===== 4 · RESULTADO ===== */
