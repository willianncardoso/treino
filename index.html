     de verdade). Fora da conta não é omitido: o rodapé diz quantos ficaram de fora. */
  const avs=sess.filter(s=>s.avulso),avL=[...new Set(avs.map(s=>s.day))].sort().join("/");
  const avNota=c=>{if(avs.length){const n=el("div","muted",avs.length+(avs.length===1?" treino "+esc(avL)+" avulso fora da contagem":" treinos "+esc(avL)+" avulsos fora da contagem"));
    n.style.marginTop="6px";n.dataset.avulsos=avs.length;c.appendChild(n);}return c;};
  g1.appendChild(avNota(chartCard("Volume & frequência mensal","cVolFreq","Volume (barras) e nº de sessões (linha)")));
  /* P6.4 — sex 18 · ter 17 · qua 12 · sáb 12 · seg 10 · qui 10 · dom 2. A segunda-feira, onde o
     plano põe a abertura da semana, é um dos dias mais fracos de toda a história. Descritivo:
     sem meta, sem cor de alarme — o P4.10 já age sobre isto na Home. */
  g1.appendChild(avNota(chartCard("Sessões por dia da semana","cDow","todo o histórico · descritivo, sem meta")));

  /* ===== 2 · EXECUÇÃO ===== */
  const g2=secao("2 · Execução","o que aconteceu no treino?");
  g2.appendChild(cardDescanso());

  /* ===== 3 · PROGRESSÃO ===== */
  const g3=secao("3 · Progressão","está ficando mais forte?");
  // progressão por exercício
  const pc=el("div","card");pc.style.margin="0";
  const names=[...new Set(sess.flatMap(s=>s.exercises.map(e=>e.name)))].sort();
  if(!analProgEx||!names.includes(analProgEx))analProgEx=names[0];
  const sel=el("select");sel.style.marginBottom="8px";names.forEach(n=>{const o=el("option",null,esc(n));o.value=n;if(n===analProgEx)o.selected=true;sel.appendChild(o);});
  sel.onchange=()=>{analProgEx=sel.value;render();};
  pc.innerHTML="<h3 style='margin:0 0 6px'>Progressão por exercício</h3>";pc.appendChild(sel);
  const pw=el("div");pw.style.cssText="position:relative;height:240px";const pcv=el("canvas");pcv.id="cProg";pw.appendChild(pcv);pc.appendChild(pw);
  g3.appendChild(pc);
  g3.appendChild(cardTetoCarga(sess));
  g3.appendChild(cardVolLetra(sess));

  /* ===== 4 · RESULTADO ===== */
  const g4=secao("4 · Resultado","o corpo mudou?");
  const grid=g4;                                  // os cartões do Health vivem todos aqui
  if(!H){const av=el("div","card","<div class='empty' style='padding:24px 12px'><div class='ic'>📭</div><div>Carregue o <b>apple_health.json</b> (do vault <code>_dados/</code>) pra ver composição corporal, recuperação e o cruzamento treino×gordura. Botão no topo da página ↑</div></div>");av.classList.add("full");g4.appendChild(av);}
  if(H){const cc=chartCard("Composição corporal","cComp","Peso e massa magra (kg) · gordura (%) · faixas de meta tracejadas");cc.classList.add("full");grid.appendChild(cc);
    grid.appendChild(chartCard("Treino × Gordura","cTrFat","Volume mensal (barras) vs % gordura (linha) — a correlação-chave"));}
  if(H){
    /* P1.8 — o rótulo nomeia FONTE e FILTRO, nunca virtude. "Cardio" afirmava que o que
       estava ali era treino; contava 834 min de caminhada de deslocamento em agosto (FC
       média 100) e marcava 1.030 min contra uma meta de 216. O título carrega o próprio
       critério: não consegue mentir sem que mudar a mentira exija mudar o título. */
    const cardioSub="sessões do Apple Watch com FC média ≥ "+FC_ESFORCO+" bpm · exclui deslocamento a pé e de bike";
    grid.appendChild((H.workouts&&H.workouts.length)
      ? chartCard("Esforço (min/mês · FC ≥ "+FC_ESFORCO+")","cCardio",cardioSub)
      : chartAusente("Esforço (min/mês · FC ≥ "+FC_ESFORCO+")","workouts"));
    /* "meta 8.000/dia" saiu: 8k é referência geral de saúde, não está no plano do vault,
       e ele anda 13,6 mil. Meta que ninguém decidiu é o 216 do cardio em escala menor. */
    grid.appendChild(H.daily.Steps
      ? chartCard("Passos (méd/dia por mês)","cSteps","referência 8.000/dia (geral — o plano não tem meta de passos)")
      : chartAusente("Passos (méd/dia por mês)","Steps"));
    grid.appendChild(H.daily.ExerciseMinutes
      ? chartCard("Minutos de exercício (méd/dia por mês)","cExerc","anéis do Watch")
      : chartAusente("Minutos de exercício (méd/dia por mês)","ExerciseMinutes"));
    grid.appendChild(chartCard("Recuperação (FC repouso × HRV)","cRec","bpm e ms"));
    grid.appendChild(chartCard("VO2 Max","cVO2",""));
    grid.appendChild(chartCard("Sono (méd h/noite por mês)","cSleep","* soma de intervalos — direção confiável, valor absoluto pode inflar"));
    grid.appendChild(cardDefasagem(H));}
  // PRs — quando bateu cada recorde (ordenado por data, recentes destacados)
  const prc=el("div","card");prc.style.margin="0";prc.classList.add("full");
  const prm={};sess.forEach(s=>s.exercises.forEach(e=>{if(e.top>((prm[e.name]||{}).top||0))prm[e.name]={top:e.top,date:s.date};}));
  const lastDate=sess.length?sess[sess.length-1].date:null;
  const rows=Object.keys(prm).map(n=>({n,top:prm[n].top,date:prm[n].date}))
    .sort((x,y)=>x.date<y.date?1:-1); // mais recente primeiro
  let prh="<div class='row' style='justify-content:space-between'><h3 style='margin:0'>Recordes (PR) — quando bati</h3><span class='muted' style='font-size:12px'>🟢 = PR nos últimos 45 dias</span></div>"+
    "<table style='width:100%;border-collapse:collapse;font-size:14px;margin-top:6px'>";
  rows.forEach(r=>{const isRecent=lastDate&&(new Date(lastDate)-new Date(r.date))/864e5<=45;
    prh+="<tr style='border-top:1px solid var(--border)'><td style='padding:7px 0'>"+(isRecent?"🟢 ":"")+esc(r.n)+"</td><td style='text-align:right;font-weight:700"+(isRecent?";color:var(--accent-tx)":"")+"'>"+r.top+" kg</td><td style='text-align:right;color:var(--muted);padding-left:10px;white-space:nowrap'>"+fmtD(r.date)+"</td></tr>";});
  prh+="</table>";prc.innerHTML=prh;g3.appendChild(prc);
  a.appendChild(el("div",null,"<div style='height:40px'></div>"));

  // renderiza gráficos
  ensureChart(()=>buildCharts(sess,H));
}
/* P6.7 — a pergunta era "volume por grupo muscular", e o app NÃO SABE o que é quadríceps:
   zero ocorrências de grupo muscular no arquivo. O `muscles` do treinos.json vem do Python
   lendo as notas do vault e está sujo (37 exercícios marcados "Tipo: Exercício Físico",
   `Glúteos` vs `Glúteos Superior`, `Panturilha`). Popular um mapa à mão pra 45 nomes e mantê-lo
   a cada troca de ciclo é o custo que já foi recusado em "Não vai ser feito".
   O split É a divisão muscular deste programa, então a resposta sai por letra — dado que o app
   já tem. Por isso nenhum nome de grupo muscular entra na tela, nem pelo templates[].name.
   E é MÉDIA POR SESSÃO, não soma do mês: julho teve 13 sessões e agosto 9, e a soma faria
   julho parecer um mês diferente quando foi só o mês em que ele mais treinou. */
/* v1.20.0 — as letras saem dos templates (sem o avulso), não de uma lista fixa: com
   ["A","B","C","D"] o F do C5 sumia dos dois gráficos e das faltas, sem aviso. Inclui a
   condicional (o F é treino de rotação). Templates ilegíveis/vazios → nenhuma linha, e o
   card diz que não há treino cadastrado em vez de desenhar um gráfico vazio calado. */
function cardVolLetra(sess){
  const LETRAS=letrasRotacao();
  const c=el("div","card");c.style.margin="0";c.classList.add("full");
  let h="<h3 style='margin:0 0 2px'>Volume por letra (média por sessão)</h3>";
  if(!sess.length){c.innerHTML=h+"<div class='empty' style='padding:24px 12px'><div class='ic'>📊</div><div>Sem sessões carregadas.</div></div>";return c;}
  if(!LETRAS.length){c.innerHTML=h+"<div class='empty' style='padding:24px 12px'><div class='ic'>📊</div><div>Nenhum treino de rotação cadastrado · ver Ajustes → Editar treinos</div></div>";return c;}
  const meses=[...new Set(sess.map(s=>s.date.slice(0,7)))].sort();
  const conta={};sess.forEach(s=>{const k=s.day+"|"+s.date.slice(0,7);(conta[k]=conta[k]||[]).push(s.vol);});
  /* Lacuna NÃO é zero: em agosto o D teve zero sessões, e não treinar é diferente de treinar
     leve. A linha se interrompe (spanGaps:false) e a ausência é dita em texto. */
  const ult=meses.slice(-3);
  const faltas=ult.map(m=>{const f=LETRAS.filter(L=>!conta[L+"|"+m]);
      return f.length?mesRotulo(m)+": sem "+f.join(", "):null;}).filter(Boolean);
  h+="<div class='muted' style='font-size:12px;margin-bottom:8px'>kg·rep médio por sessão de cada treino, por mês · a soma do mês faria julho (13 sessões) parecer diferente de agosto (9) sem que o treino tivesse mudado</div>";
  c.innerHTML=h;
  const wrap=el("div");wrap.style.cssText="position:relative;height:280px";
  const cv=el("canvas");cv.id="cVolLetra";wrap.appendChild(cv);c.appendChild(wrap);
  const n=el("div","muted");n.style.marginTop="6px";
  n.innerHTML="linha interrompida = mês sem nenhuma sessão daquela letra, que não é volume zero"+
    (faltas.length?"<br>últimos 3 meses — "+esc(faltas.join(" · ")):"<br>sem lacunas nos últimos 3 meses");
  c.appendChild(n);return c;
}
function mesRotulo(m){const p=String(m).split("-");return (MESN[(+p[1])-1]||p[1])+"/"+p[0].slice(2);}

/* P6.1 — a defasagem entre treinar e a balança. r = −0,64 entre treinos/semana e peso médio 14
   dias depois (n=16, fev–ago) é a única coisa nos dados ligando esforço a resultado com atraso.
   Duas regras que a tela obedece:
   1) NENHUMA PREVISÃO. O cartão mostra associação passada; nada de "treinar N vezes → perder X".
   2) O confundidor vai NO CORPO, não no rodapé: semana de mais treino costuma ser semana de
      melhor alimentação, e a R6 concluiu por eliminação que a alavanca é energia. É provável
      que este gráfico esteja medindo nutrição vestida de treino, e isso está escrito na tela.
   O r não vai pra tela de propósito: com n=16 ele muda de −0,64 pra −0,12 se a janela incluir
   as duas semanas isoladas de 2025. Número frágil na tela vira número citado. */
function cardDefasagem(H){
  const bm=(H&&H.daily&&H.daily.BodyMass_kg)||null;
  if(!bm)return chartAusenteGlobal("Treino × peso (defasagem de "+PESO_LAG_DIAS+" dias)","BodyMass_kg");
  const c=el("div","card");c.style.margin="0";c.classList.add("full");
  let h="<h3 style='margin:0 0 2px'>Treino × peso (defasagem de "+PESO_LAG_DIAS+" dias)</h3>"+
        "<div class='muted' style='font-size:12px;margin-bottom:8px'>treinos por semana e o peso médio de <b>"+PESO_LAG_DIAS+" dias depois</b> — o peso responde com atraso</div>";
  c.innerHTML=h;
  const wrap=el("div");wrap.style.cssText="position:relative;height:280px";
  const cv=el("canvas");cv.id="cLag";wrap.appendChild(cv);c.appendChild(wrap);
  const pares=paresDefasagem(bm);
  const n=el("div","muted");n.style.marginTop="6px";
  n.innerHTML=pares.n+" semanas com treino e peso · <b>direção confiável, força não</b> · semanas de mais treino também costumam ser semanas de melhor alimentação"+
    (pares.n<20?"<br>amostra pequena: a associação passada não vira previsão, e o cartão não projeta nenhuma":"");
  c.appendChild(n);return c;
}
/* Fora da renderAnalise porque o chartAusente vive dentro dela; este é o mesmo card, em
   função global, pro cartão de defasagem poder usá-lo. */
function chartAusenteGlobal(title,key){const c=el("div","card");c.style.margin="0";c.classList.add("full");
  c.innerHTML="<h3 style='margin:0 0 2px'>"+title+"</h3>"+
    "<div class='empty' style='height:200px;display:flex;flex-direction:column;justify-content:center;padding:0'>"+
    "<div class='ic'>📭</div><div>A chave <b>"+esc(key)+"</b> não veio neste <code>apple_health.json</code>.<br>"+
    "Sem peso não há defasagem a medir.</div></div>";
  return c;}
function paresDefasagem(bm){
  const tre={},pes={};
  sessions.forEach(s=>{if(!s.date||s.avulso===true)return;const w=segundaDe(s.date);tre[w]=(tre[w]||0)+1;});   // v1.17.0: treinos/semana sem avulso
  Object.keys(bm||{}).forEach(d=>{const w=segundaDe(d);(pes[w]=pes[w]||[]).push(bm[d]);});
  const med={};for(const w in pes)med[w]=pes[w].reduce((a,b)=>a+b,0)/pes[w].length;
  /* Mesmo corte dos cartões vizinhos (2025-11). Antes disso há duas semanas soltas de 2025 que
     não descrevem este programa e sozinhas mudam o sinal da leitura. */
  const semanas=[...new Set(Object.keys(tre).concat(Object.keys(med)))].sort().filter(w=>w>="2025-11-01");
  const labels=[],tr=[],pw=[];let n=0;
  semanas.forEach(w=>{
    const t=tre[w]==null?null:tre[w];
    const p=med[maisDias(w,PESO_LAG_DIAS)];
    labels.push(w);tr.push(t);pw.push(p==null?null:Math.round(p*10)/10);
    if(t!=null&&p!=null)n++;});
  return {labels:labels,treinos:tr,peso:pw,n:n};
}

/* P6.2 — o pedido original era "os PRs atuais são de fevereiro: 8 exercícios com carga máxima
   de seis meses atrás". O número diz outra coisa: refeito o cálculo, 25 dos 33 exercícios com
   duas ou mais sessões fizeram a ÚLTIMA série já no próprio teto. Não é regressão, é
   estagnação encostado no teto — que foi a conclusão da R6. E o modo de falha documentado dele
   é desânimo (R2, queda de 3,6 → 1,9 treinos/semana): uma tela dizendo "seu pico é de seis
   meses atrás" pra quem bateu o pico neste mês seria ativamente pior que não construir.
   Por isso `no teto` é rótulo de elogio, empate conta como no teto (`>=`), e a única lista com
   urgência é a dos 8 que têm o que recuperar.
   É tabela e não <canvas> de propósito: o rótulo `no teto` precisa existir no innerText — num
   gráfico ele seria pixel dentro do canvas e nenhum aceite conseguiria verificá-lo. */
function cardTetoCarga(sess){
  const c=el("div","card");c.style.margin="0";c.classList.add("full");
  const falhou=readFailed(K.sess);
  const m={};
  sess.forEach(s=>s.exercises.forEach(e=>{
    if(!(e.top>0))return;                       // sem carga não há teto: peso corporal fica fora
    const o=m[e.name]||(m[e.name]={teto:0,ultima:0,quando:null,n:0});
    o.n++;if(e.top>o.teto)o.teto=e.top;
    o.ultima=e.top;o.quando=s.date;             // sess vem ordenado por data crescente
  }));
  const nomes=Object.keys(m);
  const medidos=nomes.filter(n=>m[n].n>=2);     // uma sessão só: não há distância a medir
  const unicos=nomes.length-medidos.length;
  let h="<h3 style='margin:0 0 2px'>Teto de carga por exercício</h3>";
  if(!medidos.length){
    h+="<div class='empty' style='padding:24px 12px'><div class='ic'>🏔</div><div>"+
       (falhou?"O histórico não pôde ser lido — <b>"+esc(falhou)+"</b>."
              :"Nenhum exercício com carga em duas ou mais sessões ainda.<br>O teto aparece quando houver uma segunda sessão pra comparar.")+
       "</div></div>";
    c.innerHTML=h;return c;}
  medidos.sort((a,b)=>{const ra=m[a].ultima/m[a].teto,rb=m[b].ultima/m[b].teto;
    return (ra-rb)||(a<b?-1:1);});              // mais longe do teto primeiro
  const noTeto=medidos.filter(n=>m[n].ultima>=m[n].teto).length;
  const abaixo=medidos.length-noTeto;
  h+="<div class='muted' style='font-size:12px;margin-bottom:8px'>"+
     "<b>"+noTeto+" dos "+medidos.length+"</b> exercícios com duas ou mais sessões fizeram a última série no próprio teto · "+
     abaixo+" est"+(abaixo===1?"á":"ão")+" abaixo dele"+
     (unicos?" · "+unicos+(unicos===1?" exercício ficou de fora por ter uma sessão só":" exercícios ficaram de fora por terem uma sessão só")+" — não há distância a medir":"")+
     "<br>barra = última carga · traço = maior carga já registrada · empate conta como <b>no teto</b></div>";
  h+="<table style='width:100%;border-collapse:collapse;font-size:14px'>";
  medidos.forEach(n=>{
    const o=m[n],pct=Math.max(4,Math.round(100*o.ultima/o.teto));
    const ok=o.ultima>=o.teto;
    const cor=ok?"var(--accent)":"var(--warn)";
    h+="<tr style='border-top:1px solid var(--border)'>"+
       "<td style='padding:7px 10px 7px 0;white-space:nowrap'>"+esc(n)+"</td>"+
       "<td style='width:40%'><div style='height:10px;border-radius:5px;background:var(--surface2);position:relative'>"+
         "<div style='position:absolute;left:0;top:0;bottom:0;width:"+pct+"%;background:"+cor+";border-radius:5px'></div>"+
         "<div style='position:absolute;right:0;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55'></div>"+
       "</div></td>"+
       "<td style='text-align:right;padding-left:10px;white-space:nowrap'><b>"+o.ultima+"</b><span class='muted'> / "+o.teto+" kg</span></td>"+
       "<td style='text-align:right;padding-left:10px;white-space:nowrap'>"+
         (ok?"<b style='color:var(--accent-tx)'>no teto</b>"
            :"<span class='muted'>"+Math.round(100*(1-o.ultima/o.teto))+"% abaixo</span>")+"</td>"+
       "<td style='text-align:right;color:var(--muted);padding-left:10px;white-space:nowrap'>"+fmtD(o.quando)+"</td></tr>";
  });
  h+="</table>";
  if(falhou)h+="<div class='muted' style='margin-top:6px'>parte do histórico não pôde ser lida — "+esc(falhou)+"</div>";
  c.innerHTML=h;return c;
}

/* P6.3 — o cartão que torna visível o aceite de resultado do P5.1, em vez de eu rodar a
   medição à mão na R7. Cinco estados: sem pausa nenhuma (empty que ensina como se grava uma),
   só pausas de antes do alarme (é o estado de hoje, e a tela DIZ que o depois ainda não
   existe), as duas populações, erro de leitura do histórico, e o cheio.
   A "linha da meta" que o recorte pedia não é desenhável: a meta é POR EXERCÍCIO e vale 0,
   45, 60, 90, 120 ou 150 s (5/49/106/54/62/19 pausas). Uma linha única no eixo de segundos
   seria uma média inventada. O fato que ela queria mostrar — quantas pausas passam da meta do
   próprio exercício — vai em texto, comparando cada pausa com a SUA meta. */
function cardDescanso(){
  const c=el("div","card");c.style.margin="0";
  const falhou=readFailed(K.sess);
  const P=pausasRegistradas();
  if(falhou&&!P.length){
    c.innerHTML="<h3 style='margin:0 0 2px'>Distribuição de descanso</h3>"+
      "<div class='empty' style='padding:24px 12px'><div class='ic'>⚠️</div><div>O histórico não pôde ser lido — <b>"+esc(falhou)+"</b>.<br>Nada foi apagado; ver Ajustes → Diagnóstico de dados.</div></div>";
    return c;}
  if(!P.length){
    c.innerHTML="<h3 style='margin:0 0 2px'>Distribuição de descanso</h3>"+
      "<div class='empty' style='padding:24px 12px'><div class='ic'>⏱</div><div>Nenhuma pausa registrada.<br>A pausa só é gravada quando o descanso passa por <b>▶ Descanso</b> → <b>🏁 Próxima</b>.</div></div>";
    return c;}
  const seg=P.map(p=>p.seg);
  const med=Math.round(quantil(seg,.5)),p90=Math.round(quantil(seg,.9)),mx=Math.max.apply(null,seg);
  const acima3=Math.round(100*seg.filter(v=>v>180).length/seg.length);
  const comMeta=P.filter(p=>p.meta);
  const passou=comMeta.filter(p=>p.seg>p.meta).length;
  const depois=P.filter(p=>p.d>=ALARME_DESDE).length;
  c.innerHTML="<h3 style='margin:0 0 2px'>Distribuição de descanso</h3>"+
    "<div class='muted' style='font-size:12px;margin-bottom:8px'>"+seg.length+" pausas · mediana <b>"+med+"s</b> · p90 <b>"+p90+"s</b> · máx "+mx+"s · "+acima3+"% acima de 3 min</div>";
  const wrap=el("div");wrap.style.cssText="position:relative;height:280px";
  const cv=el("canvas");cv.id="cRest";wrap.appendChild(cv);c.appendChild(wrap);
  const notas=[];
  notas.push(depois
    ? depois+(depois===1?" pausa registrada":" pausas registradas")+" desde o alarme (v1.6.1, "+ddmm(ALARME_DESDE)+") — o p90 e o máximo dessa série são a prova de que ele funcionou"
    : "<b>Nenhuma pausa ainda desde o alarme</b> (v1.6.1, "+ddmm(ALARME_DESDE)+"): as "+seg.length+" são todas de treinos sem aviso sonoro. O antes-e-depois começa a existir no próximo treino.");
  if(comMeta.length)notas.push(passou+" das "+comMeta.length+" pausas com meta definida passaram da meta do próprio exercício ("+Math.round(100*passou/comMeta.length)+"%) — a meta varia por exercício (0 a 150 s), por isso não há uma linha só no gráfico");
  if(P.length<50)notas.push("amostra pequena: mediana e p90 se mexem muito abaixo de ~50 pausas");
  const n=el("div","muted");n.style.marginTop="6px";n.innerHTML=notas.join("<br>");c.appendChild(n);
  return c;
}

/* P1.8 — fronteira, não meta. Em 10 meses e 282 sessões não-força, nenhuma caminhada da
   janela do gráfico chegou a 145 de FC média; acima disso sobram Cycling real,
   StairClimbing e JumpRope. Zero deslocamento, sem nomear modalidade nenhuma — então não
   quebra quando ele trocar de aparelho. O número vive AQUI e é interpolado no título: o dia
   em que o critério deixar de servir, está escrito na tela onde ele olha. */
const FC_ESFORCO=145;
function hrMedia(w){const s=(w&&w.stats&&w.stats.HeartRate)||null;return s&&typeof s.avg==="number"?s.avg:null;}
/* Até onde o export foi. Um export de 12/09 desenha setembro como colapso se ninguém disser
   que o mês não acabou. Reaproveitável por qualquer gráfico mensal desta aba. */
function exportAte(H){let mx=null;
  Object.keys((H&&H.daily)||{}).forEach(k=>{const o=H.daily[k]||{};
    Object.keys(o).forEach(d=>{if(!mx||d>mx)mx=d;});});
  return mx;}
function mesIncompleto(mes,ate){                       // "2026-09" vs "2026-09-12"
  if(!ate||!mes||ate.slice(0,7)!==mes)return false;
  const p=mes.split("-"),ultimo=new Date(+p[0],+p[1],0).getDate();
  return +ate.slice(8,10)<ultimo;}
function buildCharts(sess,H){
  if(!window.Chart)return;
  const cs=getComputedStyle(document.body);
  Chart.defaults.color=(cs.getPropertyValue("--muted").trim())||"#8b97a6";
  Chart.defaults.borderColor=(cs.getPropertyValue("--border").trim())||"#26313d";
  Chart.defaults.font.family="-apple-system,sans-serif";
  // rótulos de mês por abreviação (jan/26, fev/26…)
  const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const mlabel=s=>{const p=String(s).split("-");return p.length<2?s:((MES[(+p[1])-1]||p[1])+"/"+p[0].slice(2));};
  if(Chart.defaults.scales&&Chart.defaults.scales.category){Chart.defaults.scales.category.ticks=Object.assign({},Chart.defaults.scales.category.ticks,{callback:function(v){return mlabel(this.getLabelForValue(v));}});}
  const GREEN="#22c55e",BLUE="#3b82f6",WARN="#f59e0b",RED="#ef4444";
  const G=goals();
  const noBandLegend={legend:{labels:{filter:it=>!(it.text||"").startsWith("_")}},tooltip:{filter:it=>!((it.dataset.label||"").startsWith("_"))}};
  const band=(ks,lo,hi,color,axis)=>[
    {label:"_hi",data:ks.map(()=>hi),yAxisID:axis,borderColor:color,borderDash:[5,4],borderWidth:1,pointRadius:0,fill:false},
    {label:"_lo",data:ks.map(()=>lo),yAxisID:axis,borderColor:color,borderDash:[5,4],borderWidth:1,pointRadius:0,fill:"-1",backgroundColor:color.replace(")",",.10)").replace("rgb","rgba")}
  ];
  const mk=(id,cfg)=>{const cv=document.getElementById(id);if(!cv)return;charts.push(new Chart(cv.getContext("2d"),cfg));};
  const line=(d,color,axis,fill)=>({label:d.label,data:d.data,borderColor:color,backgroundColor:fill||color,yAxisID:axis||"y",tension:.25,pointRadius:d.data.length>40?0:2,borderWidth:2,spanGaps:true});
  // treino mensal
  const vol={},cnt={};sess.forEach(s=>{const y=s.date.slice(0,7);vol[y]=(vol[y]||0)+s.vol;if(!s.avulso)cnt[y]=(cnt[y]||0)+1;});   // v1.17.0: a linha Sessões não conta avulso; o volume conta
  const tmonths=Object.keys(vol).sort();

  if(H){
    const bm=H.daily.BodyMass_kg||{},bf=bfPct(H.daily.BodyFatPercentage),lm=H.daily.LeanBodyMass_kg||{};
    const ks=[...new Set([...Object.keys(bm),...Object.keys(lm)])].sort().filter(k=>k>="2025-01-01");
    mk("cComp",{type:"line",data:{labels:ks,datasets:[
      ...band(ks,G.weight[0],G.weight[1],"rgb(34,197,94)","y"),
      ...band(ks,G.fat[0],G.fat[1],"rgb(245,158,11)","y1"),
      line({label:"Peso (kg)",data:ks.map(k=>bm[k]??null)},GREEN,"y"),
      line({label:"Massa magra (kg)",data:ks.map(k=>lm[k]??null)},BLUE,"y"),
      line({label:"Gordura (%)",data:ks.map(k=>bf[k]??null)},WARN,"y1"),
    ]},options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:noBandLegend,scales:{
      y:{position:"left",title:{display:true,text:"kg (meta "+G.weight[0]+"–"+G.weight[1]+")"}},y1:{position:"right",grid:{drawOnChartArea:false},title:{display:true,text:"% gordura (meta "+G.fat[0]+"–"+G.fat[1]+")"}},
      x:{ticks:{maxTicksLimit:12}}}}});

    const bfm=moAvg(bf);const months=[...new Set([...tmonths,...Object.keys(bfm)])].sort().filter(m=>m>="2025-11");
    mk("cTrFat",{data:{labels:months,datasets:[
      {type:"bar",label:"Volume (kg·rep)",data:months.map(m=>vol[m]||0),backgroundColor:"rgba(34,197,94,.5)",yAxisID:"y"},
      {type:"line",label:"Gordura (%)",data:months.map(m=>bfm[m]??null),borderColor:WARN,backgroundColor:WARN,yAxisID:"y1",tension:.25,borderWidth:2,spanGaps:true},
    ]},options:{maintainAspectRatio:false,scales:{y:{position:"left"},y1:{position:"right",grid:{drawOnChartArea:false},title:{display:true,text:"%"}}}}});

    mk("cRec",{type:"line",data:{labels:Object.keys(H.daily.RestingHeartRate_bpm||{}).sort().filter(k=>k>="2025-11-01"),datasets:[
      line({label:"FC repouso (bpm)",data:Object.keys(H.daily.RestingHeartRate_bpm||{}).sort().filter(k=>k>="2025-11-01").map(k=>H.daily.RestingHeartRate_bpm[k])},RED,"y"),
    ]},options:{maintainAspectRatio:false,scales:{x:{ticks:{maxTicksLimit:10}}}}});
    // HRV as second chart dataset overlaid: rebuild cRec with both aligned by union
    const rk=[...new Set([...Object.keys(H.daily.RestingHeartRate_bpm||{}),...Object.keys(H.daily.HRV_SDNN_ms||{})])].sort().filter(k=>k>="2025-11-01");
    charts.pop().destroy();
    mk("cRec",{type:"line",data:{labels:rk,datasets:[
      line({label:"FC repouso (bpm)",data:rk.map(k=>(H.daily.RestingHeartRate_bpm||{})[k]??null)},RED,"y"),
      line({label:"HRV SDNN (ms)",data:rk.map(k=>(H.daily.HRV_SDNN_ms||{})[k]??null)},BLUE,"y1"),
    ]},options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},scales:{y:{position:"left",title:{display:true,text:"bpm"}},y1:{position:"right",grid:{drawOnChartArea:false},title:{display:true,text:"ms"}},x:{ticks:{maxTicksLimit:10}}}}});

    const vk=Object.keys(H.daily.VO2Max||{}).sort().filter(k=>k>="2024-06-01");
    mk("cVO2",{type:"line",data:{labels:vk,datasets:[line({label:"VO2 Max",data:vk.map(k=>H.daily.VO2Max[k])},GREEN,"y")]},options:{maintainAspectRatio:false,scales:{x:{ticks:{maxTicksLimit:10}}}}});

    const sm=moAvg(H.sleep_hours_by_night||{});const smk=Object.keys(sm).sort().filter(m=>m>="2025-11");
    mk("cSleep",{type:"bar",data:{labels:smk,datasets:[{label:"h/noite",data:smk.map(m=>sm[m]),backgroundColor:"rgba(59,130,246,.55)"}]},options:{maintainAspectRatio:false,scales:{y:{title:{display:true,text:"h"}}}}});

    /* P1.8 — ESFORÇO, não "cardio". A lista de tipos saiu inteira. Tipo não separa nada:
       a bike de agosto também é deslocamento (30/08 a 5,9 km/h, FC 102), e um filtro por
       modalidade daria 382 min em agosto — acima da meta antiga — aprovando o mês em cima de
       duas pedaladas até o mercado. Duração separa menos ainda: a faixa de 30–60 min de
       agosto tem FC média 87. Sobra a FC, que é o que "esforço" quer dizer.
       O eixo vem dos meses OBSERVADOS (que têm alguma sessão), não dos meses com resultado:
       junho teve 712 min pelo critério antigo e 0 de esforço, e 0 tem que aparecer. */
    const cmin={},ccnt={},cobs={};let semFC=0;
    (H.workouts||[]).forEach(w=>{
      if(!w.date)return;
      const y=w.date.slice(0,7);
      cobs[y]=1;                                     // mês observado, mesmo que nada qualifique
      const fc=hrMedia(w);
      if(fc==null){if(y>="2025-11")semFC++;return;}   // sem FC não é zero: é contado e dito
      if(fc<FC_ESFORCO)return;
      cmin[y]=(cmin[y]||0)+(w.duration_min||0);ccnt[y]=(ccnt[y]||0)+1;});
    const cmk=Object.keys(cobs).sort().filter(m=>m>="2025-11");
    /* A meta de 216 min saiu e nada entra no lugar. Era goalMin=8*27 com um comentário que
       inventava a própria justificativa; zero ocorrências de 216 ou de qualquer meta de
       volume de cardio em todo o vault. E o Ciclo 3 a aposentou de propósito: "bike opcional
       (sem meta)". A régua vira a própria série — o mês anterior é a referência. Meta nova
       só quando o plano tiver uma, e aí ela nasce no 🚩 Academia, não aqui. */
    const ate=exportAte(H), parcial=cmk.length?mesIncompleto(cmk[cmk.length-1],ate):false;
    mk("cCardio",{data:{labels:cmk,datasets:[
      {type:"bar",label:"Esforço (min)",data:cmk.map(m=>Math.round(cmin[m]||0)),yAxisID:"y",
       backgroundColor:cmk.map((m,i)=>(parcial&&i===cmk.length-1)?"rgba(34,197,94,.22)":"rgba(34,197,94,.5)"),
       borderColor:cmk.map((m,i)=>(parcial&&i===cmk.length-1)?GREEN:"transparent"),
       borderWidth:cmk.map((m,i)=>(parcial&&i===cmk.length-1)?1:0),borderDash:[4,3]},
      {type:"line",label:"Sessões",data:cmk.map(m=>ccnt[m]||0),borderColor:BLUE,backgroundColor:BLUE,yAxisID:"y1",tension:.25,borderWidth:2},
    ]},options:{maintainAspectRatio:false,scales:{y:{position:"left",min:0,title:{display:true,text:"min"}},y1:{position:"right",grid:{drawOnChartArea:false},min:0,title:{display:true,text:"nº"}}}}});
    /* Os dois estados que um gráfico mensal esconde por padrão: o mês que ainda não acabou
       (senão o export do dia 12 desenha um colapso) e a sessão sem FC (senão ausência de
       medida vira ausência de esforço). Nenhum dos dois muda barra nenhuma — ambos falam. */
    const cnote=[];
    if(parcial)cnote.push("<b>"+mlabel(cmk[cmk.length-1])+" em curso</b> — export até "+esc(ate.slice(8,10)+"/"+ate.slice(5,7))+", a última barra ainda vai subir");
    if(semFC)cnote.push(semFC+(semFC===1?" sessão sem":" sessões sem")+" FC registrada ficou de fora — sem medida não dá pra dizer que houve esforço, nem que não houve");
    if(cnote.length){const cv=document.getElementById("cCardio");
      if(cv&&cv.parentElement&&cv.parentElement.parentElement){
        const n=el("div","muted");n.style.marginTop="6px";n.innerHTML=cnote.join("<br>");
        cv.parentElement.parentElement.appendChild(n);}}

    // passos (méd/dia por mês)
    if(H.daily.Steps){const stm=moAvg(H.daily.Steps);const stk=Object.keys(stm).sort().filter(m=>m>="2025-11");
      mk("cSteps",{data:{labels:stk,datasets:[
        {type:"bar",label:"passos/dia",data:stk.map(m=>Math.round(stm[m])),backgroundColor:"rgba(34,197,94,.5)"},
        {type:"line",label:"referência 8k",data:stk.map(()=>8000),borderColor:WARN,borderDash:[5,4],borderWidth:1.5,pointRadius:0},
      ]},options:{maintainAspectRatio:false,scales:{y:{title:{display:true,text:"passos"}}}}});}
    // minutos de exercício (méd/dia por mês)
    if(H.daily.ExerciseMinutes){const exm=moAvg(H.daily.ExerciseMinutes);const exk=Object.keys(exm).sort().filter(m=>m>="2025-11");
      mk("cExerc",{type:"bar",data:{labels:exk,datasets:[{label:"min/dia",data:exk.map(m=>Math.round(exm[m])),backgroundColor:"rgba(59,130,246,.55)"}]},options:{maintainAspectRatio:false,scales:{y:{title:{display:true,text:"min"}}}}});}
  }

  /* P6.4 — dia da semana em hora LOCAL: new Date("2026-08-31") seria UTC e jogaria treino de
     segunda-feira pro domingo. Mesmo parse manual do daysSince. */
  {const dc=[0,0,0,0,0,0,0];
   sess.forEach(s=>{if(s.avulso)return;const p=String(s.date).split("-");   // v1.17.0: sem avulso
     const wd=new Date(+p[0],+p[1]-1,+p[2]).getDay();     // 0=dom
     dc[(wd+6)%7]++;});                                    // 0=seg
   mk("cDow",{type:"bar",data:{labels:["seg","ter","qua","qui","sex","sáb","dom"],
     datasets:[{label:"sessões",data:dc,backgroundColor:"rgba(34,197,94,.5)"}]},
     options:{maintainAspectRatio:false,plugins:{legend:{display:false}},
       scales:{y:{min:0,ticks:{precision:0},title:{display:true,text:"nº de sessões"}}}}});}

  /* P6.3 — duas populações no mesmo eixo: antes e desde o alarme. A faixa da mediana e a do
     p90 ganham borda, que é o "marcado" possível sem plugin de anotação no Chart.js. */
  {const P=pausasRegistradas();
   if(P.length){
     const antes=new Array(REST_BINS+1).fill(0),dep=new Array(REST_BINS+1).fill(0);
     P.forEach(p=>{(p.d>=ALARME_DESDE?dep:antes)[restBin(p.seg)]++;});
     const segs=P.map(p=>p.seg);
     const bMed=restBin(quantil(segs,.5)),bP90=restBin(quantil(segs,.9));
     const borda=i=>i===bMed?BLUE:(i===bP90?WARN:"transparent");
     const temDep=dep.some(v=>v>0);
     const ds=[{label:"antes do alarme",data:antes,backgroundColor:"rgba(34,197,94,.45)",
                borderColor:antes.map((_,i)=>borda(i)),borderWidth:antes.map((_,i)=>borda(i)==="transparent"?0:2)}];
     if(temDep)ds.push({label:"desde o alarme",data:dep,backgroundColor:"rgba(59,130,246,.75)"});
     mk("cRest",{type:"bar",data:{labels:restLabels(),datasets:ds},
       options:{maintainAspectRatio:false,
         plugins:{tooltip:{callbacks:{title:it=>it[0].label+" s"}}},
         scales:{x:{stacked:true,title:{display:true,text:"segundos de pausa · borda azul = mediana, âmbar = p90"}},
                 y:{stacked:true,min:0,ticks:{precision:0},title:{display:true,text:"nº de pausas"}}}}});}}

  mk("cVolFreq",{data:{labels:tmonths,datasets:[
    {type:"bar",label:"Volume (kg·rep)",data:tmonths.map(m=>vol[m]),backgroundColor:"rgba(34,197,94,.5)",yAxisID:"y"},
    {type:"line",label:"Sessões",data:tmonths.map(m=>cnt[m]||0),borderColor:BLUE,backgroundColor:BLUE,yAxisID:"y1",tension:.25,borderWidth:2},
  ]},options:{maintainAspectRatio:false,scales:{y:{position:"left"},y1:{position:"right",grid:{drawOnChartArea:false},min:0}}}});

  /* P6.7 — quatro séries categóricas precisam de quatro matizes distinguíveis; a paleta do
     arquivo tem três e o RED, que aqui leria como alarme numa letra que ele treinou menos. O
     violeta entra só como cor de série. */
  {const meses=[...new Set(sess.map(s=>s.date.slice(0,7)))].sort();
   const conta={};sess.forEach(s=>{const k=s.day+"|"+s.date.slice(0,7);(conta[k]=conta[k]||[]).push(s.vol);});
   /* v1.20.0 — letras derivadas; cor pela posição, e A–D mantêm as de antes. A 5ª (o F do C5)
      é rosa, ainda longe do RED de alarme; acima de 6 letras a paleta repete. */
   const LETRAS=letrasRotacao(),PAL=[GREEN,BLUE,WARN,"#a78bfa","#f472b6","#2dd4bf"];
   const COR={};LETRAS.forEach((L,i)=>COR[L]=PAL[i%PAL.length]);
   const ds=LETRAS.map(L=>({label:"Treino "+L,
     data:meses.map(m=>{const a=conta[L+"|"+m];return a?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;}),
     borderColor:COR[L],backgroundColor:COR[L],tension:.25,borderWidth:2,pointRadius:3,spanGaps:false}));
   mk("cVolLetra",{type:"line",data:{labels:meses,datasets:ds},
     options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
       scales:{y:{min:0,title:{display:true,text:"kg·rep por sessão"}},x:{ticks:{maxTicksLimit:12}}}}});}

  /* P6.1 — o deslocamento vai no EIXO, não só na legenda: um leitor que pegue o gráfico no meio
     precisa ver que as duas séries não são do mesmo dia. */
  if(H&&H.daily&&H.daily.BodyMass_kg){
    const P=paresDefasagem(H.daily.BodyMass_kg);
    mk("cLag",{data:{labels:P.labels,datasets:[
      {type:"bar",label:"treinos na semana",data:P.treinos,backgroundColor:"rgba(34,197,94,.45)",yAxisID:"y"},
      {type:"line",label:"peso médio (kg) — "+PESO_LAG_DIAS+" dias depois",data:P.peso,borderColor:WARN,backgroundColor:WARN,yAxisID:"y1",tension:.25,borderWidth:2,pointRadius:2,spanGaps:true},
    ]},options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      scales:{y:{position:"left",min:0,ticks:{precision:0},title:{display:true,text:"treinos na semana"}},
              y1:{position:"right",grid:{drawOnChartArea:false},title:{display:true,text:"peso médio (kg) · "+PESO_LAG_DIAS+"d depois"}},
              x:{ticks:{maxTicksLimit:12},title:{display:true,text:"semana do treino — o peso plotado é o de "+PESO_LAG_DIAS+" dias depois"}}}}});}

  // progressão + marcador de PR (quando bateu o recorde)
  const pts=[];sess.forEach(s=>{const e=s.exercises.find(x=>x.name===analProgEx);if(e&&e.top){const e1=Math.max(...e.sets.map(st=>st.w*(1+st.r/30)));pts.push({d:s.date,top:e.top,e1:Math.round(e1)});}});
  const prI=pts.length?pts.reduce((bi,p,i,arr)=>p.top>arr[bi].top?i:bi,0):-1;
  const ds=[line({label:"Carga máx (kg)",data:pts.map(p=>p.top)},GREEN,"y"),
            line({label:"1RM est. (kg)",data:pts.map(p=>p.e1)},"rgba(139,151,166,.7)","y")];
  if(prI>=0)ds.push({type:"scatter",label:"⭐ PR "+pts[prI].top+"kg ("+fmtD(pts[prI].d)+")",data:pts.map((p,i)=>i===prI?p.top:null),pointStyle:"star",pointRadius:11,pointHoverRadius:13,borderColor:WARN,backgroundColor:WARN,yAxisID:"y",showLine:false});
  mk("cProg",{type:"line",data:{labels:pts.map(p=>p.d),datasets:ds},options:{maintainAspectRatio:false,scales:{x:{ticks:{maxTicksLimit:10}}}}});
}

/* ---------- EXPORT CANÔNICO (schema gymlog/v1) ---------- */
function isoTs(ts){return ts?new Date(ts).toISOString():null;}
function numOrNull(v){if(v==null||v==="")return null;const n=Number(v);return isNaN(n)?null:n;}
function analysisExport(){
  return {
    schema:"gymlog/v1",
    exportedAt:new Date().toISOString(),
    athlete:"Will",
    cfg:{ciclo:cfg.ciclo,plano:cfg.plano},
    sessions:sessions.map(s=>({
      day:s.day,
      dayName:(templates[s.day]&&templates[s.day].name)||null,
      ...(s.avulso===true?{avulso:true}:{}),   // v1.17.0: só quando há; nunca grava false
      date:s.date,
      startedAt:isoTs(s.started),
      finishedAt:isoTs(s.finished),
      durationMin:durMin(s),
      exercises:s.exercises.map(e=>({
        name:e.n,
        mvw:!!e.mvw,
        target:e.sr||null,
        ...(gostoValido(e.gosto)?{gosto:e.gosto}:{}),   // v1.19.0: só quando há; ausente = sem nota
        sets:e.sets.map((st,i)=>({
          index:i+1,
          weightKg:numOrNull(st.w),
          reps:numOrNull(st.r),
          rir:numOrNull(st.rir),
          restSec:st.rest!=null?st.rest:null,
          completedAt:isoTs(st.t)
        })),
        volumeKgRep:Math.round(setVol(e.sets)),
        topWeightKg:topWeight(e.sets)
      })),
      totals:{
        volumeKgRep:Math.round(sessVol(s)),
        restTotalSec:s.exercises.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+(x.rest||0),0),0),
        sets:s.exercises.reduce((a,e)=>a+e.sets.length,0)
      }
    }))
  };
}

/* Antes: substituía templates/sessions/cfg sem conferir nada. Um arquivo errado
   apagava o histórico em silêncio. Agora valida, mostra o que vai mudar e confirma. */
function inspectBackup(d){
  const erros=[],resumo={};
  if(!d||typeof d!=="object")return{erros:["arquivo não é um objeto JSON"],resumo:resumo};
  if(!d.sessions&&!d.templates)erros.push("não tem 'sessions' nem 'templates' — não parece um backup do Treino");
  if(d.sessions!=null){
    if(!Array.isArray(d.sessions))erros.push("'sessions' não é uma lista");
    else{
      let sets=0,ruins=0;
      d.sessions.forEach(x=>{
        const v=validateSession(x);
        if(v.erros.length)ruins++;
        sets+=v.stats.sets||0;
      });
      const ds=d.sessions.map(x=>x&&x.date).filter(Boolean).sort();
      resumo.sessions=d.sessions.length;resumo.sets=sets;resumo.ruins=ruins;
      resumo.de=ds[0];resumo.ate=ds[ds.length-1];
      if(!d.sessions.length)erros.push("a lista de treinos está vazia");
    }
  }
  if(d.templates!=null){
    if(typeof d.templates!=="object"||Array.isArray(d.templates))erros.push("'templates' não é um objeto");
    else{
      const ks=Object.keys(d.templates);
      const ruins=ks.filter(k=>!d.templates[k]||!Array.isArray(d.templates[k].ex));
      if(ruins.length)erros.push("templates sem lista 'ex': "+ruins.join(", "));
      resumo.templates=ks.length;
      resumo.exercicios=ks.reduce((a,k)=>a+((d.templates[k]&&d.templates[k].ex)||[]).length,0);
    }
  }
  return{erros:erros,resumo:resumo};
}
function doImport(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      let d;
      try{ d=JSON.parse(rd.result); }
      catch(e){ logIO("import-parse-fail",f.name,e.message,String(rd.result||"").length);
        toast("Arquivo inválido — não é JSON"); return; }
      const chk=inspectBackup(d);
      if(chk.erros.length){
        logIO("import-invalid",f.name,chk.erros.join(" | "));
        alert("Não importei — o arquivo tem problemas:\n\n• "+chk.erros.join("\n• "));
        return;
      }
      const r=chk.resumo;
      const linhas=["Arquivo: "+f.name,""];
      if(r.sessions!=null){
        linhas.push("Treinos no arquivo: "+r.sessions+" ("+r.sets+" séries)");
        linhas.push("Período: "+(r.de||"?")+" → "+(r.ate||"?"));
        linhas.push("Você tem agora: "+sessions.length+" treinos");
        const dif=r.sessions-sessions.length;
        if(dif<0)linhas.push("⚠ ATENÇÃO: vai FICAR COM "+Math.abs(dif)+" TREINO(S) A MENOS");
        if(r.ruins)linhas.push("⚠ "+r.ruins+" treino(s) do arquivo estão incompletos");
      }
      if(r.templates!=null)linhas.push("Templates: "+r.templates+" ("+r.exercicios+" exercícios)");
      /* v1.17.0 — o import substitui `templates`; o que faltar de avulso volta do padrão. Dito
         aqui porque é gravado junto, não acrescentado calado. */
      const faltaAv=d.templates?Object.keys(DEFAULT_TEMPLATES).filter(k=>DEFAULT_TEMPLATES[k].avulso&&!d.templates[k]):[];
      if(faltaAv.length)linhas.push("Treino "+faltaAv.join(", ")+" avulso não está no arquivo — entra o padrão do app");
      linhas.push("","Substituir os dados deste aparelho?");
      if(!confirm(linhas.join("\n")))return;

      if(d.templates)templates=d.templates;
      garantirAvulso();                              // v1.17.0: E do arquivo vence; se faltar, o save abaixo grava o padrão
      if(d.sessions)sessions=d.sessions;
      if(d.cfg)cfg=d.cfg;
      /* v1.14.1 — o import atribui por cima DEPOIS do boot, então o apara da leitura não
         o alcançaria: um backup do vault com 'Kick extension ' remontaria o nome partido
         até o próximo reload. Aqui o save() seguinte é explícito e confirmado na tela,
         então gravar aparado não é reescrita silenciosa. */
      aparaNomes(Object.values(templates),"ex");
      aparaNomes(sessions,"exercises");
      if(d.cfg&&typeof cfg.histEx==="string")cfg.histEx=trimNome(cfg.histEx);
      const ok=[["templates",save(K.tpl,templates)],["sessions",save(K.sess,sessions)],["cfg",save(K.cfg,cfg)]]
        .filter(x=>!x[1]).map(x=>x[0]);
      if(ok.length){
        logIO("import-write-fail",f.name,"falhou ao gravar: "+ok.join(", "));
        alert("Importado só em parte — falhou ao gravar: "+ok.join(", ")+
              "\nVeja Ajustes → Diagnóstico de dados.");
      }else{
        logIO("ok","import",f.name+" · "+(r.sessions||0)+" treinos · "+(r.sets||0)+" séries");
        toast("Importado ✓ "+(r.sessions||0)+" treinos");
      }
      render();
    };
    rd.onerror=()=>{logIO("import-read-fail",f.name,"FileReader falhou");toast("Não consegui ler o arquivo");};
    rd.readAsText(f);
  };
  inp.click();
}

function voltouAoPrimeiroPlano(){
  if(document.visibilityState!=="visible"||tab!=="home")return;

}
