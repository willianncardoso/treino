<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href='data:application/manifest+json,{"name":"Treino","short_name":"Treino","start_url":".","display":"standalone","background_color":"%230b0f14","theme_color":"%230b0f14","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2322c55e%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22sans-serif%22%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
<title>Treino</title>
<style>
:root{
  --bg:#0b0f14; --surface:#141b24; --surface2:#1c2530; --border:#26313d;
  --text:#e6edf3; --muted:#8b97a6; --accent:#22c55e; --accent2:#3b82f6;
  --danger:#ef4444; --warn:#f59e0b; --radius:14px; --sp:8px;
  /* P5.3 — as mesmas cores servem a dois papéis com regras diferentes: como FUNDO
     (.btn-primary, a barra de descanso) não têm requisito de contraste contra a superfície;
     como TEXTO precisam de 4,5:1 sobre ela. No escuro os dois valores coincidem, e é por
     isso que o bug ficou dez meses invisível. No claro, não coincidem. */
  --accent-tx:#22c55e; --warn-tx:#f59e0b; --danger-tx:#ef4444; --dn-tx:#fca5a5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;padding-bottom:76px;
  padding-top:env(safe-area-inset-top);
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{margin:0 0 10px;font-weight:650}
h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 0}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;border-radius:10px;padding:12px 16px;color:#fff;background:var(--surface2);transition:opacity .15s}
button:active{opacity:.6}
button:disabled{opacity:.42;cursor:default}
button:disabled:active{opacity:.42}
.btn-primary{background:var(--accent);color:#0b0f14;font-weight:600}   /* P5.5: #fff dava 2,28:1; escuro dá 8,43:1 */
.btn-blue{background:var(--accent2);color:#0b0f14;font-weight:600}     /* P5.5: #fff dava 3,68:1; escuro dá 5,23:1 */
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--danger-tx);color:var(--danger-tx)}
/* P5.9 — 8px+13px dava ~34px de altura, contra os 44 do mínimo da Apple. Atinge ✓/▴, 🔍,
   + Série, ▶ Descanso, o MD da Home e os dois botões da barra de descanso. A fonte fica
   em 13px: quem cresce é o alvo, não o texto. */
.btn-sm{padding:8px 12px;font-size:13px;min-height:44px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:10px;font-size:16px;text-align:center}
input:focus,select:focus{outline:2px solid var(--accent2);border-color:transparent}
button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}   /* P5.8 */
label.fld{display:block;font-size:11px;color:var(--muted);text-align:center;margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(11,15,20,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50}
.tabbar button{flex:1;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.tabbar button.active{color:var(--accent-tx)}
.tabbar .ic{font-size:20px}
.daygrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.daycard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:left;color:var(--text)}
.daycard .big{font-size:32px;font-weight:750;color:var(--accent-tx)}
.ex{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ex-title{font-weight:650;font-size:15px}
.exdone{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:13px 15px;margin-bottom:12px;cursor:pointer;transition:opacity .2s}
.exdone:active{opacity:.6}
.exdone .ck{color:var(--accent-tx);font-weight:800;font-size:16px}
/* P5.10 — 'Agachamento Búlgaro - Smith' + '3× 30kg×10' não cabem em 375px. Quem trunca é
   o NOME, que é rótulo; o resumo das séries é o dado e nunca é cortado. */
.exdone .nm{font-weight:650;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exdone .sm{color:var(--muted);font-size:13px;margin-left:auto;text-align:right;flex:0 0 auto;white-space:nowrap}
.lastbox{background:var(--surface2);border-left:3px solid var(--accent);border-radius:8px;padding:9px 11px;margin-bottom:9px}
.lastbox .hl{color:var(--text);font-weight:600;font-size:16px;margin-top:2px;line-height:1.35}
.lastbox .lbl{font-size:10px;letter-spacing:.5px;color:var(--muted)}
.trend{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
.trend.up{background:rgba(34,197,94,.16);color:var(--accent-tx)}
.trend.dn{background:rgba(239,68,68,.16);color:var(--dn-tx)}
.trend.eq{background:var(--surface);color:var(--muted)}
.histrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
.histrow .hd{color:var(--muted);white-space:nowrap}
.histrow .hs{text-align:right}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle}
.tag.mvw{background:rgba(245,158,11,.15);color:var(--warn-tx)}
/* P5.13 — eram TRÊS campos iguais e um terço da área nunca foi usado: 1 série de 1.465
   (0,07%) tem RIR, contra 100% de repetições. Com a coluna fora, kg e reps ganham ~50% de
   largura cada na linha que ele preenche ~18 vezes por treino, em pé, com uma mão.
   A chave `rir` continua no formato salvo — ver o README da v1.9.0.
   P5.2/P5.9 de carona: o `×` era um alvo de ~30×34 px na mesma linha. Vai a 44×44, que é o
   mínimo da Apple, sem custar largura de campo — a coluna cresce 10 px e os campos ganham
   os 34 px do RIR de volta. */
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.setrow .idx{color:var(--muted);text-align:center;font-size:13px}
.setrow .del{background:none;color:var(--muted);padding:4px;font-size:16px;min-height:44px;width:100%}
.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--surface2);font-size:12px;color:var(--muted);margin:2px 4px 2px 0}
.sessionbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:45;display:none;padding:0 12px;pointer-events:none}
.sessionbar.on{display:block}
/* P5.4 — o teclado numérico do iOS não tem tecla de retorno, e .sessionbar/.tabbar são
   fixed no LAYOUT viewport: o teclado passa por cima das duas e leva junto o cronômetro,
   o 🏁 Próxima e o Parar — no momento mais frequente do app. --kb é a altura coberta,
   medida pelo visualViewport. Com o teclado aberto a barra se ancora nele e não na
   tabbar, que está debaixo do teclado: empilhar em cima do que sumiu não adianta. */
body.kb .sessionbar{bottom:calc(var(--kb,0px) + 8px)}
.sb-inner{max-width:640px;margin:0 auto;position:relative;min-height:60px;border-radius:14px;overflow:hidden;pointer-events:auto;background:var(--surface2);border:1px solid var(--border);box-shadow:0 6px 22px rgba(0,0,0,.45);transition:background-color .3s ease,border-color .3s ease}
/* .sb-idle e .sb-rest são absolute: não empurram a altura do pai. Com os botões em 44px
   (P5.9) o conteúdo do descanso passa de 60px e o overflow:hidden cortaria o 🏁 Próxima.
   Só o estado de descanso cresce — em repouso a barra continua com 60px. */
.sessionbar.resting .sb-inner{background:var(--accent2);border-color:transparent;min-height:82px}
.sb-idle,.sb-rest{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;transition:opacity .25s ease}
.sb-rest{opacity:0;pointer-events:none}
.sessionbar.resting .sb-idle{opacity:0;pointer-events:none}
.sessionbar.resting .sb-rest{opacity:1;pointer-events:auto}
.sb-t{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.05}
.sb-lbl{font-size:10px;letter-spacing:.5px;color:var(--muted)}
.sb-rest .sb-lbl{color:rgba(255,255,255,.8)}
.sessionbar.resting.over .sb-inner{background:var(--danger);animation:pulseOver 1s ease-in-out infinite}
@keyframes pulseOver{0%,100%{box-shadow:0 6px 22px rgba(239,68,68,.5)}50%{box-shadow:0 6px 30px rgba(239,68,68,.85)}}
/* P5.12 — o pulso é a única animação contínua do app. Com movimento reduzido ele PARA,
   mas não some: o fundo vermelho e a sombra forte ficam. Enquanto o alarme depender de
   som (que o botão de silencioso cala), este é o aviso visual de que a pausa estourou. */
@media (prefers-reduced-motion: reduce){
  .sessionbar.resting.over .sb-inner{animation:none;box-shadow:0 6px 30px rgba(239,68,68,.85)}
}
.ex.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 4px 16px rgba(34,197,94,.12)}
.sess{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.sess:last-child{border-bottom:none}
.dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface2)}
canvas{width:100%;height:auto;display:block}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .ic{font-size:40px;opacity:.5}
textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:10px;font-size:13px;font-family:ui-monospace,monospace;min-height:200px;text-align:left}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;background:none;color:var(--muted);padding:8px;font-size:13px}
.seg button.active{background:var(--accent);color:#0b0f14;font-weight:600}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
a{color:var(--accent2)}
/* tema claro */
body.light{--bg:#f4f6f9;--surface:#ffffff;--surface2:#eef2f7;--border:#d5dde6;--text:#17202a;--muted:#5c6b7a;
  /* medidos sobre #ffffff / #eef2f7 e sobre os fundos tingidos de .trend e .tag.mvw:
     accent 7,13 / 6,34 / 6,23 · warn 7,09 / 6,31 / 6,31 · danger 6,47 / 5,76 / 5,24 */
  --accent-tx:#166534;--warn-tx:#92400e;--danger-tx:#b91c1c;--dn-tx:#b91c1c}
body.light .tabbar{background:rgba(255,255,255,.92)}
/* modo largo (aba análise no desktop) */
body.wide .wrap{max-width:1180px}
.dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.dashgrid .full{grid-column:1 / -1}
/* v1.14.0 — Histórico em painel no desktop. NÃO reusa .dashgrid de propósito: o auto-fit
   minmax(360px,1fr) daria três colunas iguais de ~360px em 1180px, com o gráfico do tamanho
   da lista e um buraco na terceira. Aqui a proporção é decisão, não resultado do auto-fit.
   Fora de body.wide a classe não faz nada e o fluxo é o de sempre (celular intacto). */
body.wide .histgrid{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;align-items:start}
body.wide .histgrid .full{grid-column:1 / -1}
body.wide .histgrid .card{margin-bottom:0}
/* Com 25 sessões a coluna da direita passa de 1500px contra ~340px do gráfico: sem sticky
   o gráfico some da tela no primeiro rolar. */
body.wide .histchart{position:sticky;top:18px}
/* v1.15.0 — Home (P7.1). O herói é um .card, os tiles são .daycard, a semana é um .card:
   o vocabulário é o de sempre. O que nasce aqui é só o que não existia — selo, letra grande,
   barra de progresso e os sete círculos da semana. Nada anima: nenhuma transição nova. */
.hm-selo{display:inline-block;font-size:11px;font-weight:750;letter-spacing:.5px;padding:3px 8px;border-radius:6px;background:var(--accent);color:#0b0f14}
.hm-selo.anda{background:var(--accent2)}
.hm-letra{font-size:48px;font-weight:800;line-height:1;color:var(--accent-tx);min-width:40px}
.hm-ex{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:15px}
.hm-ex .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-ex .muted{flex:0 0 auto;white-space:nowrap}
.hm-cta{width:100%;min-height:52px;font-size:16px;margin-top:12px}
.hm-tiles{grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.hm-tile{padding:12px;min-height:44px}
.hm-tile .big{font-size:28px;line-height:1.1}
.hm-barra{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:12px 0 6px}
.hm-barra i{display:block;height:100%;background:var(--accent)}
.hm-semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:12px 0 10px}
.hm-semana .lb{font-size:11px;color:var(--muted);margin-bottom:5px}
.hm-dia{width:36px;height:36px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--surface2);font-weight:700;font-size:13px;color:var(--muted)}
.hm-dia.cheio{background:var(--accent);color:#0b0f14}
.hm-dia.hoje{box-shadow:0 0 0 2px var(--accent2)}
.hm-dia.hoje:not(.cheio){color:var(--text)}
.hm-dia.anda{background:transparent;border:2px solid var(--accent2);box-shadow:none;color:var(--text)}
.hm-dia.duas{font-size:11px;letter-spacing:-.3px}
/* v1.17.0 — Treino E avulso (P9). Tracejado em --muted = "registrado, mas fora da conta":
   não é o cheio (fundo --accent), nem o anda (contorno sólido --accent2), nem o vazio.
   --muted sobre --surface dá 5,9:1 no escuro e 5,4:1 no claro (≥ 3:1 de não-texto). */
.hm-dia.avulso{background:transparent;border:2px dashed var(--muted);color:var(--text)}
.hm-tile.avulso{grid-column:1/-1;display:flex;align-items:center;gap:12px;border-style:dashed}
.hm-tile.avulso .big{color:var(--muted);flex:0 0 auto}
.hm-tile.avulso.meia{grid-column:span 2;align-self:start}   /* v1.20.0 — E ao lado da letra que sobrou */
.hm-tile.avulso .chev,.opc-row .chev{margin-left:auto;color:var(--muted);font-size:20px;flex:0 0 auto}
.opc-card{border-style:dashed}
.opc-row{cursor:pointer;min-height:44px;gap:10px}
.opc-row:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:6px}
.tg-on{border-color:var(--accent-tx);color:var(--accent-tx);background:rgba(34,197,94,.12)}
/* v1.18.0 — Treino em andamento (P8.2). Cabeçalho fixo dentro do .wrap (fundo opaco, senão a
   lista passa visível por trás), um exercício em foco, os outros em linha. Nada anima. */
.tr-head{position:sticky;top:0;z-index:40;background:var(--bg);margin:-18px -16px 12px;padding:12px 16px 10px;border-bottom:1px solid var(--border)}
.tr-head .tt{min-width:0;flex:1}
.tr-head h1{margin:0;font-size:19px}
.tr-head .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-clock{text-align:right;flex:0 0 auto}
.tr-clock .sb-t{font-size:20px}
.tr-ic{width:44px;height:44px;padding:0;flex:0 0 auto;font-size:17px}
.tr-ic[aria-expanded="true"]{border-color:var(--accent2)}
.tr-seg{display:flex;gap:4px;margin:10px 0 8px}
.tr-seg i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.tr-seg i.ok{background:var(--accent)}
.tr-seg i.foco{box-shadow:inset 0 0 0 1px var(--accent)}
.ex-pend{border-left:1px solid var(--border);min-height:56px}
.ex-pend .u{min-width:0;flex:1}
.ex-pend .u .nm{display:block}
.ex-pend .chev{color:var(--muted);font-size:20px;flex:0 0 auto}
.ex .chips{margin-top:5px}
.ex .chips .tag{margin:0 6px 0 0;font-size:11px;padding:2px 8px}
.lastbox .lh{display:flex;align-items:center;gap:8px}
.lastbox .lh .hl{flex:1;min-width:0}
.setrow.cab{margin-bottom:4px}
.setrow.cab .fld{margin:0}
.setrow .idx b{display:block;color:var(--accent-tx);font-size:13px;line-height:1}
.setrow input{scroll-margin-top:150px}
.tr-main{width:100%;min-height:52px;font-size:16px;margin-top:4px}
.tr-sec{margin-top:6px;gap:4px;flex-wrap:wrap}
.tr-sec button{background:none;padding:8px 10px;color:var(--muted)}
.tr-sec button.az,button.az{color:var(--accent2)}
.tr-main:disabled,.tr-main:disabled:active{background:transparent;border:1px solid var(--border);color:var(--muted);opacity:1;font-weight:500}
.sb-rest .sb-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-rest>div:first-child{min-width:0;flex:1}
/* #3b82f6 como TEXTO sobre branco dá 3,7:1; no claro o link azul escurece (6,7:1). */
body.light .tr-sec button.az,body.light button.az{color:#1d4ed8}
/* v1.19.0 — nota de gosto (P10.1). Medidas do Figma (página "Nota de gosto e C5", 48:52):
   botões de 56 px, raio 12, vão 8, fundo surface2. Selecionado: borda 2 px + fundo verde a 12 % +
   palavra em negrito — nunca só cor. A borda usa --accent-tx: #22c55e sobre branco dá 2,3:1, abaixo
   dos 3:1 de borda; no escuro os dois valores são o mesmo. O padding cai 1 px no selecionado para
   a borda de 2 px não mexer na altura. */
.gosto{margin-top:12px}
.gosto .gq{font-size:13px;font-weight:600;margin-bottom:8px}
.gosto .gb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gosto .gb button{min-height:56px;padding:8px 4px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--text);line-height:1.2}
.gosto .gb .gf{font-size:20px;line-height:1}
:root{--gsel:#16301f}body.light{--gsel:#e4f7eb}   /* verde a 12 %: o valor do Figma sobre o card escuro; no claro, a mesma mistura sobre o branco */
.gosto .gb button[aria-pressed="true"]{border:2px solid var(--accent-tx);padding:7px 3px;background:var(--gsel);color:var(--accent-tx);font-weight:700}
.gosto .gh{font-size:11.5px;margin-top:8px}
.exdone .gf{font-size:16px;flex:0 0 auto}
.salvo-ex .cab{display:flex;align-items:baseline;gap:8px}
.salvo-ex .cab .nm{font-weight:600;flex:1;min-width:0}
.salvo-ex .cab .nt{font-size:12.5px;font-weight:600;white-space:nowrap;flex:0 0 auto}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="sessionbar" id="sessionbar">
  <div class="sb-inner">

<script>
"use strict";
/* ============ STORE ============ */
const K = {tpl:"gymlog_templates_v3", sess:"gymlog_sessions_v1", active:"gymlog_active_v1",
           cfg:"gymlog_cfg_v1", iolog:"gymlog_iolog_v1"};
const IOLOG_MAX=60;

/* Registro de gravações/leituras. Grava direto no localStorage — nunca chama
   save(), para não recursar quando o próprio save() falhar. */
function logIO(kind,key,msg,bytes){
  const rec={t:Date.now(),kind:kind,key:key,msg:String(msg==null?"":msg).slice(0,220)};
  if(bytes!=null)rec.bytes=bytes;
  try{
    const raw=localStorage.getItem(K.iolog);
    const arr=raw?JSON.parse(raw):[];
    arr.push(rec);
    localStorage.setItem(K.iolog,JSON.stringify(arr.slice(-IOLOG_MAX)));
  }catch(e){}
  return rec;
}
/* Nem tudo que não é "ok" é falha: export bem-sucedido é "backup" e cancelamento é
   "backup-cancel" — cancelar não é erro e não pode ser contado nem pintado como um. */
const IO_NAO_FALHA={ok:1,backup:1,"backup-cancel":1,discard:1};   // v1.18.0: descartar é escolha dele, não falha
function ioFail(r){return !IO_NAO_FALHA[r&&r.kind];}
function ioLogRead(){try{const r=localStorage.getItem(K.iolog);return r?JSON.parse(r):[];}catch(e){return [];}}

/* Chave -> motivo, quando a leitura falhou e a tela recebeu o default no lugar do dado.
   O iolog já registrava; isto é o que permite a TELA dizer que não veio, em vez de
   desenhar um zero em cima de uma leitura que falhou. Vazio de verdade não entra aqui. */
const loadFail={};
function readFailed(k){return loadFail[k]||null;}

/* Antes: qualquer erro devolvia o default silenciosamente — um JSON corrompido
   virava [] e o save seguinte apagava o histórico. Agora preserva o bruto e registra. */
const load=(k,d)=>{
  let raw;
  try{ raw=localStorage.getItem(k); }
  catch(e){ logIO("read-fail",k,e.message); loadFail[k]="o navegador recusou a leitura"; return d; }
  if(raw==null||raw===""){ delete loadFail[k]; return d; }
  try{ const v=JSON.parse(raw); delete loadFail[k]; return v; }
  catch(e){
    try{ localStorage.setItem(k+"__corrompido_"+Date.now(),raw); }catch(_){}
    logIO("parse-fail",k,e.message+" — cópia bruta preservada",raw.length);
    loadFail[k]="o JSON gravado está corrompido (cópia bruta preservada)";
    return d;
  }
};
/* Devolve true/false em vez de estourar em silêncio. Confere relendo o que gravou. */
const save=(k,v)=>{
  let str;
  try{ str=JSON.stringify(v); }
  catch(e){ logIO("stringify-fail",k,e.message); return false; }
  try{ localStorage.setItem(k,str); }
  catch(e){ logIO("write-fail",k,e.message,str.length); return false; }
  try{ if(localStorage.getItem(k)!==str){ logIO("verify-fail",k,"releitura difere do gravado",str.length); return false; } }
  catch(e){ logIO("verify-fail",k,e.message); return false; }
  delete loadFail[k];   // gravou e releu igual: a chave voltou a ser confiável (import, restore)
  return true;
};

/* ---------- VALIDAÇÃO DE SESSÃO ---------- */
/* erros = bloqueiam o salvamento · avisos = informam, não bloqueiam */
function validateSession(s){
  const erros=[],avisos=[];
  if(!s||typeof s!=="object")return{erros:["sessão inexistente"],avisos:avisos,stats:{}};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date||""))erros.push("data ausente ou fora do formato AAAA-MM-DD");
  if(!s.day)erros.push("letra do treino ausente");
  if(!Array.isArray(s.exercises)||!s.exercises.length)erros.push("nenhum exercício com série preenchida");
  let sets=0,comReps=0,comCarga=0,vol=0;
  (s.exercises||[]).forEach((e,i)=>{
    const nome=((e&&e.n)||"").trim();
    if(!nome)erros.push("exercício "+(i+1)+" está sem nome");
    if(!Array.isArray(e.sets)){erros.push((nome||"exercício "+(i+1))+": lista de séries inválida");return;}
    if(!e.sets.length)avisos.push((nome||"exercício "+(i+1))+" ficou sem série");
    e.sets.forEach(st=>{
      sets++;
      const r=parseFloat(st.r),w=parseFloat(st.w);
      if(!isNaN(r)&&r>0){comReps++;if(!isNaN(w)&&w>0){comCarga++;vol+=w*r;}}
    });
  });
  if(!sets)erros.push("nenhuma série registrada");
  else if(!comReps)erros.push("as "+sets+" séries estão todas sem repetições");
  if(s.started&&s.finished&&s.finished<s.started)erros.push("término anterior ao início");
  /* P1.10 — "Finalizar com o que tem" carimba `finished` no dia em que ele lembrou, não no
     fim do treino: a duração resultante é verdadeira (é a diferença dos carimbos) e não é
     tempo de treino. Aviso, não erro — grava, mas não deixa passar calado um
     "DURAÇÃO 6612 min" na tela que existe pra mostrar o conteúdo real. 12 h nunca dispara
     num treino: a sessão mais longa do histórico tem 1h20. */
  if(s.started&&s.finished&&(s.finished-s.started)>12*36e5)
    avisos.push("finalizada "+Math.round((s.finished-s.started)/36e5)+" h depois de iniciada — a duração registrada é o intervalo entre os carimbos, não o tempo de treino");
  return{erros:erros,avisos:avisos,stats:{exercicios:(s.exercises||[]).length,sets:sets,
    comReps:comReps,comCarga:comCarga,vol:Math.round(vol),
    dur:(s.started&&s.finished)?Math.round((s.finished-s.started)/60000):null}};
}
function storageInfo(){
  let total=0;const det={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const v=localStorage.getItem(k)||"";
    det[k]=v.length;total+=v.length+k.length;}}catch(e){}
  return{total:total,det:det};
}

/* Letras avulsas que o código conhece. Template gravado no aparelho nunca lê o default, e o
   import substitui `templates` inteiro: sem isto o E não chegaria a nenhum iPhone. Só
   acrescenta o que FALTA — um E que já existe (editado ou vindo de backup) vence sempre. */
function garantirAvulso(){
  if(!templates||typeof templates!=="object")return [];
  const postos=[];
  Object.keys(DEFAULT_TEMPLATES).forEach(k=>{
    if(!DEFAULT_TEMPLATES[k].avulso||templates[k])return;
    templates[k]=JSON.parse(JSON.stringify(DEFAULT_TEMPLATES[k]));postos.push(k);});
  return postos;
}
function isAvulsoTpl(d){return !!(templates[d]&&templates[d].avulso);}
function semOpc(exs){return (exs||[]).filter(e=>!e.opc);}

/* Cada exercício da sessão ativa ganha um id estável. O "exercício ativo" passa a
   ser o do último set logado (ultimoExercicioId) — não a posição na lista. */
function ensureIds(a){
  if(!a||!Array.isArray(a.exercises))return a;
  let n=a.nextEid||0;
  a.exercises.forEach(e=>{if(!e.id)e.id="x"+(n++);});
  a.nextEid=n;
  return a;
}
/* Chamado sempre que uma série ganha repetições. Carimba o horário só na primeira
   vez (preserva quando foi feita de verdade) e move o "ativo" para este exercício.
   É a mesma fonte que alimenta a reordenação por última execução (execOrderOf). */
function touchSet(e,st){
  if(String(st.r==null?"":st.r).trim()==="")return;
  if(!st.t)st.t=Date.now();
  if(active){active.ultimoExercicioId=e.id;active.ultimoSetAt=Date.now();}
}
let templates = load(K.tpl, null) || DEFAULT_TEMPLATES;
let sessions  = load(K.sess, []);
let active    = ensureIds(load(K.active, null));   // retrocompat: sessão salva sem id

/* ---------- P7.1 (v1.14.1): espaço sobrando no nome do exercício ----------
   'Kick extension ' e 'Kick extension' são exercícios DIFERENTES pro app: os casamentos
   por nome são todos ===, e a diferença é invisível na tela porque o HTML já colapsa
   espaço em branco. O dropdown do Histórico mostrava duas entradas desenhadas idênticas,
   o Teto de carga contava dois tetos pro mesmo exercício, e o casamento com as notas do
   vault (que não têm o espaço) não fechava.

   Isto NÃO é a normalização de CAIXA que ficou de fora da v1.14.0. Lá havia decisão de
   produto: qual grafia vence, e o rótulo na tela mudava ('Overhead Banco' viraria
   'Overhead banco'), o app sobrescrevendo o que ele digitou. Aqui nenhum rótulo muda —
   'Supino ' JÁ era desenhado 'Supino' — e ninguém digita espaço à direita de propósito.

   NÃO-DESTRUTIVO: apara só a cópia em memória, na leitura. O localStorage não é
   reescrito aqui — nenhuma migração no boot, nenhum save() novo. Os nomes aparados
   chegam ao disco pelo próximo salvamento normal (finishSession/import), que já tem
   prova de releitura e tela de confirmação. Quantos foram aparados aparece em
   Ajustes → Diagnóstico de dados: unificar calado seria a cicatriz nº 2 de volta. */
function trimNome(s){return String(s==null?"":s).replace(/\s+/g," ").trim();}
const aparados={n:0, exemplos:[]};
function aparaNomes(lista,campo){
  (Array.isArray(lista)?lista:[]).forEach(o=>{
    ((o&&Array.isArray(o[campo]))?o[campo]:[]).forEach(e=>{
      if(!e)return;
      const t=trimNome(e.n);
      if(t===e.n)return;
      aparados.n++;
      if(aparados.exemplos.length<4&&aparados.exemplos.indexOf(t)<0)aparados.exemplos.push(t);
      e.n=t;});
  });
}
aparaNomes(Object.values(templates),"ex");        // a fonte: template sujo suja toda sessão nova

aparaNomes(active?[active]:[],"exercises");        // sessão em andamento nascida de template sujo
/* v1.17.0 — só em memória, como o apara acima: o disco recebe o E no próximo save(K.tpl)

/* ============ HELPERS ============ */
const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("on"),1600);}
function setVol(sets){return sets.reduce((a,s)=>a+(parseFloat(s.w)||0)*(parseFloat(s.r)||0),0);}
function targetSets(e){const m=String(e.sr||"").match(/^\s*(\d+)/);return m?+m[1]:0;}
function completedSets(e){return e.sets.filter(s=>s.r!==""&&s.r!=null).length;}
/* v1.18.0 (P8.2) — "série feita" é a que tem `t` E já foi fechada: pelo botão principal (marca
   `f`, que vive só em `active` e sai no finishSession) ou por uma pausa gravada (`rest`, o
   caminho ▶ Descanso → Próxima série de antes). Por que não só `t`: o touchSet carimba `t` ao
   digitar as reps, então a linha que ele está preenchendo já teria `t` e ganharia ✓ antes do
   toque — e o botão "Série N feita" nunca apareceria. A linha ABERTA é a última, se ainda não
   foi fechada; é nela que o botão principal age. */
function temReps(st){return String(st&&st.r!=null?st.r:"").trim()!=="";}
function fechada(st){return !!(st&&(st.f||st.rest!=null));}
function linhaAberta(e){const s=e.sets||[];const l=s[s.length-1];return (l&&!fechada(l))?s.length-1:-1;}
function seriesFeitas(e){return (e.sets||[]).filter(st=>st.t&&temReps(st)&&fechada(st)).length;}
function fmtAlvo(sec){return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");}
const INTER_REST=120; // descanso padrão entre exercícios (2min)
function topWeight(sets){return sets.reduce((a,s)=>Math.max(a,parseFloat(s.w)||0),0);}
function fmtClock(ts){if(!ts)return"--:--";const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
/* P1.11 — `finished` não está errado: registra que o botão foi apertado em 26/08 às 09h41.
   Errado era `durMin` chamar `finished - started` de DURAÇÃO DO TREINO. Dois conceitos com
   um nome só, que coincidem só quando o fecho é imediato — e em duas sessões não foi:
   14/08 marcava 1654 min e 21/08, 6614 min.
   A saída óbvia ("usar o último `t` de série") NÃO funciona: o finishSession faz
   `if(!st.t)st.t=sess.finished`, então 72 das 353 séries carimbadas (20,4%) carregam o
   instante do fecho. Nas duas quebradas o maior `t` É o `finished`, ao segundo. Por isso
   "carimbo real" exclui `t===finished`.
   Limiar de 30 min sai do dado, que é bimodal: gap mediano de 1,1 min, 17 de 19 abaixo de
   15 min, e depois NADA até 1601 e 6564 min. 20× acima do maior gap normal, 50× abaixo do
   menor quebrado. Resultado: 14/08 → 53 min, 21/08 → 50 min (mediana das normais: 51), e as
   outras 17 não mudam nem um minuto. Nada gravado muda — `started`, `finished` e todos os
   `t` ficam como estão, e o backup continua byte a byte igual. */
const DUR_GAP_TARDIO=30*60000;
/* Sem carimbo nenhum não dá pra reconstruir; sobra `finished - started`, que só é descartado
   quando é implausível como treino. 12 h é o mesmo teto que o validateSession já usa pra
   avisar — a sessão mais longa do histórico tem 1h21. Ver a nota no relatório da v1.10.1:
   a única sessão sem carimbo (2026-07-09) tem 47 min no mesmo dia, e devolver `null` ali
   trocaria um número bom por "não registrada". */
const DUR_MAX_PLAUSIVEL=12*36e5;
function ultimoSetReal(s){
  let mx=null;
  (s&&s.exercises||[]).forEach(e=>(e.sets||[]).forEach(st=>{
    if(!st.t||st.t===s.finished)return;          // carimbo posto no fecho não é evento do treino
    if(mx==null||st.t>mx)mx=st.t;}));
  return mx;
}
function durAtraso(s){                            // ms entre a última série e o clique, quando houve
  if(!s||!s.started||!s.finished)return null;
  const t=ultimoSetReal(s);
  return (t!=null&&(s.finished-t)>DUR_GAP_TARDIO)?(s.finished-t):null;
}
function durMin(s){
  if(!s||!s.started||!s.finished)return null;     // importada, sem carimbo: nada a dizer
  const t=ultimoSetReal(s);
  if(t!=null&&(s.finished-t)>DUR_GAP_TARDIO)return Math.max(1,Math.round((t-s.started)/60000));
  if(t==null&&(s.finished-s.started)>DUR_MAX_PLAUSIVEL)return null;   // cicatriz nº 1: não inventa
  return Math.max(1,Math.round((s.finished-s.started)/60000));
}
function fmtAtraso(ms){
  const min=Math.round(ms/60000);if(min<90)return min+" min depois";
  const h=Math.round(ms/36e5);if(h<36)return h+" h depois";
  const d=Math.round(ms/864e5);return d+(d===1?" dia depois":" dias depois");
}
/* A demora não é omitida: onde a duração aparece, a sessão reconstruída diz que foi fechada
   depois. Em `muted`, sem cor de alarme — é fato, e ele já mudou o comportamento. Sessão com
   carimbos de fecho e nenhum evento real diz "duração não registrada", nunca zero. */
function durTxt(s){
  const m=durMin(s);
  if(m==null)return (s&&s.started&&s.finished)?"duração não registrada":null;
  const atr=durAtraso(s);
  return m+" min"+(atr?" · finalizada "+fmtAtraso(atr):"");
}
function fmtDur(ms){const t=Math.max(0,Math.floor(ms/1000));const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),sec=t%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(sec).padStart(2,"0");}
let elapsedId=null;
function startElapsed(){clearInterval(elapsedId);
  const tick=()=>{if(!active){clearInterval(elapsedId);return;}
    const e=$("#trClock");if(e&&active.started)e.textContent=fmtDur(Date.now()-active.started);};   // v1.18.0: o relógio mora no cabeçalho do treino
  tick();elapsedId=setInterval(tick,1000);}
/* v1.15.0 — progresso de uma sessão em andamento. UMA função só, lida pelo herói da Home e
   pela barra da aba de treino (e, na P8.2, pelo cabeçalho do treino). Antes a barra contava
   "exercício com alguma linha de série", e a Home passaria a contar outra coisa: duas telas
   dizendo números diferentes sobre o mesmo treino.
   X = exercícios marcados como feitos E com ≥1 série com reps (pulado não conta).
   S = séries com reps — o que o finishSession guarda. Linha só com peso não é série. */
function progresso(act){
  const exs=(act&&Array.isArray(act.exercises))?act.exercises:[];
  let x=0,s=0;
  exs.forEach(e=>{const n=completedSets({sets:Array.isArray(e.sets)?e.sets:[]});s+=n;if(e.done&&n>=1)x++;});
  return {x:x,m:exs.length,s:s};
}
/* O exercício "do momento": o do último set logado, se ainda não foi concluído; senão o 1º não
   concluído; -1 se todos estão concluídos. É o alvo do `Continuar treino →` (P4.7) e o `AGORA`
   do herói — a mesma função, pra que a caixa nunca aponte um exercício e o toque leve a outro. */
/* v1.18.0 — o toque numa linha grava `focoId`, e ele vem primeiro (se não estiver feito). A Home
   e o "Continuar treino →" seguem a mesma regra que a tela de treino, pra nunca apontarem
   exercícios diferentes. */
function exercicioDoMomento(act){
  const exs=(act&&Array.isArray(act.exercises))?act.exercises:[];
  let i=act&&act.focoId?exs.findIndex(e=>e.id===act.focoId):-1;
  if(i>=0&&!exs[i].done)return i;
  i=act&&act.ultimoExercicioId?exs.findIndex(e=>e.id===act.ultimoExercicioId):-1;
  if(i<0||exs[i].done)i=exs.findIndex(e=>!e.done);
  return i;
}
/* Foco da tela de treino — spec P8 (c): 1) focoId (feito ou não: se está feito, foi ele que
   tocou nele; toda conclusão apaga o focoId que apontava pro concluído); 2) ultimoExercicioId
   não feito; 3) 1º não feito; 4) nenhum (-1). */
function focoIdx(act){
  const exs=(act&&Array.isArray(act.exercises))?act.exercises:[];
  const i=act&&act.focoId?exs.findIndex(e=>e.id===act.focoId):-1;
  return i>=0?i:exercicioDoMomento(act);
}
function concluir(e){e.done=true;delete e.open;if(active&&active.focoId===e.id)delete active.focoId;}
/* v1.18.0 — a barra só aparece com descanso em curso (startRest a liga, stopRest a desliga). */
function updateSessionBar(){const sb=$("#sessionbar");if(!sb)return;
  if(tab==="log"&&active){startElapsed();resumeRest();if(!swId)sb.classList.remove("on","resting","over");}
  else{sb.classList.remove("on","resting","over");clearInterval(swId);swId=null;clearInterval(elapsedId);}}

/* ============ CRONÔMETRO DE DESCANSO (conta pra cima, grava a pausa real) ============ */
let swId=null, swStart=0, swTarget=0, swExIdx=-1, swBeeped=false;
const REST_MAX_RESUME_MS=2*60*60*1000;   // carimbo mais velho que isto não é pausa, é aba esquecida
/* `resumeTs` = retomada (reload ou volta de outra aba). O swStart já era timestamp
   absoluto, então app em background nunca distorceu a contagem — o buraco era que ele
   vivia só em memória: persistActive() salvava `active` sem ele e o reload zerava a
   pausa. Agora o carimbo mora em active.restTimer. */
function startRest(exIdx,resumeTs){const e=active.exercises[exIdx]||{};swExIdx=exIdx;
  swStart=resumeTs||Date.now();swBeeped=false;
  if(!resumeTs){
    if(e.id&&active){active.ultimoExercicioId=e.id;active.ultimoSetAt=Date.now();}
    if(active){active.restTimer={s:swStart,i:exIdx};persistActive();}
  }
  const inter=descansoEntre(e);
  swTarget=inter?INTER_REST:(e.rest||0);
  if(resumeTs&&swTarget&&(Date.now()-swStart)/1000>=swTarget)swBeeped=true;  // a meta passou antes do reload: não bipa retroativo
  /* v1.18.0 — a barra diz DE QUAL exercício é o descanso: ele pode abrir outro no meio da pausa. */
  /* O nome vai numa linha própria: numa só, "DESCANSO · Supino reto - banco · alvo 2:30" corta o alvo em 390 px. */
  const lb=$("#sbRestLbl");if(lb)lb.textContent=(inter?"ENTRE EXERCÍCIOS":"DESCANSO")+(swTarget?" · alvo "+fmtAlvo(swTarget):"");
  const lx=$("#sbRestEx");if(lx)lx.textContent=e.n||"";
  const nx=$("#sbNext");if(nx)nx.textContent=inter?"Próximo exercício":"Próxima série";
  const sb=$("#sessionbar");if(sb){sb.classList.add("on","resting");sb.classList.remove("over");}swTick();clearInterval(swId);swId=setInterval(swTick,250);}
/* Alvo do descanso — spec P8 (c): séries FEITAS contra o alvo, não linhas com reps (linha
   pré-preenchida não é série feita). A linha aberta conta se já foi tocada (`t` + reps): é o
   caminho ▶ Descanso, em que a série descansada ainda não foi fechada. */
function descansoEntre(e){
  const alvo=targetSets(e);if(!alvo)return false;
  const ia=linhaAberta(e),la=ia>=0?e.sets[ia]:null;
  return seriesFeitas(e)+((la&&la.t&&temReps(la))?1:0)>=alvo;
}
function swTick(){const sec=Math.floor((Date.now()-swStart)/1000);
  const over=swTarget&&sec>=swTarget;
  const e2=$("#sbRestT");if(e2){const mm=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
    e2.textContent=over?"+"+mm:mm;}
  const sb=$("#sessionbar");if(sb)sb.classList.toggle("over",!!over);
  if(over&&!swBeeped){swBeeped=true;beep();}}
/* `Próxima série`. v1.18.0: NÃO sobrescreve mais o `t` da série — antes `ls.t=Date.now()`
   trocava o fim da série pelo fim da pausa. Só carimba se não houver. A pausa continua sendo
   gravada em `rest` exatamente como antes, pelos dois caminhos (botão principal ou ▶ Descanso). */
function markLap(){const sec=Math.round((Date.now()-swStart)/1000);
  const e=active.exercises[swExIdx];
  if(e){active.ultimoExercicioId=e.id;active.ultimoSetAt=Date.now();
    if(e.sets.length){const ls=e.sets[e.sets.length-1];ls.rest=sec;
      if(temReps(ls)){if(!ls.t)ls.t=Date.now();ls.f=1;}}
    if(targetSets(e)&&seriesFeitas(e)>=targetSets(e))concluir(e);   // alvo atingido → conclui; o foco vai pro próximo não feito
    else{const last=e.sets[e.sets.length-1]||{};e.sets.push({w:last.w||"",r:last.r||""});}
    persistActive();}
  stopRest();render();
  toast(sec+"s registrado");}
function stopRest(){clearInterval(swId);swId=null;
  if(active&&active.restTimer){delete active.restTimer;persistActive();}
  const sb=$("#sessionbar");if(sb)sb.classList.remove("on","resting","over");
  if(tab==="log"&&active&&$("#app .tr-main"))render();}   // o botão do foco sai de "Descansando…"
/* Chamado a cada render da aba de treino: reload ou volta de outra aba recuperam a
   pausa em curso pelo carimbo salvo, em vez de perdê-la. */
function resumeRest(){
  if(swId)return;                                        // já contando
  const r=active&&active.restTimer;
  if(!r||!active.exercises[r.i])return;
  /* Retomar um cronômetro de 6 horas seria afirmar uma pausa que não existiu: a aba ficou
     aberta, ele não descansou. Descarta o carimbo e volta pra sessionbar em repouso. */
  if(Date.now()-r.s>REST_MAX_RESUME_MS){delete active.restTimer;persistActive();return;}
  startRest(r.i,r.s);
}
/* ============ ALARME DE FIM DE DESCANSO (P5.1) ============ */
/* Isto nunca tocou no iPhone. O beep antigo criava o AudioContext DENTRO da função, que é
   chamada do tick do cronômetro — no iOS um contexto criado fora de gesto do usuário nasce
   `suspended` e não emite som. E o `catch(e){}` vazio engolia a evidência: 81 sessões de
   descanso terminando em silêncio sem nenhum rastro. O `navigator.vibrate` que vinha junto
   não é implementado pelo Safari do iOS — era código que parecia fazer algo e saiu.
   Agora o contexto é criado e retomado no gesto que já existe e está no lugar certo: o
   toque em ▶ Descanso, que é o que inicia a contagem. E o estado é dito na tela, porque
   alarme que falha calado é exatamente o que não pode voltar. */
let audioCtx=null, audioMsg="ainda não testado";
function audioEstado(){return audioMsg;}
/* SÓ chamar de dentro de um gesto do usuário — fora dele o iOS ignora e o estado fica
   `suspended`, que é o bug que este item conserta. */
function armAudio(cb){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){audioMsg="este navegador não tem Web Audio";logIO("audio-fail","beep",audioMsg);if(cb)cb(false);return;}
  try{ if(!audioCtx)audioCtx=new AC(); }
  catch(e){audioMsg="o navegador recusou criar o áudio: "+e.message;logIO("audio-fail","beep",e.message);if(cb)cb(false);return;}
  try{ // buffer mudo tocado dentro do gesto: é o que destrava o áudio no iOS
    const s=audioCtx.createBufferSource();s.buffer=audioCtx.createBuffer(1,1,22050);
    s.connect(audioCtx.destination);s.start(0);
  }catch(e){}
  const fim=()=>{const ok=audioCtx.state==="running";
    audioMsg=ok?"liberado":"o navegador manteve o áudio suspenso ("+audioCtx.state+")";
    if(!ok)logIO("audio-fail","beep",audioMsg);
    if(cb)cb(ok);};
  if(audioCtx.state==="suspended"){try{audioCtx.resume().then(fim,fim);}catch(e){fim();}}
  else fim();
}
function beep(){
  if(!audioCtx||audioCtx.state!=="running"){
    audioMsg="não tocou — o áudio não estava liberado ("+(audioCtx?audioCtx.state:"nenhum contexto criado")+")";
    logIO("beep-fail","descanso",audioMsg);   // vira linha vermelha em Ajustes → Diagnóstico
    return false;
  }
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=880;g.gain.value=.12;
    o.start();setTimeout(()=>{try{o.stop();o.disconnect();g.disconnect();}catch(e){}},450);
    audioMsg="tocou às "+new Date().toTimeString().slice(0,8);
    return true;
  }catch(e){audioMsg="falhou ao tocar: "+e.message;logIO("beep-fail","descanso",e.message);return false;}
}

/* ============ TECLADO (P5.4) ============ */
/* O visualViewport é a única fonte da altura do teclado no iOS. Sem ele (navegador
   antigo) nada muda: a barra fica onde sempre esteve e o app não fica pior. */
let kbPx=0;
function trackKeyboard(){
  const vv=window.visualViewport;if(!vv)return;
  let ult=-1;
  const upd=()=>{
    const bruto=Math.round(window.innerHeight-(vv.height+vv.offsetTop));
    const h=bruto>90?bruto:0;      // <90px é a barra do Safari encolhendo, não teclado
    if(h===ult)return;ult=h;kbPx=h;
    document.documentElement.style.setProperty("--kb",h+"px");
    document.body.classList.toggle("kb",h>0);
  };
  vv.addEventListener("resize",upd);vv.addEventListener("scroll",upd);upd();
}
/* O iOS rola sozinho até o campo focado, mas não sabe que existe uma barra fixa por
   cima dele. Reserva a altura da barra quando ela está na tela e só rola se o campo
   ficou mesmo coberto — rolar sempre trocaria um problema por um solavanco. */
function keepFieldVisible(i){
  setTimeout(()=>{
    if(document.activeElement!==i||!i.isConnected)return;
    const vv=window.visualViewport;
    const sb=$("#sessionbar");
    const reserva=(sb&&sb.classList.contains("on"))?98:12;
    const hd=$(".tr-head");   // v1.18.0: o cabeçalho fixo do treino cobre o topo — campo nunca fica sob ele
    const topo=(vv?vv.offsetTop:0)+8+(hd?hd.getBoundingClientRect().height:0);
    const base=(vv?vv.offsetTop+vv.height:window.innerHeight)-reserva;
    const r=i.getBoundingClientRect();
    /* v1.18.0 (P8.2, aceite 10): além do campo, o botão principal do foco ("Série N feita")
       deve ficar à vista com o teclado aberto — rola só o que falta, sem pôr o campo sob o
       cabeçalho. Se não couberem os dois, vale o campo (e tocar no card fecha o teclado, P5.4). */
    const bt=i.closest(".ex")&&i.closest(".ex").querySelector(".tr-main");
    const falta=bt?bt.getBoundingClientRect().bottom-base:0;
    if(r.top>=topo&&r.bottom<=base&&falta>0&&r.top-falta>=topo)window.scrollBy(0,falta);
    else if(r.bottom>base||r.top<topo){
      const alvo=bt&&(bt.getBoundingClientRect().bottom-r.top)<=(base-topo)?bt.getBoundingClientRect().bottom-base:(r.top+r.bottom)/2-(topo+base)/2;
      window.scrollBy(0,alvo);
    }
  },320);   // o teclado do iOS leva ~250ms pra terminar de subir
}

/* ---------- HOME ---------- */
/* ---------- P1.10: a sessão órfã ---------- */
/* Uma sessão iniciada e não finalizada vive só em K.active. O backup é
   JSON.stringify({templates,sessions,cfg}) — `active` NÃO entra, e por decisão de produto
   continua não entrando (carregá-la faria o restore ressuscitar um fantasma e envenenaria
   sessVol, o contador da semana e o refSessionFor). O problema nunca foi o backup não
   levar: é ela ficar órfã sem ninguém avisar. Então o conserto é de apresentação, nas
   duas telas onde ele já olha — a Home e o bloco de backup.
   Critério é a data, não aritmética de horas: ele não treina atravessando a meia-noite. */
function isOrfa(){return !!(active&&active.date&&active.date!==today());}
function ddmm(d){const p=String(d||"").split("-");return p.length===3?p[2]+"/"+p[1]:String(d||"");}

/* ---------- v1.15.0 — Home nova (P7.1) ----------
   Uma pergunta, respondida antes da porta da academia: "qual treino agora?". O herói ocupa o
   topo com UMA resposta, e o que mais existe fica abaixo dele. Prioridade do lugar do herói
   (um só aparece, nesta ordem — spec P7 (b)):
     1. a sessão gravada não pôde ser lida  → card de erro (cicatriz nº 1)
     2. sessão de outro dia (órfã)          → Finalizar com o que tem / Descartar
     3. sessão de hoje em andamento         → herói em treino (progresso)
     4. o histórico não pôde ser lido       → SEM herói: recomendar "o mais parado" sem
                                              histórico seria inventar
     5. nada disso                          → herói ocioso: o mais parado
   A regra de escolha é a do P4.10 e não muda: ela só ganha um lugar. */
const DIASEM=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const MESX=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function dataExtenso(){const d=new Date();return DIASEM[d.getDay()]+", "+d.getDate()+" de "+MESX[d.getMonth()];}
function diasDe(d){const l=lastSessionFor(d);return l?daysSince(l.date):null;}
/* v1.20.0 — P10.2: o herói e a régua olham só o CICLO ATUAL. No 1º dia do C5 as letras A–D
   tinham a idade do C4 e o F (nunca treinado) virava herói; e o 1º A do C5 abria na ordem do
   último A do C4. A idade EXIBIDA continua a do histórico inteiro (é fato); a ORDEM usa a do
   ciclo. Ciclo comparado sem espaço nas pontas (cfg.ciclo é texto livre em Ajustes). Sem
   cfg.ciclo, não há recorte: todo o histórico conta, como antes. */
function cicloKey(c){return String(c==null?"":c).trim();}
function doCiclo(s,c){const k=cicloKey(c===undefined?cfg.ciclo:c);return !k||cicloKey(s.ciclo)===k;}
function lastSessionCiclo(d){const f=sessions.filter(s=>s.day===d&&doCiclo(s));return f.length?f[f.length-1]:null;}
function diasNoCiclo(d){const l=lastSessionCiclo(d);return l?daysSince(l.date):null;}
/* Letra condicional (`condicional:true` no template, o F do C5): regra do plano, "o Treino 5 só
   existe se os Treinos 1 a 4 já foram feitos na semana". Só entra na disputa do herói quando
   TODAS as letras de rotação não condicionais têm sessão registrada (não avulsa) na semana
   corrente. A sessão em andamento não conta, como no semanaCard. Conta na meta normalmente. */
function letrasRotacao(){return Object.keys(templates).filter(d=>!isAvulsoTpl(d)).sort();}
function isCondicionalTpl(d){return !!(templates[d]&&templates[d].condicional===true);}
function letrasBase(){return letrasRotacao().filter(d=>!isCondicionalTpl(d));}
function faixaLetras(ls){   // ["A","B","C","D"] → "A–D"; fora de sequência, "A, C"
  const seq=ls.length>2&&ls.every((l,i)=>l.length===1&&(!i||l.charCodeAt(0)===ls[i-1].charCodeAt(0)+1));
  return seq?ls[0]+"–"+ls[ls.length-1]:ls.join(", ");}
function condicionalBloqueada(d){
  if(!isCondicionalTpl(d))return false;
  const [ini,fim]=weekRange();
  const feitas=new Set(sessions.filter(s=>s.date>=ini&&s.date<=fim&&s.avulso!==true).map(s=>String(s.day)));
  return letrasBase().some(L=>!feitas.has(L));
}
function idadeTxt(n){return n===null?"nunca treinado":n===0?"hoje":n===1?"ontem":"há "+n+" dias";}
/* P4.10 — a ordem A,B,C,D era o calendário do plano, que não existe mais: não há
   getDay() em lugar nenhum do arquivo. Ordenada por dias sem treinar, a posição passa a
   significar "o que você deve", que é um invariante melhor que "a letra A vem primeiro".
   Reordenar aqui é seguro e no P4.7 não é: aqui a ordem só muda ENTRE visitas, depois de
   um treino terminar — nunca embaixo do polegar no meio de uma série.
   Sem histórico legível, a ordem é a da letra: não há base pra recomendar nada. */
function ordemTreinos(falhou){
  const letras=Object.keys(templates).filter(d=>!isAvulsoTpl(d));   // v1.17.0: avulso nunca é herói
  if(falhou)return letras.slice().sort();
  const ord=letras.slice().sort((x,y)=>{
    const a1=diasNoCiclo(x),b1=diasNoCiclo(y);   // v1.20.0: idade no ciclo atual
    if(a1===null&&b1===null)return x<y?-1:1;
    if(a1===null)return -1;               // sem treino no ciclo vai pro topo…
    if(b1===null)return 1;
    if(a1!==b1)return b1-a1;              // …e o resto, mais dias sem treinar primeiro
    return x<y?-1:1;                      // empate de data: desempata pela letra
  });
  /* v1.20.0 — letra condicional bloqueada vai pro fim: nunca é herói e fica depois das letras
     que ela espera, como no Figma (tile F depois do D). Desbloqueada, disputa pela idade. */
  return ord.filter(d=>!condicionalBloqueada(d)).concat(ord.filter(condicionalBloqueada));
}
let homeDia=null;   // dia do último render da Home — a virada de semana/dia re-renderiza
function renderHome(a){
  homeDia=today();
  const h=el("div","row");h.style.alignItems="flex-start";h.style.marginBottom="14px";
  h.innerHTML="<div style='flex:1;min-width:0'><div class='muted'>"+esc(dataExtenso())+"</div>"+
    "<h1 style='margin:2px 0 0;font-size:26px'>Treino</h1></div>"+
    "<span class='pill' style='margin-top:4px'>"+esc(cfg.ciclo)+" · "+esc(cfg.plano)+"</span>";
  a.appendChild(h);

  const actFail=readFailed(K.active), falhou=readFailed(K.sess);
  const ordem=ordemTreinos(falhou);
  const modo=(actFail&&!active)?"erro":(active&&isOrfa())?"orfa":active?"treino":falhou?"semhist":"ocioso";

       atrás. finishSession() já descarta série em branco e exercício sem série, e
       validateSession() já barra com erro nomeado quando não sobrou nada — se não houver

    const d=el("button","btn-danger","Descartar");d.style.width="100%";d.style.marginTop="8px";
    d.onclick=()=>{if(confirm("Descartar este treino? Os dados não serão salvos."))
      {descartarAtiva();go("home");}};   // v1.18.0: grava `discard` no iolog, como o ⋯ do treino
    c.appendChild(f);c.appendChild(d);a.appendChild(c);
  }else if(modo==="treino"){
    a.appendChild(heroiEmTreino());
  }else if(modo==="ocioso"&&ordem.length){
    a.appendChild(heroiOcioso(ordem[0]));

  /* Outros treinos. Em treino, some: tocar num tile só levaria ao confirm de descartar.
     `inicio` só é gravado quando havia herói na tela pra contrariar — sem herói (erro, órfã,
     histórico ilegível) a escolha não diz nada sobre a regra do "mais parado". */
  if(modo!=="treino"){
    const tiles=modo==="ocioso"?ordem.slice(1):ordem;
    if(falhou)a.appendChild(el("div","muted","histórico não pôde ser lido — ordem do template · ver Ajustes → Diagnóstico de dados"));
    if(!ordem.length)a.appendChild(el("div","empty","<div>Nenhum treino cadastrado · ver Ajustes → Editar treinos</div>"));
    /* v1.17.0 — o avulso vem sempre por último e na linha inteira: com 3 colunas e 3 letras
       no ocioso, ele nunca fica órfão no meio de uma linha. */
    const avulsos=Object.keys(templates).filter(isAvulsoTpl).sort();
    if(tiles.length||avulsos.length){
      a.appendChild(el("div","muted",modo==="ocioso"?"Outros treinos":"Escolher treino")).style.margin="4px 0 8px";
      const g=el("div","daygrid hm-tiles");
      tiles.forEach(d=>g.appendChild(tileTreino(d,falhou,modo==="ocioso"?"outro":null)));
      /* v1.20.0 — com 4 tiles (C5: 5 letras − herói) sobra uma letra sozinha na última linha:
         o E (um só) ocupa as 2 colunas ao lado dela em vez de deixar um buraco. Com 3 ou 6
         tiles (ou 2/5, onde sobraria 1 coluna), linha inteira, como antes. */
      const meia=avulsos.length===1&&tiles.length%3===1;
      avulsos.forEach(d=>g.appendChild(tileAvulso(d,falhou,meia)));
      a.appendChild(g);
    }
  }

  a.appendChild(semanaCard());

  if(sessions.length&&!falhou){
    const hd=el("div","row");hd.style.margin="4px 0 8px";
    hd.appendChild(el("h3",null,"Recentes")).style.cssText="flex:1;margin:0";
    const vh=el("button","btn-ghost btn-sm","Ver histórico →");vh.onclick=()=>go("hist");
    hd.appendChild(vh);a.appendChild(hd);
    /* 3, não 5: a Home é a porta da academia, não o Histórico. O 📋 Markdown saiu daqui e
       continua no detalhe da sessão, no Histórico — nada se perde. */
    const c=el("div","card");c.style.padding="4px 16px";
    sessions.slice(-3).reverse().forEach(s=>{
      const r=el("div","sess");
      const dt=durTxt(s);
      r.innerHTML="<div class='row' style='min-width:0'><span class='dot'>"+esc(s.day)+"</span><div style='min-width:0'>"+
        "<div style='font-weight:600'>"+esc(templates[s.day]?templates[s.day].name:s.day)+"</div>"+
        (dt?"<div class='muted'>"+esc(dt)+"</div>":"")+"</div></div>"+
        "<div class='muted' style='text-align:right;flex:0 0 auto;margin-left:10px'>"+esc(ddmm(s.date))+" · "+
        Math.round(sessVol(s)).toLocaleString("pt-BR")+" kg·rep</div>";
      c.appendChild(r);
    });
    a.appendChild(c);
  }
}

/* ---------- HOME: as duas perguntas (P4.1 e P4.10) ---------- */
/* 10 dias não é número inventado: 4 letras ÷ 3 sessões/semana (a meta que a R6 baixou) dá
   um ciclo de 9,3 dias. Passar disso significa ter pulado um ciclo inteiro daquela letra.
   Colore o número, não um selo de "atrasado" — é fato, não punição.
   v1.20.0 — a constante virou a própria conta, para não envelhecer na próxima troca de meta
   ou de plano: ceil(7 × letras de rotação não condicionais ÷ meta). A–D com meta 3 → 10 (o de
   antes, e o do C5: o F condicional não entra); 5 letras com meta 5 → 7. Sem letra, 1 (não há
   tile para colorir). */
function diasAlerta(){return Math.max(1,Math.ceil(7*letrasBase().length/weekGoal()));}
const WEEK_GOAL_DEFAULT=3;
/* Sai do cfg, não do código: o 216 min/mês do cardio virou meta fóssil porque estava
   hardcoded, e a R6 já baixou esta de 4 pra 3. Campo em Ajustes resolve sem release. */
function weekGoal(){const n=parseInt(cfg.weekGoal,10);return (n>0&&n<=14)?n:WEEK_GOAL_DEFAULT;}
// dias inteiros entre uma data AAAA-MM-DD e hoje, hora local (sem UTC no meio)
function daysSince(s){const p=String(s).split("-");
  const a=new Date(+p[0],+p[1]-1,+p[2]),h=new Date();
  return Math.floor((new Date(h.getFullYear(),h.getMonth(),h.getDate())-a)/864e5);}
// segunda a domingo da semana corrente, hora local
function weekRange(){const h=new Date();const x=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  const seg=new Date(x);seg.setDate(x.getDate()-((x.getDay()+6)%7));
  const dom=new Date(seg);dom.setDate(seg.getDate()+6);
  const f=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return [f(seg),f(dom)];}
/* A palavra é "registrados", não "treinos": em agosto foram 11 treinos e 9 registros no app.
   Num app cuja tese é aderência, um contador que erra pra baixo puniria justamente os dias
   em que ele treinou e não anotou — a direção mais cara. O número descreve o registro.
   v1.15.0 — os sete dias ganham a letra do que foi REGISTRADO em cada um. A sessão em
   andamento NÃO conta e NÃO pinta cheio (o Figma em treino dizia "3 de 3 ✓": contava o que
   ainda não foi salvo, cicatriz nº 2): ela aparece em contorno no dia de hoje, e a linha de
   baixo diz quanto vai dar ao terminar. Dia vazio é neutro — fato, não punição.
   Estados: ilegível (diz que não veio), zero (aparece, a leitura funcionou), parcial, cheio.
   Não há "carregando": a leitura é síncrona do localStorage. */
const SEMLB=["S","T","Q","Q","S","S","D"], SEMNOME=["segunda","terça","quarta","quinta","sexta","sábado","domingo"];

  const n=sem.filter(s=>s.avulso!==true).length;

  sem.forEach(s=>{const m=s.avulso===true?avDia:porDia;(m[s.date]=m[s.date]||[]).push(String(s.day));});

          :(n>=meta?"Meta batida":"Falta "+(meta-n)+" para a meta")+" · conta os treinos registrados neste app";

    "<div class='hm-semana'>"+dias+"</div>"+
